name: "Synthetica 2.0 experiment — compile evidence, DO NOT FLASH"

on:
  workflow_dispatch:
  push:
    branches:
      - arena/96cbd65a-synthentica
    paths:
      - '.github/workflows/synthetica2-experimental.yml'
      - 'build-kit/ci/synthetica2-experimental/**'
      - 'build-kit/scripts/build_synthetica2_experimental.py'
      - 'tests/test_synthetica2_experimental.py'

permissions:
  contents: read

concurrency:
  group: synthetica2-experimental-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: neutron
            mglru: 'on'
          - compiler: clang18
            mglru: 'on'
          - compiler: neutron
            mglru: 'off'
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install host tools and baseline LLVM 18
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 lld-18 llvm-18 \
            gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc flex bison libssl-dev libelf-dev device-tree-compiler \
            cpio lz4 xz-utils zstd python3 patch openssl zip rsync git curl binutils kmod
          clang-18 --version
          ld.lld-18 --version

      - name: Download and verify pinned Neutron release
        if: matrix.compiler == 'neutron'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/neutron-clang-06092026.tar.zst"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          echo "531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30  $archive" | sha256sum -c -
          test "$(stat -c %s "$archive")" = 77768187
          mkdir "$RUNNER_TEMP/neutron"
          tar -I zstd -xf "$archive" -C "$RUNNER_TEMP/neutron"
          test -x "$RUNNER_TEMP/neutron/bin/clang"
          test -x "$RUNNER_TEMP/neutron/bin/ld.lld"
          # Do not pipe through head: a glibc/exec error must fail this step.
          "$RUNNER_TEMP/neutron/bin/clang" --version
          "$RUNNER_TEMP/neutron/bin/ld.lld" --version
          echo "S2X_TOOLCHAIN_BIN=$RUNNER_TEMP/neutron/bin" >> "$GITHUB_ENV"

      - name: Select baseline LLVM 18
        if: matrix.compiler == 'clang18'
        run: echo 'S2X_TOOLCHAIN_BIN=/usr/lib/llvm-18/bin' >> "$GITHUB_ENV"

      - name: Run host safeguards
        run: python3 -m unittest discover -s tests -p 'test_synthetica2_experimental.py' -v

      - name: Prepare isolated 2.0 kit
        run: |
          set -euo pipefail
          python3 build-kit/scripts/build_synthetica2_experimental.py prepare \
            --source build-kit \
            --destination "$RUNNER_TEMP/s2x-kit" \
            --baseline artifacts/generated.config.txt \
            --mglru '${{ matrix.mglru }}'

      - name: Compile kernel and same-build modules without any installer
        timeout-minutes: 75
        env:
          SP_JOBS: '4'
          SP_RELEASE_VERSION: '2.0-exp'
          SP_PROFILE: synthetica
          SP_BUILD_NAME: Synthetica
          SP_BUILD_KVER: '2.0-exp'
          SP_EXPECT_RELEASE: 4.14.357-openela-Synthetica-2.0-exp
          PYTHONOPTIMIZE: '0'
        run: |
          set -euo pipefail
          export SP_WORK_DIR="$RUNNER_TEMP/s2x-work"
          export S2X_HELPER="$GITHUB_WORKSPACE/build-kit/scripts/build_synthetica2_experimental.py"
          export S2X_BASELINE="$GITHUB_WORKSPACE/artifacts/generated.config.txt"
          if ! python3 "$RUNNER_TEMP/s2x-kit/scripts/build_chronicle_base.py"; then
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 's2x-kit/artifacts/build.log'
          text = log.read_text(errors='replace') if log.exists() else 'No build.log was written'
          rows = text.splitlines()
          matches = [i for i, row in enumerate(rows) if re.search(
              r'error:|fatal error|undefined reference|\bFAIL\b|missing .*tool|not found|No rule to make target', row, re.I)]
          chosen = []
          for i in matches[-12:]:
              chosen.extend(rows[max(0, i - 1):min(len(rows), i + 3)])
          if not chosen:
              chosen = rows[-40:]
          text = '\n'.join(dict.fromkeys(chosen))[-12000:]
          text = re.sub(r'https?://\S+', '<url>', text)
          text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', text)
          for part, start in enumerate(range(0, len(text), 2400), 1):
              chunk = text[start:start + 2400].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Experimental build diagnostic ' + str(part) + '::' + chunk)
          PY
            exit 1
          fi

      - name: Verify image, config, manager identity and same-build modules
        env:
          COMPILER_KIND: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$COMPILER_KIND" = neutron ]; then
            extra+=(--neutron-archive "$RUNNER_TEMP/neutron-clang-06092026.tar.zst")
          fi
          if ! python3 build-kit/scripts/build_synthetica2_experimental.py finish \
            --kit "$RUNNER_TEMP/s2x-kit" \
            --out "$RUNNER_TEMP/s2x-work/tree/out-synthetica" \
            --baseline artifacts/generated.config.txt \
            --result "$RUNNER_TEMP/s2x-result" \
            --compiler "$COMPILER_KIND" --toolchain-bin "$S2X_TOOLCHAIN_BIN" \
            --mglru '${{ matrix.mglru }}' "${extra[@]}" \
            2> "$RUNNER_TEMP/s2x-finish-error.txt"; then
            cat "$RUNNER_TEMP/s2x-finish-error.txt"
            python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 's2x-finish-error.txt').read_text(errors='replace')[-3000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Experimental verification diagnostic::' + text)
          PY
            exit 1
          fi

      - name: Upload compile-only evidence (no installer or keys)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Synthetica-2.0-${{ matrix.compiler }}-MGLRU-${{ matrix.mglru }}-DO-NOT-FLASH-${{ github.run_id }}
          path: ${{ runner.temp }}/s2x-result/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Synthetica-2.0-${{ matrix.compiler }}-MGLRU-${{ matrix.mglru }}-FAILED-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s2x-kit/artifacts/build.log
            ${{ runner.temp }}/s2x-kit/artifacts/FAILED.txt
          if-no-files-found: warn
          retention-days: 7

  compare-neutron-mglru:
    name: Compare Neutron MGLRU on/off configs (no device test)
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download MGLRU-on compile evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Synthetica-2.0-neutron-MGLRU-on-DO-NOT-FLASH-${{ github.run_id }}
          path: ${{ runner.temp }}/mglru-on
      - name: Download MGLRU-off control evidence
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Synthetica-2.0-neutron-MGLRU-off-DO-NOT-FLASH-${{ github.run_id }}
          path: ${{ runner.temp }}/mglru-off
      - name: Verify the control differs only in the intended config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          temp = Path(os.environ['RUNNER_TEMP'])
          spec = importlib.util.spec_from_file_location('s2x', root / 'build-kit/scripts/build_synthetica2_experimental.py')
          s2x = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(s2x)
          baseline = s2x.v3.verified_baseline(root / 'artifacts/generated.config.txt')
          variants = {}
          for mode in ('on', 'off'):
              directory = temp / ('mglru-' + mode)
              status = json.loads((directory / 'STATUS.json').read_text())
              config = (directory / 'generated.config.txt').read_bytes()
              image = (directory / 'Image.gz.DO-NOT-FLASH').read_bytes()
              if (status['kind'] != 'EXPERIMENTAL_COMPILED_ONLY_DO_NOT_FLASH' or
                  status['release'] != s2x.EXPECTED_RELEASE or status['compiler']['kind'] != 'neutron' or
                  status['mglru']['variant'] != mode or status['mglru']['enabled_by_default'] != (mode == 'on') or
                  status['installer_created'] or status['private_key_exported'] or
                  status['config_sha256'] != hashlib.sha256(config).hexdigest() or
                  status['image_sha256'] != hashlib.sha256(image).hexdigest()):
                  raise ValueError(f'invalid {mode} compile evidence')
              variants[mode] = {'status': status, 'config': config.decode('utf-8')}
          a, b = (variants[x]['status'] for x in ('on', 'off'))
          for field in ('clang_sha256', 'lld_sha256', 'neutron_archive_sha256'):
              if a['compiler'][field] != b['compiler'][field]:
                  raise ValueError('toolchain differs between on/off controls: ' + field)
          if a['base_source'] != b['base_source']:
              raise ValueError('kernel source differs between on/off controls')
          diff = s2x.compare_mglru_configs(baseline, variants['on']['config'], variants['off']['config'])
          summary = {'kind': 'STATIC_COMPARISON_ONLY_NOT_A_DEVICE_TEST',
                     'config_difference': diff, 'compiler': 'neutron',
                     'on_image_sha256': a['image_sha256'], 'off_image_sha256': b['image_sha256'],
                     'on_module_layout_crc': a['module_layout_crc'], 'off_module_layout_crc': b['module_layout_crc'],
                     'rom_compatibility': 'NOT VERIFIED', 'device_runtime': 'NOT TESTED'}
          output = temp / 'mglru-comparison.json'
          output.write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload static control comparison (not a flashable package)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Synthetica-2.0-neutron-MGLRU-control-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/mglru-comparison.json
          if-no-files-found: error
          retention-days: 7
