name: "Simpan satu build Synthetica 3.0 yang terverifikasi (jangan flash)"
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: ['.github/workflows/synthetica3-collect.yml']

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arena/96cbd65a-syntenthica
          fetch-depth: 0
      - name: Recover exactly the successful build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected='8f9608ea37ec88f6d137d19e4632844e41cb10be'
          gh run view 41957764426 --json status,conclusion,headSha \
            --jq 'select(.status == "completed" and .conclusion == "success") | .headSha' | grep -Fx "$expected"
          meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13384352541" \
            --jq 'select(.expired == false and .workflow_run.id == 41957764426 and .workflow_run.head_sha == "8f9608ea37ec88f6d137d19e4632844e41cb10be") | .digest')
          [ "$meta" = 'sha256:f2e6f93542d808f9ff0049f7d7fcb08dbc35bcb19ca0c8ee0a904d89afd6eb6b' ]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13384352541/zip" > "$RUNNER_TEMP/synthetica3.zip"
          echo 'f2e6f93542d808f9ff0049f7d7fcb08dbc35bcb19ca0c8ee0a904d89afd6eb6b  '"$RUNNER_TEMP/synthetica3.zip" | sha256sum -c -
          python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          modules = {'tcp_bic', 'tcp_westwood', 'tcp_htcp', 'gspca_main', 'rmnet_perf', 'rmnet_shs'}
          allowed = {'DO-NOT-FLASH-Synthetica-3.0-Image.gz', 'generated.config.txt',
                     'Module.symvers.txt', 'System.map.txt', 'kernel-module-public-cert.x509',
                     'STATUS.json', 'README-DO-NOT-FLASH.txt', 'SHA256SUMS.txt'}
          allowed |= {'signed-modules/' + name + '.ko' for name in modules}
          with zipfile.ZipFile(root / 'synthetica3.zip') as z:
              entries = z.infolist()
              files = [i for i in entries if not i.is_dir()]
              dirs = [i.filename for i in entries if i.is_dir()]
              if len(files) != len(allowed) or {i.filename for i in files} != allowed:
                  raise ValueError('unexpected artifact members')
              if len(dirs) != len(set(dirs)) or set(dirs) - {'signed-modules/'}:
                  raise ValueError('unexpected artifact directory')
              if any(stat.S_ISLNK(i.external_attr >> 16) or (i.flag_bits & 1) or i.file_size > 32*1024*1024 for i in entries):
                  raise ValueError('unsafe artifact entry')
              if sum(i.file_size for i in files) > 80*1024*1024 or z.testzip():
                  raise ValueError('artifact too large or ZIP CRC mismatch')
              dest = root / 'synthetica3-bundle'
              dest.mkdir()
              for i in files:
                  path = dest / i.filename
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(i))
          PY
          (cd "$RUNNER_TEMP/synthetica3-bundle" && sha256sum -c SHA256SUMS.txt)
      - name: Independently verify the one image and its six signed modules
        env:
          PYTHONOPTIMIZE: '0'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, importlib.util, json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          bundle = Path(os.environ['RUNNER_TEMP']) / 'synthetica3-bundle'
          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
              return m
          s3 = load('build_s3', root / 'build-kit/scripts/build_synthetica3.py')
          verifier = load('verify_s3', root / 'build-kit/scripts/verify_synthetica3_modules.py')
          status = json.loads((bundle / 'STATUS.json').read_text())
          assert status['status'] == 'COMPILED_ONLY_DO_NOT_FLASH'
          assert status['private_signing_key_exported'] is False and status['rom_or_device_modified'] is False
          assert status['source'] == s3.SOURCE and status['uname_release'] == s3.EXPECTED_RELEASE
          modules = status['matching_source_modules']
          assert modules['signature_and_version_records_verified'] is True
          assert modules['runtime_load'] == 'NOT_TESTED' and modules['rom_integration'] == 'NOT_DONE'
          expected_names = {'DO-NOT-FLASH-Synthetica-3.0-Image.gz', 'generated.config.txt',
                            'Module.symvers.txt', 'System.map.txt', 'kernel-module-public-cert.x509'}
          expected_names |= {'signed-modules/' + name + '.ko' for name in verifier.MODULE_CONFIG}
          assert set(status['output_sha256']) == expected_names
          for name, sha in status['output_sha256'].items():
              assert s3.digest(bundle / name) == sha
          lines = (bundle / 'SHA256SUMS.txt').read_text().splitlines()
          checksums = {}
          for line in lines:
              sha, sep, name = line.partition('  ')
              assert sep and re.fullmatch('[0-9a-f]{64}', sha) and name not in checksums
              checksums[name] = sha
          assert set(checksums) == expected_names | {'STATUS.json', 'README-DO-NOT-FLASH.txt'}
          assert all(s3.digest(bundle / name) == sha for name, sha in checksums.items())
          cfg = (bundle / 'generated.config.txt').read_bytes()
          changes = s3.check_config(s3.verified_baseline(root / 'artifacts/generated.config.txt'), cfg.decode())
          assert changes == status['config_changes'] and status['embedded_config_matches_generated'] is True
          image = bundle / 'DO-NOT-FLASH-Synthetica-3.0-Image.gz'
          assert image.stat().st_size > s3.MIN_IMAGE_BYTES
          with gzip.open(image, 'rb') as f: raw = f.read(s3.MAX_RAW_IMAGE + 1)
          assert len(raw) <= s3.MAX_RAW_IMAGE
          manager = json.loads((root / 'build-kit/artifacts/manager/MANAGER.json').read_text())
          s3.verify_image(raw, cfg, manager)
          cert = (bundle / 'kernel-module-public-cert.x509').read_bytes()
          parsed = subprocess.run(['openssl', 'x509', '-inform', 'DER', '-outform', 'DER'],
                                  input=cert, stdout=subprocess.PIPE, check=True).stdout
          assert cert == parsed and raw.count(cert) == 1 and status['module_public_cert_embedded_in_image'] is True
          old = root / 'artifacts/Image.gz'
          assert s3.digest(old) == s3.V2_IMAGE_SHA256
          with gzip.open(old, 'rb') as f: v2 = f.read(s3.MAX_RAW_IMAGE + 1)
          assert len(v2) <= s3.MAX_RAW_IMAGE
          assert (cert in v2) == status['same_public_certificate_found_in_2_0_image']
          symvers = (bundle / 'Module.symvers.txt').read_text()
          crc = verifier.symvers_records(symvers)['module_layout']
          assert f'0x{crc:08x}' == status['module_layout_crc']
          checked = verifier.collect(bundle / 'signed-modules', config=s3.read_config(cfg.decode()),
                                     release=s3.EXPECTED_RELEASE, certificate_der=cert, raw_kernel=raw,
                                     symvers_text=symvers)
          assert [row for _, row in checked.values()] == modules['modules']
          print('Rechecked 2.0-based config, kernel, certificate, all CRCs and six module signatures.')
          print('image sha256:', s3.digest(image), 'module_layout:', status['module_layout_crc'])
          PY
      - name: Replace the old evidence with this single same-build bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          dest = root / 'artifacts/synthetica-3.0'
          old_image = dest / 'DO-NOT-FLASH-Synthetica-3.0-Image.gz'
          expected = '0fbdc5f3b0b5a68c89c18ae1e999e83f783ac22157e63888734f7e9d915b1ea7'
          assert not dest.is_symlink() and dest.is_dir() and hashlib.sha256(old_image.read_bytes()).hexdigest() == expected
          bundle = Path(os.environ['RUNNER_TEMP']) / 'synthetica3-bundle'
          shutil.rmtree(dest)
          shutil.copytree(bundle, dest)
          PY
          (cd artifacts/synthetica-3.0 && sha256sum -c SHA256SUMS.txt)
          git config user.name 'synthetica-ci'
          git config user.email 'ci@users.noreply.github.com'
          git add -f -A -- artifacts/synthetica-3.0
          git commit -m 'Save verified same-build Synthetica 3.0 kernel and modules'
          git push origin HEAD:refs/heads/arena/96cbd65a-syntenthica
