name: "Synthetica 3.0 - verify and save build status"

on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: ['.github/workflows/synthetica3-save-status.yml']

permissions:
  actions: read
  contents: write

jobs:
  save-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arena/96cbd65a-syntenthica
          fetch-depth: 0

      - name: Recover only the completed 3.0 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected='72cda42a1823226cbdd7374e3b734677e6200dd7'
          gh run view 41881067516 --json status,conclusion,headSha \
            --jq 'select(.status == "completed" and .conclusion == "success") | .headSha' | grep -Fx "$expected"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13350213625/zip" > "$RUNNER_TEMP/kernel-result.zip"
          echo 'f6c3509dc2cd2af716f5f8b21f10b5590f057ae21e60e383d93c574d0ac6c604  '"$RUNNER_TEMP/kernel-result.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/kernel-result"
          unzip -q "$RUNNER_TEMP/kernel-result.zip" -d "$RUNNER_TEMP/kernel-result"
          (cd "$RUNNER_TEMP/kernel-result" && sha256sum -c SHA256SUMS.txt)

      - name: Verify the recorded image, configuration, CRC and certificate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, importlib.util, json, os, re
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          bundle = Path(os.environ['RUNNER_TEMP']) / 'kernel-result'
          spec = importlib.util.spec_from_file_location('synthetica3', root / 'build-kit/scripts/build_synthetica3.py')
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          expected = {'DO-NOT-FLASH-Synthetica-3.0-Image.gz', 'generated.config.txt', 'Module.symvers.txt',
                      'System.map.txt', 'kernel-module-public-cert.x509', 'STATUS.json',
                      'README-DO-NOT-FLASH.txt', 'SHA256SUMS.txt'}
          assert {p.name for p in bundle.iterdir()} == expected
          status = json.loads((bundle / 'STATUS.json').read_text())
          assert status['status'] == 'COMPILED_ONLY_DO_NOT_FLASH'
          assert status['source'] == mod.SOURCE and status['uname_release'] == mod.EXPECTED_RELEASE
          assert status['private_signing_key_exported'] is False and status['rom_or_device_modified'] is False
          for name, digest in status['output_sha256'].items():
              assert name in expected and hashlib.sha256((bundle / name).read_bytes()).hexdigest() == digest
          config = (bundle / 'generated.config.txt').read_bytes()
          changes = mod.check_config(mod.verified_baseline(root / 'artifacts/generated.config.txt'), config.decode())
          assert status['config_changes'] == changes and status['embedded_config_matches_generated'] is True
          with gzip.open(bundle / 'DO-NOT-FLASH-Synthetica-3.0-Image.gz', 'rb') as f:
              raw = f.read(mod.MAX_RAW_IMAGE + 1)
          assert len(raw) <= mod.MAX_RAW_IMAGE
          manager = json.loads((root / 'build-kit/artifacts/manager/MANAGER.json').read_text())
          mod.verify_image(raw, config, manager)
          cert = (bundle / 'kernel-module-public-cert.x509').read_bytes()
          assert cert in raw and status['module_public_cert_embedded_in_image'] is True
          with gzip.open(root / 'artifacts/Image.gz', 'rb') as f:
              v2 = f.read(mod.MAX_RAW_IMAGE + 1)
          assert len(v2) <= mod.MAX_RAW_IMAGE and mod.digest(root / 'artifacts/Image.gz') == mod.V2_IMAGE_SHA256
          assert status['same_public_certificate_found_in_2_0_image'] == (cert in v2)
          matches = re.findall(r'(?m)^(0x[0-9a-fA-F]{8})\s+module_layout\s+',
                               (bundle / 'Module.symvers.txt').read_text())
          assert len(matches) == 1 and matches[0].lower() == status['module_layout_crc']
          print('Build status, image, all config options, embedded config, CRC and certificate verified.')
          PY

      - name: Save only the small public status JSON
        run: |
          set -euo pipefail
          dest='artifacts/synthetica-3.0/STATUS.json'
          mkdir -p "$(dirname "$dest")"
          if [ -e "$dest" ] && ! cmp -s "$RUNNER_TEMP/kernel-result/STATUS.json" "$dest"; then
            echo 'Refusing to overwrite a different status' >&2; exit 1
          fi
          cp "$RUNNER_TEMP/kernel-result/STATUS.json" "$dest"
          git config user.name 'synthetica-ci'
          git config user.email 'ci@users.noreply.github.com'
          git add "$dest"
          if git diff --cached --quiet; then echo 'Status already saved'; exit 0; fi
          git commit -m 'Record verified non-flashable Synthetica 3.0 build status'
          git push origin HEAD:refs/heads/arena/96cbd65a-syntenthica
