name: Summarize existing ROM audit (temporary)
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/rom-summary.yml]
permissions:
  contents: read
  actions: read
jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Lunaris-3.13-aggregate-module-audit-42261865876
          path: ${{ runner.temp }}/report
          run-id: 42261865876
          github-token: ${{ github.token }}
      - name: Print only aggregate audit evidence
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads((Path(os.environ['RUNNER_TEMP'])/'report/aggregate-rom-audit.json').read_text())
          text=json.dumps(obj,indent=2)
          for idx,off in enumerate(range(0,min(len(text),14000),2200),1):
              print(f'::notice title=Aggregate ROM audit {idx}::'+text[off:off+2200].replace('%','%25').replace('\n','%0A'))
          PY
