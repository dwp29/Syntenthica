name: "Synthetica 5.0.1 — actual screen emulator smoke"
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths:
      - '.github/workflows/synthetica501-ui-smoke.yml'
      - 'tests/smoke_themes501_emulator.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recover verified isolated fixture from build 42453254203
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke501"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/git/blobs/fd90891809488a20b51d33efdb5ad3d2007618c3" > "$RUNNER_TEMP/smoke501/fixture.apk"
          echo 'f46e2f874cf717ab41be3acc5f97fc84823bf9355bf9e8be1597d4277ff9f0b7  '"$RUNNER_TEMP/smoke501/fixture.apk" | sha256sum -c -
          python3 tests/verify_themes501_fixture_apk.py "$RUNNER_TEMP/smoke501/fixture.apk"
      - name: Install accelerated API 35 emulator
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then echo '::error::KVM unavailable'; exit 1; fi
          sudo chmod a+rw /dev/kvm
          SDK="$HOME/smoke501-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK" ANDROID_AVD_HOME="$RUNNER_TEMP/smoke501-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' 2>&1 | tail -12
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -f -n smoke501 -k 'system-images;android-35;google_apis;x86_64' -d pixel_2
          python3 -m pip install --user --disable-pip-version-check pillow
      - name: Test actual screen components with stubbed backend
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/smoke501"
          emulator -avd smoke501 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$OUT/emulator.log" 2>&1 &
          pid=$!
          sleep 12
          if ! kill -0 "$pid" 2>/dev/null; then cat "$OUT/emulator.log"; exit 1; fi
          adb start-server
          timeout 240s adb -s emulator-5554 wait-for-device
          timeout 240s bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done'
          python3 tests/smoke_themes501_emulator.py --serial emulator-5554 --apk "$OUT/fixture.apk" \
            --sha256 f46e2f874cf717ab41be3acc5f97fc84823bf9355bf9e8be1597d4277ff9f0b7 --output "$OUT" 2>&1 | tee "$OUT/test.log"
      - name: Transfer simulated UI evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,shutil,subprocess,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'smoke501'
          snapshots=list(root.glob('*.xml'))
          if snapshots: shutil.copy2(max(snapshots,key=lambda p:p.stat().st_mtime_ns),root/'last-ui.xml')
          bundle=root/'smoke-evidence.zip'
          with zipfile.ZipFile(bundle,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for pattern in ('test.log','emulator.log','last-ui.xml','smoke-home-*.png','settings-*.png'):
                  for p in sorted(root.glob(pattern)): z.write(p,arcname=p.name)
          payload=root/'blob.json'; payload.write_text(json.dumps({'content':base64.b64encode(bundle.read_bytes()).decode(),'encoding':'base64'}))
          blob=subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--method','POST','--input',str(payload),'--jq','.sha'],capture_output=True,text=True,check=True).stdout.strip()
          print(f'::notice title=5.0.1 simulated UI smoke evidence SHA256 {hashlib.sha256(bundle.read_bytes()).hexdigest()}::{blob}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: themes501-simulated-ui-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke501/
          retention-days: 7
          if-no-files-found: warn
