name: Synthetica read-only VINTF inventory

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    # Only an explicit workflow edit starts a large, read-only download.
    paths:
      - '.github/workflows/synthetica-vintf-inventory.yml'
  workflow_dispatch:

# The unpublished candidate is readable only with an authorized token. This
# workflow never edits releases, modifies an input image, or accesses a device;
# it creates disposable read-only-inspected extent copies on the runner.
# Revision 2 also inventories selected HAL names/formats, without a verdict.
permissions:
  contents: write
  checks: write

concurrency:
  group: synthetica-vintf-readonly-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Check out the exact audit revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use the audited Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install the hash-pinned read-only filesystem reader
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes \
            -r synthetica-project/requirements-boot-audit.txt
          /usr/sbin/mke2fs -V
          /usr/sbin/debugfs -V

      - name: Run synthetic regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_audit_vintf_candidate.py' -v
          python -m unittest discover -s tests -p 'test_hyperos4_lp_metadata.py' -v
          python -m unittest discover -s tests -p 'test_github_guarded_report_relay.py' -v

      - name: Inventory verified guarded-candidate files without mounting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/synthetica-vintf-audit"
          python -u synthetica-project/audit_vintf_candidate.py \
            --work "$RUNNER_TEMP/synthetica-vintf-audit" \
            --report "$RUNNER_TEMP/synthetica-vintf-result.json"

      - name: Store only bounded audit metadata as GitHub checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_PATH: ${{ runner.temp }}/synthetica-vintf-result.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          with open(os.environ['RESULT_PATH'], encoding='utf-8') as stream:
              result = json.load(stream)
          if (result.get('schema') != 'synthetica-vintf-readonly-inventory-v1'
                  or result.get('candidate_before') != result.get('candidate_after')
                  or not result.get('documents') or len(result.get('groups', [])) != 2):
              raise SystemExit('The read-only inventory report is incomplete')
          # ASCII JSON is divided only if needed, staying well below the check
          # summary limit. It contains structure and hashes, never raw XML/images.
          serialized = json.dumps(result, ensure_ascii=True, separators=(',', ':'))
          chunks = [serialized[i:i + 45000] for i in range(0, len(serialized), 45000)]
          if not chunks or len(chunks) > 8:
              raise SystemExit('Refusing an unexpectedly large inventory report')
          for index, chunk in enumerate(chunks, 1):
              name = f'Synthetica VINTF inventory metadata {index:02d} of {len(chunks):02d}'
              summary = f'Host inventory only; not a compatibility or device-boot verdict. Part {index}/{len(chunks)}.\n\n' + chunk
              payload = {'name': name, 'head_sha': os.environ['GITHUB_SHA'],
                         'status': 'completed', 'conclusion': 'success',
                         'output': {'title': name, 'summary': summary}}
              subprocess.run(['gh', 'api', '--method', 'POST',
                              'repos/dwp29/Syntenthica/check-runs', '--input', '-'],
                             input=json.dumps(payload).encode(), check=True, stdout=subprocess.DEVNULL)
          print(f'Stored {len(chunks)} bounded, non-image metadata check(s).')
          PY
