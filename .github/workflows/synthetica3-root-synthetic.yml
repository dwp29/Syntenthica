name: "Verify 3.0 root candidate synthetic installer on isolated runner"
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica3-root-synthetic.yml]
permissions:
  contents: read
  actions: read
jobs:
  failed-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download previous test diagnostics
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: synthetica-3.0-candidate-FAILED-42354153045
          path: ${{ runner.temp }}/failed
          run-id: 42354153045
          github-token: ${{ github.token }}
      - name: Report the last synthetic test log
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'failed'
          for p in root.rglob('*'):
              if p.is_file():
                  print('::notice title=Diagnostic file::'+str(p.relative_to(root))+f' ({p.stat().st_size} bytes)')
                  if p.name in ('qemu-test.log','loop-test.log','finish-error.txt'):
                      s=p.read_text(errors='replace')[-6000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::notice title=Previous '+p.name+'::'+s)
          PY
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install synthetic test tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox qemu-user-static cpio lz4 unzip
          qemu-arm-static --version
      - name: Download exact pre-test candidate and fixture tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            repos/dwp29/Syntenthica/git/blobs/8541d4a26081b94215d4d493332cc27711f2fd15 > "$RUNNER_TEMP/transfer.zip"
          echo '77f7a76159c5f450704adc75d9dc7daa02a7c6e18f33edf4216025314e38e5c9  '"$RUNNER_TEMP/transfer.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/transfer.zip" -d "$RUNNER_TEMP/evidence"
          candidate="$RUNNER_TEMP/evidence/synthetica-3.0.zip"
          echo '16b32f57381005c08cbee0ec684397dc91acc77f5b2ccbb4ef7f4b99a9a791e6  '"$candidate" | sha256sum -c -
          mkdir "$RUNNER_TEMP/arm" "$RUNNER_TEMP/image"
          unzip -p "$candidate" Image.gz > "$RUNNER_TEMP/image/Image.gz.DO-NOT-FLASH"
          unzip -p "$candidate" anykernel.sh > "$RUNNER_TEMP/image/anykernel.sh"
          unzip -p "$candidate" tools/busybox > "$RUNNER_TEMP/arm/busybox"
          unzip -p "$candidate" tools/magiskboot > "$RUNNER_TEMP/arm/magiskboot"
          chmod 755 "$RUNNER_TEMP/arm/busybox" "$RUNNER_TEMP/arm/magiskboot"
          gh api 'repos/LineageOS/android_external_avb/git/blobs/7932b111ce2b8bb23ea50bebf42c201a20c4eea5' --jq .content | base64 -d > "$RUNNER_TEMP/avbtool.py"
          test "$(git hash-object "$RUNNER_TEMP/avbtool.py")" = 7932b111ce2b8bb23ea50bebf42c201a20c4eea5
      - name: Run each synthetic test with timeout and process diagnostics
        env:
          S2_QEMU_INTEGRATION: '1'
          S2_IMAGE: ${{ runner.temp }}/image/Image.gz.DO-NOT-FLASH
          S2_ARM_BB: ${{ runner.temp }}/arm/busybox
          S2_ARM_MAGISKBOOT: ${{ runner.temp }}/arm/magiskboot
          S2_AVBTOOL: ${{ runner.temp }}/avbtool.py
          S2_ANYKERNEL: ${{ runner.temp }}/image/anykernel.sh
        run: |
          python3 - <<'PY'
          import os, signal, subprocess, sys
          tests=['test_corrupted_repacked_header_and_vbmeta_are_rejected',
                 'test_detected_magisk_ramdisk_is_rejected',
                 'test_missing_footer_or_wrong_header_is_rejected_before_output',
                 'test_repack_preserves_sections_header_and_vbmeta_bytes',
                 'test_wrong_kernel_or_reference_dtb_is_rejected']
          failed=False
          for name in tests:
              target='test_synthetica2_installer_qemu.SyntheticRepackTests.'+name
              p=subprocess.Popen([sys.executable,'-u','-m','unittest',target,'-v'],cwd='tests',
                                 stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,start_new_session=True)
              try:
                  output,_=p.communicate(timeout=90)
              except subprocess.TimeoutExpired:
                  print(f'::error title=Timed out {name}::The test exceeded 90 seconds.')
                  processes=subprocess.run(['ps','-eo','pid,ppid,pgid,state,wchan:25,args'],text=True,capture_output=True).stdout
                  filtered='\n'.join(row for row in processes.splitlines() if any(s in row for s in ('qemu-arm','magiskboot','prepare-boot','unittest','avbtool')))
                  print('::notice title=Live child processes::'+filtered.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
                  os.killpg(p.pid,signal.SIGKILL)
                  output,_=p.communicate(timeout=10)
                  failed=True
              print(output)
              clipped=output[-3500:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice title=Test {name}::{clipped}')
              if p.returncode != 0 or 'skipped' in output.lower() or '\nOK\n' not in output:
                  failed=True
          if failed:
              raise SystemExit(1)
          PY
      - name: Exercise actual candidate writer on loop-backed synthetic boot
        env:
          S2_QEMU_INTEGRATION: '1'
          S2_LOOP_WRITER: '1'
          S2_IMAGE: ${{ runner.temp }}/image/Image.gz.DO-NOT-FLASH
          S2_ARM_BB: ${{ runner.temp }}/arm/busybox
          S2_ARM_MAGISKBOOT: ${{ runner.temp }}/arm/magiskboot
          S2_AVBTOOL: ${{ runner.temp }}/avbtool.py
          S2_ANYKERNEL: ${{ runner.temp }}/image/anykernel.sh
        run: |
          python3 - <<'PY'
          import os, signal, subprocess, sys
          names=['S2_QEMU_INTEGRATION','S2_LOOP_WRITER','S2_IMAGE','S2_ARM_BB','S2_ARM_MAGISKBOOT','S2_AVBTOOL','S2_ANYKERNEL']
          cmd=['sudo','env']+[f'{key}={os.environ[key]}' for key in names]
          cmd += [sys.executable,'-u','-m','unittest',
                  'test_synthetica2_installer_qemu.SyntheticRepackTests.test_loop_backed_writer_round_trip','-v']
          p=subprocess.Popen(cmd,cwd='tests',stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,start_new_session=True)
          try:
              output,_=p.communicate(timeout=120)
          except subprocess.TimeoutExpired:
              subprocess.run(['sudo','kill','-KILL','--',f'-{p.pid}'],check=False)
              output,_=p.communicate(timeout=10)
              print('::error title=Loop writer timeout::Test exceeded 120 seconds.')
              print(output)
              raise SystemExit(1)
          print(output)
          clipped=output[-5000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=Candidate loop writer test::'+clipped)
          if p.returncode != 0 or 'skipped' in output.lower() or '\nOK\n' not in output:
              raise SystemExit(1)
          PY
