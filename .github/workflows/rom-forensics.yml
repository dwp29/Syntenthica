name: Investigate Lunaris vendor and boot variants (temporary)
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/rom-forensics.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Synthetica-2.0-neutron-MGLRU-on-DO-NOT-FLASH-42258512643
          path: ${{ runner.temp }}/candidate-on
          run-id: 42258512643
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Synthetica-2.0-neutron-MGLRU-off-DO-NOT-FLASH-42258512643
          path: ${{ runner.temp }}/candidate-off
          run-id: 42258512643
          github-token: ${{ github.token }}
      - name: Install bounded local tools
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y brotli e2fsprogs
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core@1.57.0
      - name: Fetch only the previously verified ROM components
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node <<'JS'
          const {chromium}=require(process.env.RUNNER_TEMP+'/browser/node_modules/playwright-core');
          const https=require('https'),fs=require('fs'),path=require('path'),zlib=require('zlib'),crypto=require('crypto');
          const size=2925420062, temp=process.env.RUNNER_TEMP;
          function request(url,start,end,cookie,file=null,depth=0){
            if(depth>3||start<0||end<start||end-start>500_000_000) return Promise.reject(Error('invalid range'));
            return new Promise((resolve,reject)=>{
              const u=new URL(url); if(!u.hostname.endsWith('.gofile.io'))return reject(Error('unexpected host'));
              const req=https.get(u,{headers:{Range:`bytes=${start}-${end}`,Cookie:cookie,'User-Agent':'Mozilla/5.0'}},res=>{
                if([301,302,303,307,308].includes(res.statusCode)){const next=new URL(res.headers.location,u).href;res.resume();request(next,start,end,cookie,file,depth+1).then(resolve,reject);return;}
                if(res.statusCode!==206){res.destroy();reject(Error('server did not honor range'));return;}
                const chunks=[];let count=0,output=file?fs.createWriteStream(file,{flags:'wx',mode:0o600}):null;
                if(output)output.on('error',e=>{res.destroy();reject(e)});
                res.on('data',chunk=>{count+=chunk.length;if(count>end-start+1){res.destroy(Error('oversized range'));return;}
                  if(output){if(!output.write(chunk))res.pause(),output.once('drain',()=>res.resume());}else chunks.push(chunk);});
                res.on('error',e=>{if(output)output.destroy();reject(e)});
                res.on('end',()=>{if(count!==end-start+1){if(output)output.destroy();reject(Error('short range'));return;}
                  if(output)output.end(()=>resolve(null));else resolve(Buffer.concat(chunks));});
              });req.setTimeout(90000,()=>req.destroy(Error('range timeout')));req.on('error',reject);
            });
          }
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});
            const ctx=await browser.newContext({acceptDownloads:true}); const page=await ctx.newPage();
            await page.goto('https://gofile.io/d/W0WXctW4',{waitUntil:'domcontentloaded',timeout:60000});
            await page.getByRole('button',{name:'Download',exact:true}).waitFor({timeout:60000});
            const [dl]=await Promise.all([page.waitForEvent('download',{timeout:90000}),page.getByRole('button',{name:'Download',exact:true}).click()]);
            const url=dl.url(), cookie=(await ctx.cookies(url)).map(x=>x.name+'='+x.value).join('; ');await dl.cancel();
            const tail=await request(url,size-66000,size-1,cookie), i=tail.lastIndexOf(Buffer.from('504b0506','hex'));
            if(i<0||i+22>tail.length)throw Error('ZIP directory not found');
            const len=tail.readUInt32LE(i+12), off=tail.readUInt32LE(i+16);
            if(len>2_000_000||off+len>size)throw Error('ZIP directory bounds');
            const dir=await request(url,off,off+len-1,cookie);let pos=0;const entries={};
            while(pos<dir.length){
              if(pos+46>dir.length||dir.readUInt32LE(pos)!==0x02014b50)throw Error('bad ZIP directory');
              const method=dir.readUInt16LE(pos+10),c=dir.readUInt32LE(pos+20),u=dir.readUInt32LE(pos+24),n=dir.readUInt16LE(pos+28),e=dir.readUInt16LE(pos+30),a=dir.readUInt16LE(pos+32),local=dir.readUInt32LE(pos+42);
              if(pos+46+n+e+a>dir.length)throw Error('truncated ZIP directory');
              const name=dir.subarray(pos+46,pos+46+n).toString('utf8');if(entries[name])throw Error('duplicate ZIP entry');
              entries[name]={method,c,u,local};pos+=46+n+e+a;
            }
            async function entry(name,file=null){
              const x=entries[name];if(!x||x.c>500_000_000)throw Error('missing or oversized entry');
              const h=await request(url,x.local,x.local+29,cookie);if(h.readUInt32LE(0)!==0x04034b50)throw Error('bad ZIP local header');
              const start=x.local+30+h.readUInt16LE(26)+h.readUInt16LE(28);
              const bytes=await request(url,start,start+x.c-1,cookie,file);
              if(file){if(x.method!==0)throw Error('unexpected stored vendor encoding');return;}
              const raw=x.method===8?zlib.inflateRawSync(bytes,{maxOutputLength:256*1024*1024}):bytes;
              if(raw.length!==x.u)throw Error('wrong ZIP entry length');return raw;
            }
            const transfer=await entry('vendor.transfer.list');fs.writeFileSync(path.join(temp,'vendor.transfer.list'),transfer);
            await entry('vendor.new.dat.br',path.join(temp,'vendor.br'));
            const boot=await entry('boot.img');
            if(crypto.createHash('sha256').update(boot).digest('hex')!=='1d3f3b36b087bd7f36941ac4784287421d9f25d573c4f19b19e93cf0797da389')throw Error('ZIP boot does not match the previously verified archive');
            fs.writeFileSync(path.join(temp,'zip-boot.img'),boot);
            await page.goto('https://gofile.io/d/e7kIkBT9',{waitUntil:'domcontentloaded',timeout:60000});
            await page.getByRole('button',{name:'Download',exact:true}).waitFor({timeout:60000});
            const [published]=await Promise.all([page.waitForEvent('download',{timeout:90000}),page.getByRole('button',{name:'Download',exact:true}).click()]);
            if(published.suggestedFilename()!=='boot.img')throw Error('unexpected standalone boot filename');
            await published.saveAs(path.join(temp,'published-boot.img'));await browser.close();
            const sha=crypto.createHash('sha256').update(fs.readFileSync(path.join(temp,'published-boot.img'))).digest('hex');
            if(sha!=='ed5b0fb6722fc0782058e5c244200307a460a8ba406cc06a82f024958c045720')throw Error('standalone boot digest mismatch');
            console.log('ZIP boot and standalone boot match their independently recorded SHA-256 values.');
          })().catch(e=>{console.log('::error title=ROM component fetch failed::'+e.message.replace(/%/g,'%25').replace(/\n/g,'%0A'));process.exit(1)});
          JS
      - name: Reconstruct the verified vendor image and inspect full vendor contents
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']);t=Path(os.environ['RUNNER_TEMP'])
          sys.path.insert(0,str(root/'build-kit/scripts'))
          import extract_synthetica2_block_ota as ota
          image_bytes,ranges=ota.parse_transfer((t/'vendor.transfer.list').read_bytes())
          p=subprocess.Popen(['brotli','-d','-c',str(t/'vendor.br')],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          try:
              with (t/'vendor.img').open('xb') as out:ota.write_ranges(p.stdout,out,image_bytes,ranges)
              if p.wait(timeout=120):raise ValueError('vendor decompression failed')
          finally:
              if p.poll() is None:p.kill();p.wait()
          expected='4eb84e7a53112ff1580f73c1d0d0f2ce738960da8450c0f623dc18838f02b2f5'
          if ota.file_digest(t/'vendor.img')!=expected:raise ValueError('vendor image differs from the fully hash-verified ROM extraction')
          print('Vendor image SHA-256 matches the prior full-archive extraction.')
          PY
          mkdir "$RUNNER_TEMP/vendor-full"
          debugfs -R "rdump / $RUNNER_TEMP/vendor-full" "$RUNNER_TEMP/vendor.img" 2>"$RUNNER_TEMP/debugfs.log"
          for directory in / /lib /lib/modules /vendor_dlkm /vendor_dlkm/lib /vendor_dlkm/lib/modules; do
            echo "DIRECTORY $directory" >> "$RUNNER_TEMP/debugfs-listings.txt"
            debugfs -R "ls -p $directory" "$RUNNER_TEMP/vendor.img" >> "$RUNNER_TEMP/debugfs-listings.txt" 2>&1 || true
          done
          python3 - <<'PY'
          import json,os,re,shutil
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);src=t/'vendor-full';dest=t/'rom-modules';dest.mkdir()
          total=0; found=[]; compressed=[]; lists=[]; rc_refs=[]; rc_commands=[]
          for root,dirs,files in os.walk(src,followlinks=False):
              dirs[:]=[x for x in dirs if not (Path(root)/x).is_symlink()]
              for name in files:
                  p=Path(root)/name
                  if p.is_symlink():continue
                  total+=1;rel=str(p.relative_to(src))
                  if name.endswith('.ko'):
                      if p.stat().st_size>32*1024*1024 or len(found)>=1000:raise ValueError('module inventory limit')
                      safe=re.sub(r'[^A-Za-z0-9_.+-]','_',name)
                      shutil.copyfile(p,dest/(f'{len(found):04d}-'+safe));found.append(rel)
                  elif re.search(r'\.ko\.(gz|xz|zst)$',name):compressed.append(rel)
                  if name.startswith('modules.load') and p.stat().st_size<=1024*1024:
                      lists.append({'path':rel,'nonempty_lines':sum(bool(x.strip()) for x in p.read_text(errors='replace').splitlines())})
                  if name.endswith('.rc') and p.stat().st_size<=1024*1024:
                      for line in p.read_text(errors='replace').splitlines():
                          if re.search(r'\b(?:insmod|modprobe)\b',line):
                              rc_refs.append(rel); rc_commands.append({'file':rel,'line':line.strip()[:300]})
          meta={'vendor_regular_files_scanned':total,'uncompressed_ko_count':len(found),
                'compressed_ko_count':len(compressed),'modules_load_files':lists[:30],
                'init_rc_files_mentioning_insmod_or_modprobe':len(set(rc_refs)),
                'init_module_commands':rc_commands[:25],
                'debugfs_listings':(t/'debugfs-listings.txt').read_text(errors='replace')[-6000:],
                'debugfs_log_tail':(t/'debugfs.log').read_text(errors='replace')[-1000:],
                'scope':'Extracted vendor filesystem only; symlinks, other partitions and actual runtime were not established'}
          (t/'vendor-scan.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: Compare the two published boot images and any vendor modules
        run: |
          set -euo pipefail
          if find "$RUNNER_TEMP/rom-modules" -type f -name '*.ko' -print -quit | grep -q .; then
            for mode in on off; do
              python3 build-kit/scripts/audit_synthetica2_rom_modules.py --modules "$RUNNER_TEMP/rom-modules" \
                --candidate "$RUNNER_TEMP/candidate-$mode" --baseline artifacts/generated.config.txt \
                --report "$RUNNER_TEMP/private-$mode.json" > "$RUNNER_TEMP/summary-$mode.json"
            done
          else
            for mode in on off; do printf '%s\n' '{"summary":{"comparison":"NOT RUN: no uncompressed vendor modules found"}}' > "$RUNNER_TEMP/summary-$mode.json"; done
          fi
          python3 - <<'PY'
          import importlib.util,json,os,re
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']);t=Path(os.environ['RUNNER_TEMP'])
          spec=importlib.util.spec_from_file_location('boot_audit',root/'build-kit/scripts/audit_synthetica3_boot.py')
          audit=importlib.util.module_from_spec(spec);spec.loader.exec_module(audit)
          first=audit.inspect_boot(t/'zip-boot.img'); second=audit.inspect_boot(t/'published-boot.img')
          def version(path,info):
              with path.open('rb') as f:f.seek(info['sections']['kernel']['offset']);data=f.read(info['sections']['kernel']['bytes'])
              match=re.search(rb'Linux version ([^\s\0]+)',data)
              return match.group(1).decode('ascii','replace') if match else None
          sections={name:first['sections'][name]['sha256']==second['sections'][name]['sha256']
                    for name in ('kernel','ramdisk','second','recovery_dtbo','dtb')}
          head=('header_version','header_bytes','page_size','kernel_address','ramdisk_address','second_address',
                'tags_address','dtb_address','os_version_encoded','board_field_sha256','cmdline_fields_sha256')
          report={'zip_boot_sha256':first['file_sha256'],'standalone_boot_sha256':second['file_sha256'],
                  'zip_kernel_release':version(t/'zip-boot.img',first),'standalone_kernel_release':version(t/'published-boot.img',second),
                  'section_hashes_equal':sections,'stable_header_fields_equal':{x:first[x]==second[x] for x in head},
                  'zip_avb_footer':first['avb']['footer_at_end'],'standalone_avb_footer':second['avb']['footer_at_end'],
                  'vendor_scan':json.loads((t/'vendor-scan.json').read_text()),
                  'neutron_on':json.loads((t/'summary-on.json').read_text())['summary'],
                  'neutron_off':json.loads((t/'summary-off.json').read_text())['summary'],
                  'scope':'Static public-image comparison only; installed device identity, trust and runtime are unknown.'}
          (t/'rom-forensics.json').write_text(json.dumps(report,indent=2)+'\n')
          text=json.dumps(report)
          for i,off in enumerate(range(0,min(len(text),12000),2000),1):
              print(f'::notice title=ROM forensics {i}::'+text[off:off+2000].replace('%','%25').replace('\n','%0A'))
          PY
      - name: Upload aggregate evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lunaris-3.13-boot-vendor-forensics-${{ github.run_id }}
          path: ${{ runner.temp }}/rom-forensics.json
          if-no-files-found: error
          retention-days: 7
