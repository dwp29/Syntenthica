name: "Synthetica 3.1 - rebuild kernel from the 3.0 recipe"

on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths:
      - '.github/workflows/synthetica31-kernel.yml'
      - 'build-kit/scripts/build_synthetica31.py'
      - 'tests/test_synthetica31_build.py'
  workflow_dispatch:

permissions:
  contents: write # Unreferenced evidence blob only; no branch writes.

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kernel build tools
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get install -y -qq \
            gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc flex bison libssl-dev libelf-dev device-tree-compiler \
            cpio lz4 xz-utils zstd python3 patch openssl zip unzip rsync git curl binutils kmod
      - name: Fetch and verify exact 3.0 and earlier experiment configurations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/git/blobs/8541d4a26081b94215d4d493332cc27711f2fd15" > "$RUNNER_TEMP/transfer30.zip"
          echo '77f7a76159c5f450704adc75d9dc7daa02a7c6e18f33edf4216025314e38e5c9  '"$RUNNER_TEMP/transfer30.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/transfer30.zip" generated.config.txt > "$RUNNER_TEMP/config30"
          echo '253a89a338e8c5b71da71b698a0160d9fb361468cfac3a3bfc7fae2c52f4af2d  '"$RUNNER_TEMP/config30" | sha256sum -c -
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/git/blobs/d5e292c91a36c7706deedfdb9f1ca8b7a703ee3e" > "$RUNNER_TEMP/transfer20.zip"
          echo '742068c09eb99f6eb37d55aa3ee1bca9ee156db592d10d3d901fca738900dabc  '"$RUNNER_TEMP/transfer20.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/transfer20.zip" generated.config.txt > "$RUNNER_TEMP/config20exp"
          echo 'c72503550d74446f5af3573288b4e93dc1407854c5df338d20681d1866ccb96c  '"$RUNNER_TEMP/config20exp" | sha256sum -c -
          echo "S31_BASELINE_CONFIG=$RUNNER_TEMP/config30" >> "$GITHUB_ENV"
          echo "S3RC_TESTED_CONFIG=$RUNNER_TEMP/config20exp" >> "$GITHUB_ENV"
      - name: Download and verify the 3.0 Neutron toolchain
        timeout-minutes: 15
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/neutron-clang-06092026.tar.zst"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          echo "531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30  $archive" | sha256sum -c -
          test "$(stat -c %s "$archive")" = 77768187
          mkdir "$RUNNER_TEMP/neutron"
          tar -I zstd -xf "$archive" -C "$RUNNER_TEMP/neutron"
          echo "S2X_TOOLCHAIN_BIN=$RUNNER_TEMP/neutron/bin" >> "$GITHUB_ENV"
      - name: Test build recipe and prepare isolated kit
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_synthetica31_build.py' -v
          python3 build-kit/scripts/build_synthetica31.py prepare --source build-kit \
            --destination "$RUNNER_TEMP/s31-kit" --baseline artifacts/generated.config.txt
      - name: Compile 3.1 and same-build signed modules
        timeout-minutes: 75
        env:
          SP_JOBS: '4'
          SP_RELEASE_VERSION: '3.1'
          SP_PROFILE: synthetica
          SP_BUILD_NAME: synthetica
          SP_BUILD_KVER: '3.1'
          SP_EXPECT_RELEASE: 4.14.357-openela-synthetica-3.1
          PYTHONOPTIMIZE: '0'
        run: |
          set -euo pipefail
          export SP_WORK_DIR="$RUNNER_TEMP/s31-work"
          export S2X_HELPER="$GITHUB_WORKSPACE/build-kit/scripts/build_synthetica31.py"
          export S2X_BASELINE="$GITHUB_WORKSPACE/artifacts/generated.config.txt"
          if ! python3 "$RUNNER_TEMP/s31-kit/scripts/build_chronicle_base.py"; then
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 's31-kit/artifacts/build.log'
          rows = (log.read_text(errors='replace') if log.exists() else 'No build.log').splitlines()
          indexes = [i for i, row in enumerate(rows) if re.search(r'error:|fatal error|undefined reference|\bFAIL\b|not found|refused', row, re.I)]
          chosen = []
          for i in indexes[-12:]: chosen.extend(rows[max(0, i-1):min(len(rows), i+3)])
          text = '\n'.join(dict.fromkeys(chosen or rows[-40:]))[-12000:]
          text = re.sub(r'https?://\S+', '<url>', text)
          for i in range(0, len(text), 1800):
              part = text[i:i+1800].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=3.1 compile diagnostic {i//1800+1}::{part}')
          PY
            exit 1
          fi
      - name: Verify image, embedded config, patches, Manager and module evidence
        run: |
          set -euo pipefail
          python3 build-kit/scripts/build_synthetica31.py finish \
            --kit "$RUNNER_TEMP/s31-kit" --out "$RUNNER_TEMP/s31-work/tree/out-synthetica" \
            --baseline artifacts/generated.config.txt --tested-config "$S3RC_TESTED_CONFIG" \
            --baseline30 "$S31_BASELINE_CONFIG" --result "$RUNNER_TEMP/s31-result" \
            --toolchain-bin "$S2X_TOOLCHAIN_BIN" \
            --neutron-archive "$RUNNER_TEMP/neutron-clang-06092026.tar.zst" 2> "$RUNNER_TEMP/finish-error.txt" || {
              cat "$RUNNER_TEMP/finish-error.txt"
              python3 - <<'PY'
          import os
          from pathlib import Path
          t = (Path(os.environ['RUNNER_TEMP'])/'finish-error.txt').read_text(errors='replace')[-4000:]
          print('::error title=3.1 verification diagnostic::'+t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
              exit 1
            }
      - name: Transfer verified compile evidence (public certificate only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, zipfile
          from pathlib import Path
          t = Path(os.environ['RUNNER_TEMP']); r = t/'s31-result'; out = t/'s31-transfer.zip'
          names = ('Image.gz.DO-NOT-FLASH','STATUS.json','generated.config.txt','module-signing-public-cert.x509','Module.symvers','System.map')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for name in names: z.write(r/name, name)
          data = out.read_bytes()
          (t/'s31-blob.json').write_text(json.dumps({'content':base64.b64encode(data).decode('ascii'),'encoding':'base64'}))
          print('::notice title=3.1 transfer SHA256::'+hashlib.sha256(data).hexdigest())
          print('::notice title=3.1 Image SHA256::'+hashlib.sha256((r/'Image.gz.DO-NOT-FLASH').read_bytes()).hexdigest())
          PY
          blob=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input "$RUNNER_TEMP/s31-blob.json" --jq .sha)
          test "${#blob}" = 40
          echo "::notice title=3.1 transfer Git blob::$blob"
          echo '::notice title=Scope::New kernel and module certificate. Previous 3.0 user boot does not validate this build on any device.'
      - name: Upload compile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetica-3.1-kernel-compile-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/s31-result/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetica-3.1-kernel-build-failed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s31-kit/artifacts/build.log
            ${{ runner.temp }}/s31-kit/artifacts/FAILED.txt
            ${{ runner.temp }}/finish-error.txt
          if-no-files-found: warn
          retention-days: 7
