name: "Synthetica boot-first — recover exact candidate to draft"

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-github-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synthetica-boot-first-github-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'dwp29/Syntenthica' && github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    name: "Reconstruct and verify the exact candidate, then upload to draft"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact transfer and reconstruction code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up the same Python version as the original build
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.2'

      - name: Build the same zlib version from its pinned upstream commit
        run: |
          set -euo pipefail
          trap 'echo "::error title=Toolchain setup failed::Could not prepare the pinned Python/zlib toolchain."' ERR
          git clone --quiet --depth 1 --branch v1.2.13 https://github.com/madler/zlib.git "$RUNNER_TEMP/zlib-source"
          test "$(git -C "$RUNNER_TEMP/zlib-source" rev-parse HEAD)" = '04f42ceca40f73e2978b50e93806c2a18c1281fc'
          cd "$RUNNER_TEMP/zlib-source"
          ./configure --prefix="$RUNNER_TEMP/zlib-1.2.13"
          make -j2
          make install
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/zlib-1.2.13/lib" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/zlib-1.2.13/lib" python -c 'import sys,zlib; assert sys.version_info[:3] == (3,11,2); assert zlib.ZLIB_RUNTIME_VERSION == "1.2.13"; print("Pinned Python and zlib verified")'

      - name: Test reconstruction and transfer guards with synthetic data
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_reconstruct_boot_candidate.py' -v
          python -m unittest discover -s tests -p 'test_github_release_transfer.py' -v

      - name: Download and verify the previously audited public original
        run: |
          set -euo pipefail
          trap 'echo "::error title=Original input unavailable::Runner space, source download, or original ZIP SHA-256 verification failed."' ERR
          needed=11900000000
          available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')
          if [ "$available" -lt "$needed" ]; then
            echo 'Freeing optional SDKs on this ephemeral GitHub runner.'
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')
          test "$available" -ge "$needed" || { echo 'Insufficient runner space'; exit 1; }
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 3600 \
            --max-filesize 4512854711 \
            --output "$RUNNER_TEMP/synthetica-original-locked.zip" \
            'https://pixeldrain.com/api/file/DKkWRTMZ?download'
          echo '454580f463e7f6ac922546075a2a033c6dc2fac3275e450573635a1ca7b0ec63  '"$RUNNER_TEMP/synthetica-original-locked.zip" | sha256sum --check --status
          echo 'Original ZIP SHA-256 verified.'

      - name: Reconstruct, split and verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python synthetica-project/github_release_transfer.py
