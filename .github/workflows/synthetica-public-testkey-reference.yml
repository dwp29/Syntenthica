name: Synthetica public development certificate comparison
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-public-testkey-reference.yml, synthetica-project/audit_public_testkey_reference.py, tests/test_audit_public_testkey_reference.py, synthetica-project/apk_signer_output.py]
  workflow_dispatch:
# Fetches one public X.509 certificate only. Never reads or uses a private key.
permissions:
  contents: read
  checks: write
jobs:
  compare:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run positive and negative public certificate controls
        run: |
          python -m unittest discover -s tests -p 'test_audit_public_testkey_reference.py' -v
          python -m unittest discover -s tests -p 'test_apk_signer_output.py' -v
      - name: Fetch pinned public certificate and prior check metadata
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/public-certificates"
          for name in testkey platform shared media networkstack bluetooth nfc sdk_sandbox cts_uicc_2021; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/aosp-mirror/platform_build/contents/target/product/security/$name.x509.pem?ref=3d9c9aacdb6ca0b745b3048dad88d0db4680d50e" \
              > "$RUNNER_TEMP/public-certificates/$name.x509.pem"
          done
          gh api 'repos/dwp29/Syntenthica/check-runs/125740850789' > "$RUNNER_TEMP/leica-check.json"
      - name: Compare public certificate fingerprints
        id: compare
        run: |
          python synthetica-project/audit_public_testkey_reference.py \
            --public-certificate "$RUNNER_TEMP/public-certificates/testkey.x509.pem" --check-run "$RUNNER_TEMP/leica-check.json" \
            --certificate-directory "$RUNNER_TEMP/public-certificates" --report "$RUNNER_TEMP/public-testkey-result.json"
      - name: Record bounded comparison including failures
        if: always()
        env:
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'public-testkey-result.json'
          result=json.loads(path.read_text()) if path.is_file() else {'status':'PREPARATION_FAILED_HOLD'}
          result['outcome']=os.environ['COMPARE_OUTCOME']
          text=json.dumps(result,ensure_ascii=True,separators=(',',':'))
          if len(text)>10000: raise SystemExit('Comparison result exceeds bound')
          ok=(result.get('leica_matches_public_aosp_testkey') is True
              and result.get('production_key_gate')=='REJECT_PUBLIC_TESTKEY'
              and result.get('public_development_inventory',{}).get('public_certificates_verified')==9 and result['outcome']=='success')
          payload={'name':'Synthetica AOSP public testkey reference','head_sha':os.environ['GITHUB_SHA'],'status':'completed',
                   'conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Public testkey match; production integration rejected','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(),stdout=subprocess.DEVNULL,check=True)
          PY
