name: "Synthetica Manager 5.0 — multi-theme build and preview"

on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths:
      - '.github/workflows/synthetica50-manager.yml'
      - 'build-kit/scripts/build_manager_50_multitheme.py'
      - 'build-kit/scripts/build_multitheme50_preview.py'
      - 'build-kit/ci/ksun-multitheme50/**'
      - 'tests/test_synthetica50*.py'
      - 'tests/verify_synthetica50_apk.py'
      - 'tests/verify_multitheme50_preview_apk.py'
  workflow_dispatch:

permissions:
  contents: write # unreferenced unsigned and isolated-preview Git blobs only

jobs:
  manager:
    name: "Unsigned 5.0 Manager — root identity and source invariants"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned source and run host regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ksun-git" "$RUNNER_TEMP/ksun-fixture" "$RUNNER_TEMP/manager50-output"
          git -C "$RUNNER_TEMP/ksun-git" init -q
          git -C "$RUNNER_TEMP/ksun-git" remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C "$RUNNER_TEMP/ksun-git" fetch -q --depth=1 origin ea51427ff700f73909e7e8c8717cc3241322ee1e
          test "$(git -C "$RUNNER_TEMP/ksun-git" rev-parse FETCH_HEAD)" = ea51427ff700f73909e7e8c8717cc3241322ee1e
          git -C "$RUNNER_TEMP/ksun-git" archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/ksun-fixture"
          MULTITHEME50_SOURCE="$RUNNER_TEMP/ksun-fixture" PIXEL40_SOURCE="$RUNNER_TEMP/ksun-fixture" NEON_SOURCE="$RUNNER_TEMP/ksun-fixture" \
            python3 -m unittest discover -s tests -p 'test_*.py' -v > "$RUNNER_TEMP/manager50-output/host-tests.log" 2>&1 || {
              tail -n 120 "$RUNNER_TEMP/manager50-output/host-tests.log"; exit 1;
            }
          tail -n 8 "$RUNNER_TEMP/manager50-output/host-tests.log"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk50"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865' 'cmake;3.22.1' 2>&1 | tail -10
      - name: Compile unsigned Manager 5.0
        run: |
          set -euo pipefail
          SYNTHETICA_MANAGER_WORKDIR="$RUNNER_TEMP/manager50-source" \
          SYNTHETICA_UNSIGNED_APK="$RUNNER_TEMP/manager50-output/Synthetica-Manager-5.0-MultiTheme-UNSIGNED.apk" \
            python3 build-kit/scripts/build_manager_50_multitheme.py 2>&1 | tee "$RUNNER_TEMP/manager50-output/build.log"
      - name: Verify package, permissions, root payload, alignment and unsigned status
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/manager50-output/Synthetica-Manager-5.0-MultiTheme-UNSIGNED.apk"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/manager50-output/badging.txt"
          grep -F "name='net.ember.labs'" "$RUNNER_TEMP/manager50-output/badging.txt"
          grep -F "versionCode='60000'" "$RUNNER_TEMP/manager50-output/badging.txt"
          grep -F "versionName='5.0.0'" "$RUNNER_TEMP/manager50-output/badging.txt"
          "$TOOLS/aapt" dump permissions "$APK" | grep '^uses-permission' | sort > "$RUNNER_TEMP/manager50-permissions.txt" || true
          "$TOOLS/aapt" dump permissions release/Synthetica-2.0.apk | grep '^uses-permission' | sort > "$RUNNER_TEMP/reference-permissions.txt" || true
          test -s "$RUNNER_TEMP/manager50-permissions.txt" && test -s "$RUNNER_TEMP/reference-permissions.txt"
          diff -u "$RUNNER_TEMP/reference-permissions.txt" "$RUNNER_TEMP/manager50-permissions.txt"
          python3 tests/verify_synthetica50_apk.py "$APK" | tee "$RUNNER_TEMP/manager50-output/static-checks.txt"
          if "$TOOLS/apksigner" verify "$APK" > "$RUNNER_TEMP/manager50-output/signature-check.txt" 2>&1; then
            echo '::error::Expected an unsigned build'; exit 1
          fi
          grep -q 'DOES NOT VERIFY' "$RUNNER_TEMP/manager50-output/signature-check.txt"
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$sha" > "$RUNNER_TEMP/manager50-output/SHA256.txt"
          echo "::notice title=Unsigned Manager 5.0 SHA256::$sha"
      - name: Transfer unsigned Manager as Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP']); apk=t/'manager50-output/Synthetica-Manager-5.0-MultiTheme-UNSIGNED.apk'
          (t/'manager50-blob.json').write_text(json.dumps({'content':base64.b64encode(apk.read_bytes()).decode(),'encoding':'base64'}))
          PY
          blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/manager50-blob.json" --jq .sha)
          echo "::notice title=Unsigned Manager 5.0 blob::$blob"
      - name: Expose build diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for log in "$RUNNER_TEMP/manager50-output/build.log" "$RUNNER_TEMP/manager50-output/host-tests.log"; do
            if [ -s "$log" ]; then
              LOG="$log" python3 - <<'PY'
          import base64,json,os,pathlib
          p=pathlib.Path(os.environ['LOG']); t=pathlib.Path(os.environ['RUNNER_TEMP'])
          (t/'manager50-log.json').write_text(json.dumps({'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'}))
          PY
              blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/manager50-log.json" --jq .sha)
              echo "::notice title=Manager 5.0 $(basename "$log") blob::$blob"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetica50-manager-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/manager50-output/
          retention-days: 14
          if-no-files-found: warn

  preview:
    name: "Non-root multi-theme preview — compile and unit tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned Gradle wrapper
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ksun-git" "$RUNNER_TEMP/ksun-fixture" "$RUNNER_TEMP/preview50-output"
          git -C "$RUNNER_TEMP/ksun-git" init -q
          git -C "$RUNNER_TEMP/ksun-git" remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C "$RUNNER_TEMP/ksun-git" fetch -q --depth=1 origin ea51427ff700f73909e7e8c8717cc3241322ee1e
          test "$(git -C "$RUNNER_TEMP/ksun-git" rev-parse FETCH_HEAD)" = ea51427ff700f73909e7e8c8717cc3241322ee1e
          git -C "$RUNNER_TEMP/ksun-git" archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/ksun-fixture"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk50-preview"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.1.0' 2>&1 | tail -10
      - name: Compile preview and run Kotlin unit tests
        run: |
          set -euo pipefail
          MULTITHEME50_PREVIEW_OUTPUT="$RUNNER_TEMP/preview50-output/Synthetica-5.0-PREVIEW-NOT-MANAGER.apk" \
            python3 build-kit/scripts/build_multitheme50_preview.py --source "$RUNNER_TEMP/ksun-fixture" 2>&1 | tee "$RUNNER_TEMP/preview50-output/build.log"
      - name: Verify preview identity, no network and no root backend
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/preview50-output/Synthetica-5.0-PREVIEW-NOT-MANAGER.apk"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/preview50-output/badging.txt"
          grep -F "name='net.ember.labs.multitheme50preview'" "$RUNNER_TEMP/preview50-output/badging.txt"
          if "$TOOLS/aapt" dump permissions "$APK" | grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo '::error::Preview must not have network permission'; exit 1
          fi
          python3 tests/verify_multitheme50_preview_apk.py "$APK" | tee "$RUNNER_TEMP/preview50-output/static-checks.txt"
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$sha" > "$RUNNER_TEMP/preview50-output/SHA256.txt"
          echo "::notice title=5.0 preview SHA256::$sha"
      - name: Transfer preview as Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP']); apk=t/'preview50-output/Synthetica-5.0-PREVIEW-NOT-MANAGER.apk'
          (t/'preview50-blob.json').write_text(json.dumps({'content':base64.b64encode(apk.read_bytes()).decode(),'encoding':'base64'}))
          PY
          blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/preview50-blob.json" --jq .sha)
          echo "::notice title=5.0 preview blob::$blob"
      - name: Expose preview build diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/preview50-output/build.log" ]; then
            python3 - <<'PY'
          import base64,json,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP']); p=t/'preview50-output/build.log'
          (t/'preview50-log.json').write_text(json.dumps({'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'}))
          PY
            blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/preview50-log.json" --jq .sha)
            echo "::notice title=5.0 preview build log blob::$blob"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetica50-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/preview50-output/
          retention-days: 14
          if-no-files-found: warn
