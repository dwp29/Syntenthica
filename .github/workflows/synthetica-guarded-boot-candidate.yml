name: Synthetica guarded boot-first candidate

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-guarded-boot-candidate.yml'
  workflow_dispatch:
    inputs:
      release_id:
        description: ID of the separate, unpublished guarded-candidate draft
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: synthetica-guarded-boot-first-draft
  cancel-in-progress: false

jobs:
  guarded-candidate:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      SYNTHETICA_REQUIRE_EDIFY: '1'
    steps:
      - name: Check out the approved working branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve the new draft without touching the previous draft
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_ID" ]]; then
            id="$RELEASE_ID"
          else
            id=$(gh api 'repos/dwp29/Syntenthica/releases?per_page=100' --jq \
              '[.[] | select(.draft == true and .tag_name == "synthetica-boot-first-20261102-02-installer-guard-draft") | .id] | if length == 1 then .[0] else error("Expected exactly one new draft") end')
          fi
          [[ "$id" =~ ^[1-9][0-9]*$ ]]
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"

      - name: Use the exact reconstruction Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.2'

      - name: Build the exact zlib version for byte-identical reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v1.2.13 https://github.com/madler/zlib.git "$RUNNER_TEMP/zlib-source"
          test "$(git -C "$RUNNER_TEMP/zlib-source" rev-parse HEAD)" = '04f42ceca40f73e2978b50e93806c2a18c1281fc'
          cd "$RUNNER_TEMP/zlib-source"
          ./configure --prefix="$RUNNER_TEMP/zlib-1.2.13"
          make -j2
          make install
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/zlib-1.2.13/lib" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/zlib-1.2.13/lib" python -c 'import sys,zlib; assert sys.version_info[:3] == (3,11,2); assert zlib.ZLIB_RUNTIME_VERSION == "1.2.13"'

      - name: Install the host-only reference parser tools
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, zlib
          if sys.version_info[:3] != (3, 11, 2) or zlib.ZLIB_RUNTIME_VERSION != '1.2.13':
              raise SystemExit('The exact reconstruction needs Python 3.11.2 and zlib 1.2.13')
          PY
          if ! command -v m4 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq m4
          fi
          command -v g++
          command -v unzip
          python -m pip install --disable-pip-version-check --require-hashes \
            -r tests/fixtures/edify_lineage_8d9befac/requirements.txt
          python -m pip install --disable-pip-version-check --require-hashes \
            -r synthetica-project/requirements-boot-audit.txt
          bison --version | head -1
          flex --version
          m4 --version | head -1

      - name: Run synthetic and regression tests before building
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_build_guarded_candidate.py' -v
          python -m unittest discover -s tests -p 'test_github_guarded_release.py' -v
          python -m unittest discover -s tests -p 'test_guarded_edify_reference.py' -v
          python -m unittest discover -s tests -p 'test_audit_boot_first_installer.py' -v
          python -m unittest discover -s tests -p 'test_rom_preservation.py' -v
          python -m unittest discover -s tests -p 'test_reconstruct_boot_candidate.py' -v
          python -m unittest discover -s tests -p 'test_build_boot_candidate.py' -v
          python -m unittest discover -s tests -p 'test_github_release_transfer.py' -v

      - name: Check workspace space on this disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free < 13500000000 )); then
            echo 'Removing optional SDKs from this disposable runner only.'
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          fi
          df -h "$RUNNER_TEMP"
          python - <<'PY'
          import os, shutil
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 13_500_000_000:
              raise SystemExit('Not enough free runner space; original and old draft remain untouched')
          PY

      - name: Retrieve the delta from the new private draft
        shell: bash
        run: |
          set -euo pipefail
          python synthetica-project/github_guarded_release.py get-delta \
            --release-id "$RELEASE_ID" --delta "$RUNNER_TEMP/synthetica-guarded-delta.json.gz"

      - name: Fetch the locked original source into temporary runner storage
        shell: bash
        run: |
          set -euo pipefail
          # Same source and checksum used successfully for the previous candidate.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 3600 \
            --max-filesize 4512854711 --output "$RUNNER_TEMP/synthetica-original-locked.zip" \
            'https://pixeldrain.com/api/file/DKkWRTMZ?download'
          echo '454580f463e7f6ac922546075a2a033c6dc2fac3275e450573635a1ca7b0ec63  '"$RUNNER_TEMP/synthetica-original-locked.zip" | sha256sum --check --status
          echo 'Original ZIP SHA-256 verified on the disposable runner.'

      - name: Reconstruct and verify the first candidate byte for byte
        shell: bash
        run: |
          set -euo pipefail
          python synthetica-project/reconstruct_boot_candidate.py \
            "$RUNNER_TEMP/synthetica-original-locked.zip" \
            "$RUNNER_TEMP/synthetica-guarded-delta.json.gz" \
            "$RUNNER_TEMP/synthetica-boot-first-20261102-01.zip"

      - name: Simulate all write outcomes using the actual old script as data
        shell: bash
        env:
          SYNTHETICA_REFERENCE_ZIP: ${{ runner.temp }}/synthetica-boot-first-20261102-01.zip
        run: |
          set -euo pipefail
          # The reference evaluator uses in-memory mocks and never opens a device.
          python -m unittest discover -s tests -p 'test_guarded_edify_reference.py' -v
          rm -- "$RUNNER_TEMP/synthetica-original-locked.zip"
          python - <<'PY'
          import os, shutil
          needed = 4_713_790_032 + 1_610_612_736 + 1_073_741_824
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < needed:
              raise SystemExit('Insufficient runner space for a separate output and a part')
          PY

      - name: Build and independently inspect the separate guarded ZIP
        shell: bash
        run: |
          set -euo pipefail
          python synthetica-project/build_guarded_candidate.py \
            "$RUNNER_TEMP/synthetica-boot-first-20261102-01.zip" \
            "$RUNNER_TEMP/synthetica-boot-first-20261102-02-installer-guard.zip" \
            --report "$RUNNER_TEMP/BUILD-REPORT-BOOT-FIRST-02.json"
          unzip -t "$RUNNER_TEMP/synthetica-boot-first-20261102-02-installer-guard.zip" \
            | tee "$RUNNER_TEMP/synthetica-guarded-unzip-test.log"

      - name: Upload verified parts and report to the new draft only
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/synthetica-guarded-parts"
          python synthetica-project/github_guarded_release.py upload \
            --release-id "$RELEASE_ID" \
            --candidate "$RUNNER_TEMP/synthetica-boot-first-20261102-02-installer-guard.zip" \
            --report "$RUNNER_TEMP/BUILD-REPORT-BOOT-FIRST-02.json" \
            --work "$RUNNER_TEMP/synthetica-guarded-parts" \
            --unzip-log "$RUNNER_TEMP/synthetica-guarded-unzip-test.log"
