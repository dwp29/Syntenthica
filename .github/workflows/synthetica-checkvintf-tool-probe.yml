name: Synthetica official checkvintf tool probe

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-checkvintf-tool-probe.yml'
  workflow_dispatch:

# This probe contains no ROM input and never uploads binaries. It downloads the
# pinned public AOSP host tool onto a disposable runner, checks its SHA-256
# against the build's published in-toto statement, and tests its availability
# in an isolated network namespace. The statement's signature is not verified.
permissions:
  contents: read
  checks: write

jobs:
  probe:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Fetch the pinned Android 17 build artifacts
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/checkvintf-fetch.log") 2>&1
          cd "$RUNNER_TEMP"
          base='https://ci.android.com/builds/submitted/16644040/aosp_cf_x86_64_only_phone-userdebug/latest'
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then echo 'A headless browser is unavailable'; exit 1; fi
          # Android CI is a JavaScript viewer, not a direct binary URL. Resolve
          # only its public short-lived storage link; never print or persist it
          # outside the disposable runner. No Google login is used.
          fetch_public_artifact() {
            local artifact="$1" destination="$2" max_bytes="$3" link
            echo "Resolving public artifact: $artifact"
            "$chrome" --headless --no-sandbox --disable-gpu --no-first-run \
              --user-data-dir="$RUNNER_TEMP/chrome-profile-$artifact" \
              --virtual-time-budget=12000 --timeout=30000 --dump-dom "$base/$artifact" \
              > "$RUNNER_TEMP/artifact-dom.html" 2> "$RUNNER_TEMP/artifact-browser.log"
            link="$(python3 - "$RUNNER_TEMP/artifact-dom.html" "$artifact" <<'PY'
          import html.parser, pathlib, sys, urllib.parse
          class Links(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls = []; self.links = []; self.text = []; self.hidden = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style'): self.hidden += 1
                  href = dict(attrs).get('href', '') if tag == 'a' else ''
                  u = urllib.parse.urlsplit(href)
                  if href: self.links.append((u.hostname or '', u.path[:180]))
                  if (u.scheme == 'https' and u.hostname == 'storage.googleapis.com'
                          and u.path.startswith('/android-build/builds/aosp-android-latest-release-')
                          and '/16644040/' in u.path and u.path.endswith('/' + sys.argv[2])):
                      self.urls.append(href)
              def handle_endtag(self, tag):
                  if tag in ('script', 'style'): self.hidden = max(0, self.hidden - 1)
              def handle_data(self, data):
                  if not self.hidden and data.strip(): self.text.append(data.strip()[:160])
          parser = Links(); parser.feed(pathlib.Path(sys.argv[1]).read_text())
          urls = set(parser.urls)
          if len(urls) != 1:
              print('Viewer text (bounded):', parser.text[:20], file=sys.stderr)
              print('Link host/path only (no queries):', parser.links[:20], file=sys.stderr)
              raise SystemExit('Expected one official Android Build storage download link')
          print(urls.pop())
          PY
            )"
            rm -f -- "$RUNNER_TEMP/artifact-dom.html" "$RUNNER_TEMP/artifact-browser.log"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 2 --max-time 900 --max-filesize "$max_bytes" "$link" -o "$destination"
            unset link
          }
          fetch_public_artifact multiple.intoto.jsonl android-build.intoto.jsonl 2097152
          fetch_public_artifact manifest_16644040.xml android-build-manifest.xml 2097152
          fetch_public_artifact otatools.zip android-otatools.zip 734003200
          python3 - <<'PY'
          import base64, hashlib, json, os, stat, xml.etree.ElementTree as ET, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          toolzip = root / 'android-otatools.zip'
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(4 * 1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          print('otatools bytes:', toolzip.stat().st_size)
          digest = sha256(toolzip)
          subjects = set()
          for line in (root / 'android-build.intoto.jsonl').read_text().splitlines():
              envelope = json.loads(line)
              payload = json.loads(base64.b64decode(envelope['payload'], validate=True))
              subjects.update(s['digest']['sha256'] for s in payload.get('subject', [])
                              if s.get('name') == 'otatools.zip' and 'sha256' in s.get('digest', {}))
          if subjects != {digest}:
              raise SystemExit(f'Published in-toto subject digest mismatch or missing: {subjects}')
          print('otatools SHA-256 (matches public build statement; signature not checked):', digest)
          manifest = ET.parse(root / 'android-build-manifest.xml').getroot()
          print('libvintf source projects:', [(p.get('name'), p.get('revision')) for p in manifest.iter('project')
                                                if p.get('path') == 'system/libvintf' or p.get('name', '').endswith('/system/libvintf')])
          extracted = root / 'android-otatools-minimal'
          extracted.mkdir()
          with zipfile.ZipFile(toolzip) as z:
              selected = [i for i in z.infolist() if i.filename == 'bin/checkvintf' or
                          (i.filename.startswith('lib64/') and i.filename.count('/') == 1 and i.filename.endswith('.so'))]
              if sum(i.filename == 'bin/checkvintf' for i in selected) != 1 or len(selected) > 300:
                  raise SystemExit('Unexpected checkvintf archive contents')
              total = 0
              for info in selected:
                  p = Path(info.filename)
                  mode = info.external_attr >> 16
                  total += info.file_size
                  if p.is_absolute() or '..' in p.parts or (mode and stat.S_ISLNK(mode)) or total > 512 * 1024**2:
                      raise SystemExit('Unsafe or oversized selected archive entry')
                  dest = extracted / p
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  if dest.exists():
                      raise SystemExit('Duplicate archive entry')
                  with z.open(info) as src, dest.open('xb') as dst:
                      import shutil
                      shutil.copyfileobj(src, dst)
                  dest.chmod(0o755 if info.filename == 'bin/checkvintf' else 0o644)
              print('extracted selected files:', len(selected), 'bytes:', total)
          binary = extracted / 'bin/checkvintf'
          print('checkvintf SHA-256:', sha256(binary))
          print('intoto statement SHA-256:', sha256(root / 'android-build.intoto.jsonl'))
          print('manifest SHA-256:', sha256(root / 'android-build-manifest.xml'))
          PY
          file "$RUNNER_TEMP/android-otatools-minimal/bin/checkvintf"
          readelf -d "$RUNNER_TEMP/android-otatools-minimal/bin/checkvintf" | grep -E 'NEEDED|RPATH|RUNPATH' || true

      - name: Probe the tool with no network and no ROM input
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/checkvintf-probe.log") 2>&1
          root="$RUNNER_TEMP/android-otatools-minimal"
          unshare --user --map-root-user --mount --net --pid --fork \
            env -i PATH=/usr/bin:/bin LD_LIBRARY_PATH="$root/lib64" \
            "$root/bin/checkvintf" --dump-file-list
          echo 'Isolated --dump-file-list exited 0.'

      - name: Preserve bounded tool-probe metadata, including failures
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          logs = []
          for name in ('checkvintf-fetch.log', 'checkvintf-probe.log'):
              p = root / name
              text = p.read_text(errors='replace')[:12000] if p.exists() else '(not started)'
              logs.append(f'{name}:\n{text}')
          summary = ('Public official-tool probe only; no candidate, images, or device. '
                     'The in-toto signature is not verified.\n\n' + '\n\n'.join(logs))
          success = os.environ['FETCH_OUTCOME'] == os.environ['PROBE_OUTCOME'] == 'success'
          payload = {'name': 'Synthetica official checkvintf probe metadata', 'head_sha': os.environ['GITHUB_SHA'],
                     'status': 'completed', 'conclusion': 'success' if success else 'neutral',
                     'output': {'title': 'Public tool probe (not ROM compatibility)', 'summary': summary}}
          subprocess.run(['gh', 'api', '--method', 'POST', 'repos/dwp29/Syntenthica/check-runs', '--input', '-'],
                         input=json.dumps(payload).encode(), stdout=subprocess.DEVNULL, check=True)
          PY
