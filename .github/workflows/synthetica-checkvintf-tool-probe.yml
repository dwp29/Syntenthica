name: Synthetica official checkvintf tool probe

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-checkvintf-tool-probe.yml'
  workflow_dispatch:

# This probe contains no ROM input and never uploads binaries. It downloads the
# pinned public AOSP host tool onto a disposable runner, checks its SHA-256
# against the build's published in-toto statement, and tests its availability
# in an isolated network namespace. The statement's signature is not verified.
permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Fetch the pinned Android 17 build artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base='https://ci.android.com/builds/submitted/16644040/aosp_cf_x86_64_only_phone-userdebug/latest'
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 --max-filesize 2097152 "$base/multiple.intoto.jsonl" -o android-build.intoto.jsonl
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 180 --max-filesize 2097152 "$base/manifest_16644040.xml" -o android-build-manifest.xml
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 900 --max-filesize 734003200 "$base/otatools.zip" -o android-otatools.zip
          python3 - <<'PY'
          import base64, hashlib, json, os, stat, xml.etree.ElementTree as ET, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          toolzip = root / 'android-otatools.zip'
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(4 * 1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          print('otatools bytes:', toolzip.stat().st_size)
          digest = sha256(toolzip)
          subjects = set()
          for line in (root / 'android-build.intoto.jsonl').read_text().splitlines():
              envelope = json.loads(line)
              payload = json.loads(base64.b64decode(envelope['payload'], validate=True))
              subjects.update(s['digest']['sha256'] for s in payload.get('subject', [])
                              if s.get('name') == 'otatools.zip' and 'sha256' in s.get('digest', {}))
          if subjects != {digest}:
              raise SystemExit(f'Published in-toto subject digest mismatch or missing: {subjects}')
          print('otatools SHA-256 (matches public build statement; signature not checked):', digest)
          manifest = ET.parse(root / 'android-build-manifest.xml').getroot()
          print('libvintf source projects:', [(p.get('name'), p.get('revision')) for p in manifest.iter('project')
                                                if p.get('path') == 'system/libvintf' or p.get('name', '').endswith('/system/libvintf')])
          extracted = root / 'android-otatools-minimal'
          extracted.mkdir()
          with zipfile.ZipFile(toolzip) as z:
              selected = [i for i in z.infolist() if i.filename == 'bin/checkvintf' or
                          (i.filename.startswith('lib64/') and i.filename.count('/') == 1 and i.filename.endswith('.so'))]
              if sum(i.filename == 'bin/checkvintf' for i in selected) != 1 or len(selected) > 300:
                  raise SystemExit('Unexpected checkvintf archive contents')
              total = 0
              for info in selected:
                  p = Path(info.filename)
                  mode = info.external_attr >> 16
                  total += info.file_size
                  if p.is_absolute() or '..' in p.parts or (mode and stat.S_ISLNK(mode)) or total > 512 * 1024**2:
                      raise SystemExit('Unsafe or oversized selected archive entry')
                  dest = extracted / p
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  if dest.exists():
                      raise SystemExit('Duplicate archive entry')
                  with z.open(info) as src, dest.open('xb') as dst:
                      import shutil
                      shutil.copyfileobj(src, dst)
                  dest.chmod(0o755 if info.filename == 'bin/checkvintf' else 0o644)
              print('extracted selected files:', len(selected), 'bytes:', total)
          binary = extracted / 'bin/checkvintf'
          print('checkvintf SHA-256:', sha256(binary))
          print('intoto statement SHA-256:', sha256(root / 'android-build.intoto.jsonl'))
          print('manifest SHA-256:', sha256(root / 'android-build-manifest.xml'))
          PY
          file "$RUNNER_TEMP/android-otatools-minimal/bin/checkvintf"
          readelf -d "$RUNNER_TEMP/android-otatools-minimal/bin/checkvintf" | grep -E 'NEEDED|RPATH|RUNPATH' || true

      - name: Probe the tool with no network and no ROM input
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/android-otatools-minimal"
          unshare --user --map-root-user --mount --net --pid --fork \
            env -i PATH=/usr/bin:/bin LD_LIBRARY_PATH="$root/lib64" \
            "$root/bin/checkvintf" --help > "$RUNNER_TEMP/checkvintf-help.txt" 2>&1 || status=$?
          status=${status:-0}
          echo "checkvintf --help exit: $status"
          cat "$RUNNER_TEMP/checkvintf-help.txt"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
