name: Diagnose Neutron KSU object without producing an image (temporary)
on:
  push:
    paths:
      - .github/workflows/synthetica2-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc flex bison libssl-dev libelf-dev device-tree-compiler cpio lz4 xz-utils zstd python3 patch openssl zip rsync git curl binutils kmod
      - name: Download and verify pinned Neutron
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/neutron.tar.zst"
          curl --fail --location --retry 3 --output "$archive" https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          echo "531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30  $archive" | sha256sum -c -
          test "$(stat -c %s "$archive")" = 77768187
          mkdir "$RUNNER_TEMP/neutron"
          tar -I zstd -xf "$archive" -C "$RUNNER_TEMP/neutron"
          echo "S2X_TOOLCHAIN_BIN=$RUNNER_TEMP/neutron/bin" >> "$GITHUB_ENV"
      - name: Prepare disposable object-only diagnostic
        run: |
          set -euo pipefail
          python3 build-kit/scripts/build_synthetica2_experimental.py prepare --source build-kit --destination "$RUNNER_TEMP/s2x-kit" --baseline artifacts/generated.config.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          script = Path(os.environ['RUNNER_TEMP']) / 's2x-kit/ci/rollercoaster/build-rollercoaster.sh'
          text = script.read_text()
          marker = 'echo "--- FULL BUILD $(date -u) ---"'
          assert text.count(marker) == 1
          script.write_text(text[:text.index(marker)] + 'echo "Object-only diagnosis; no image or installer"\nexit 0\n')
          PY
      - name: Compile KSU object and inspect identity representation
        env:
          SP_JOBS: '4'
          SP_RELEASE_VERSION: '2.0-exp'
          SP_PROFILE: synthetica
          SP_BUILD_NAME: Synthetica
          SP_BUILD_KVER: '2.0-exp'
          SP_EXPECT_RELEASE: 4.14.357-openela-Synthetica-2.0-exp
          PYTHONOPTIMIZE: '0'
        run: |
          set -euo pipefail
          export SP_WORK_DIR="$RUNNER_TEMP/s2x-work"
          export S2X_HELPER="$GITHUB_WORKSPACE/build-kit/scripts/build_synthetica2_experimental.py"
          export S2X_BASELINE="$GITHUB_WORKSPACE/artifacts/generated.config.txt"
          # The parent driver intentionally reports a missing image after the object-only stop.
          python3 "$RUNNER_TEMP/s2x-kit/scripts/build_chronicle_base.py" || true
          export OBJ="$SP_WORK_DIR/tree/out-synthetica/drivers/kernelsu/manager/apk_sign.o"
          test -s "$OBJ"
          aarch64-linux-gnu-objdump -dr --disassemble=is_manager_apk "$OBJ" > "$RUNNER_TEMP/disassembly.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = Path(os.environ['OBJ']).read_bytes()
          temp = Path(os.environ['RUNNER_TEMP'])
          log = (temp / 's2x-kit/artifacts/build.log').read_text(errors='replace')
          def notice(title, msg):
              safe = msg[:3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title={title}::{safe}')
          for name, value in [('KernelSU', b'KernelSU'), ('manager_package', b'net.ember.labs'), ('manager_hash', b'fe833710a733f63061691c87ff222e84ca2fa462582aceaf5f577fe799ab4140')]:
              notice('KSU object ' + name, 'full literal present=' + str(value in raw))
          dis = (temp / 'disassembly.txt').read_text()
          notice('KSU object disassembly part 1', dis[:3000])
          notice('KSU object disassembly part 2', dis[3000:6000])
          notice('KSU object build completion', '\n'.join(log.splitlines()[-30:]))
          PY
