name: Inspect current LLVM 18 job progress (temporary)
on:
  push:
    paths:
      - .github/workflows/synthetica2-inspect.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the current job log snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/128002419354/logs" > "$RUNNER_TEMP/job.log" 2> "$RUNNER_TEMP/error.log"; then
            cp "$RUNNER_TEMP/error.log" "$RUNNER_TEMP/job.log"
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          rows = (Path(os.environ['RUNNER_TEMP']) / 'job.log').read_text(errors='replace').splitlines()
          text = '\n'.join(rows[-30:])
          text = re.sub(r'https?://\S+', '<url>', text)
          text = text[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=LLVM 18 live progress snapshot::' + text)
          PY
