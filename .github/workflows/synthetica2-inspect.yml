name: Inspect one failed 2.0 experiment log (temporary)
on:
  push:
    paths:
      - .github/workflows/synthetica2-inspect.yml
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Download pinned diagnostic log, no image or installer
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Synthetica-2.0-neutron-FAILED-42245943990
          path: diagnostic
          run-id: 42245943990
          github-token: ${{ github.token }}
      - name: Inspect manager preparation evidence
        run: |
          set -eu
          find diagnostic -type f -printf '%p %s bytes\n'
          python3 - <<'PY'
          from pathlib import Path
          needles = ('[patch] sertifikat Manager', 'KernelSU-Next Manager', 'apk_sign:', 'CERT_MAX', 'drivers/kernelsu/manager/apk_sign', 'KernelSU-Next tag', 'KernelSU-Next version')
          lines = list(dict.fromkeys(line for line in Path('diagnostic/build.log').read_text(errors='replace').splitlines() if any(needle in line for needle in needles)))
          text = '\n'.join(lines).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Manager preparation::' + text[:3900])
          PY
