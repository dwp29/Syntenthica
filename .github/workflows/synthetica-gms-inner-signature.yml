name: Synthetica Google inner APK signature
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-gms-inner-signature.yml, synthetica-project/audit_gms_inner_signature.py, tests/test_audit_gms_inner_signature.py]
  workflow_dispatch:
# Read-only audit on a disposable runner; private APK is never installed or published.
permissions:
  contents: write # read existing private candidate 03 draft
  checks: write
jobs:
  audit:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned filesystem reader
        run: python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-boot-audit.txt
      - name: Run controls
        run: |
          python -m unittest discover -s tests -p 'test_audit_gms_inner_signature.py' -v
          python -m unittest discover -s tests -p 'test_audit_gms_erofs.py' -v
          python -m unittest discover -s tests -p 'test_apk_signer_output.py' -v
      - name: Select verifiers and reserve disposable space
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools=$(find "$root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$tools/aapt" && test -x "$tools/aapt2" && test -x "$tools/apksigner"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free < 15000000000 )); then sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; fi
          python -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free > 14000000000'
          mkdir "$RUNNER_TEMP/gms-inner"
      - name: Fetch pinned AOSP host tools
        shell: bash
        run: |
          set -euo pipefail
          url='https://ci.android.com/builds/submitted/16644040/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip'
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 900 --max-filesize 734003200 "$url" -o "$RUNNER_TEMP/aosp-otatools.zip"
          echo 'bc85557aa0c59a7d0b48b8175250948d67b2d0f293bd74eb8d5753ba4ad7781f  '"$RUNNER_TEMP/aosp-otatools.zip" | sha256sum -c -
      - name: Verify inner signature with synthetic controls
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          tools='${{ steps.setup.outputs.tools }}'
          python -u synthetica-project/audit_gms_inner_signature.py --work "$RUNNER_TEMP/gms-inner" \
            --report "$RUNNER_TEMP/gms-inner-result.json" --otatools "$RUNNER_TEMP/aosp-otatools.zip" \
            --aapt "$tools/aapt" --aapt2 "$tools/aapt2" --apksigner "$tools/apksigner"
      - name: Record bounded result including failures
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'gms-inner-result.json'
          result=json.loads(path.read_text()) if path.is_file() else {'status':'PREPARATION_FAILED_HOLD'}
          result['outcome']=os.environ['AUDIT_OUTCOME']
          text=json.dumps(result,ensure_ascii=True,separators=(',',':'))
          if len(text)>30000: raise SystemExit('Inner APK audit exceeds bound')
          ok=(result.get('apk_signature',{}).get('signature_verified_on_host') is True
              and result.get('temporary_apk_removed') is True and result['outcome']=='success')
          payload={'name':'Synthetica Google inner APK signature','head_sha':os.environ['GITHUB_SHA'],'status':'completed',
                   'conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Host self-consistency only; device trust not assessed','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(),stdout=subprocess.DEVNULL,check=True)
          PY
