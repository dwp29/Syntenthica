name: Inspect user-provided Lunaris artifact metadata (temporary)
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/lunaris-lookup.yml]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read landing page and its public application metadata
        run: |
          set -euo pipefail
          curl --fail --location --max-time 60 --max-filesize 2000000 'https://artifacts.serverhive.in/?id=lunaris-aosp-miatoll-20261103-045856621051' -o "$RUNNER_TEMP/page.html"
          path=$(python3 -c 'import re,sys; print(re.search(r"src=\"(/assets/js/index-[^\"]+\.js)\"", open(sys.argv[1]).read()).group(1))' "$RUNNER_TEMP/page.html")
          curl --fail --location --max-time 60 --max-filesize 5000000 "https://artifacts.serverhive.in$path" -o "$RUNNER_TEMP/app.js"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'app.js').read_text(errors='replace')
          patterns = [r'https?://[^\s"<>`\\]+', r'.{0,100}(?:fetch\(|/api/|axios\.|download|artifact).{0,160}']
          found = []
          for pattern in patterns:
              for match in re.finditer(pattern, text, flags=re.I):
                  row = match.group(0)
                  if row not in found: found.append(row)
          result = json.dumps({'bytes': len(text), 'matches': found[:40]}, indent=2)
          for idx, start in enumerate(range(0, min(len(result), 8500), 2200), 1):
              chunk = result[start:start+2200].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Application metadata {idx}::{chunk}')
          PY
