name: Inspect user-provided Lunaris artifact metadata (temporary)
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/lunaris-lookup.yml]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect public page without downloading any ROM
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright-core@1.57.0
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node <<'JS'
          const { chromium } = require(process.env.RUNNER_TEMP + '/browser/node_modules/playwright-core');
          (async () => {
            const browser = await chromium.launch({executablePath: process.env.CHROME, headless: true, args: ['--no-sandbox']});
            const context = await browser.newContext({acceptDownloads: false});
            const page = await context.newPage();
            const requests = [];
            page.on('response', response => {
              const u = new URL(response.url());
              if (u.hostname.endsWith('serverhive.in') && !u.pathname.includes('/assets/'))
                requests.push({path: u.origin + u.pathname, status: response.status(), type: response.headers()['content-type']});
            });
            await page.route('**/*', route => {
              const u = new URL(route.request().url());
              if (/\.(zip|img|bin)(?:$|\/)/i.test(u.pathname)) return route.abort();
              return route.continue();
            });
            await page.goto('https://artifacts.serverhive.in/?id=lunaris-aosp-miatoll-20261103-045856621051', {waitUntil: 'networkidle', timeout: 60000});
            await page.waitForTimeout(3000);
            const details = await page.evaluate(() => ({
              title: document.title,
              text: document.body.innerText.slice(0, 9000),
              links: Array.from(document.querySelectorAll('a[href]')).map(x => ({text: x.innerText, href: x.href.split('?')[0]})).slice(0, 60),
              buttons: Array.from(document.querySelectorAll('button')).map(x => ({text: x.innerText, label: x.getAttribute('aria-label')})).slice(0, 50)
            }));
            details.responses = requests.slice(0, 60);
            const text = JSON.stringify(details, null, 2);
            for (let i=0; i<Math.min(text.length, 12000); i+=2200) {
              const part = text.slice(i,i+2200).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
              console.log(`::notice title=Rendered metadata ${1+i/2200}::${part}`);
            }
            await browser.close();
          })().catch(e => { console.error(e.message); process.exit(1); });
          JS
