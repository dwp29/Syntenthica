name: Synthetica public Madrid metadata probe

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-madrid-reference-probe.yml'
      - 'synthetica-project/probe_madrid_ota_reference.py'
      - 'tests/test_probe_madrid_ota_reference.py'
  workflow_dispatch:

# The public ROM is not downloaded or executed. Only explicitly bounded HTTP
# ranges (at most 16 MiB), ZIP metadata and the payload manifest are read.
# Reported partition hashes are unverified remote claims, not verified images,
# provenance, compatible donor material, or permission to flash any device.
permissions:
  contents: read
  checks: write

concurrency:
  group: synthetica-madrid-reference-metadata
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up host Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Exercise bounded range and synthetic payload controls
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_probe_madrid_ota_reference.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun < 10 or result.skipped or not result.wasSuccessful():
              sys.exit('All synthetic range controls must run and pass without skips')
          PY
      - name: Read only bounded public metadata ranges
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          python synthetica-project/probe_madrid_ota_reference.py > "$RUNNER_TEMP/madrid-probe.json"
      - name: Publish bounded metadata or inconclusive outcome
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'madrid-probe.json'
          if path.is_file():
              result = json.loads(path.read_text())
          else:
              result = {'status': 'inconclusive_no_device_or_provenance_verdict',
                        'error': 'Synthetic controls or bounded probe did not complete'}
          ok = (os.environ['PROBE_OUTCOME'] == 'success'
                and result.get('schema') == 'synthetica-madrid-reference-range-probe-v1'
                and result.get('status') == 'partial_unverified_reference_metadata_only_not_a_rom_or_flash_approval'
                and result.get('catalog_md5_verified') is False
                and type(result.get('range_bytes')) is int and result['range_bytes'] <= 16 * 1024 * 1024
                and type(result.get('range_requests')) is int and result['range_requests'] <= 32
                and len(result.get('port_partition_comparisons', [])) == 4)
          if not ok and result.get('status') != 'inconclusive_no_device_or_provenance_verdict':
              result = {'status': 'inconclusive_no_device_or_provenance_verdict',
                        'error': 'Bounded metadata or integrity checks did not complete'}
          text = json.dumps(result, ensure_ascii=True, separators=(',', ':'))
          if len(text) > 45000:
              raise SystemExit('Unexpectedly large metadata summary')
          payload = {'name': 'Synthetica Madrid range metadata', 'head_sha': os.environ['GITHUB_SHA'],
                     'status': 'completed', 'conclusion': 'success' if ok else 'neutral',
                     'output': {'title': 'Unverified partial source metadata; not device readiness', 'summary': text}}
          subprocess.run(['gh', 'api', '--method', 'POST', 'repos/dwp29/Syntenthica/check-runs', '--input', '-'],
                         input=json.dumps(payload).encode(), stdout=subprocess.DEVNULL, check=True)
          PY
