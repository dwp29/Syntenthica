name: "Synthetica 3.0 - host safety tests (no ROM)"

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica3-host-audit.yml'
      - 'build-kit/scripts/audit_synthetica3_vendor.py'
      - 'build-kit/scripts/audit_synthetica3_boot.py'
      - 'build-kit/scripts/build_synthetica3.py'
      - 'build-kit/scripts/verify_synthetica3_modules.py'
      - 'tests/test_synthetica3_*.py'
      - 'artifacts/synthetica-3.0/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetica-3-host-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Verify host test prerequisites
        run: |
          set -euo pipefail
          command -v python3
          command -v gcc
          command -v openssl
      - name: Run synthetic and public-bundle tests only
        run: |
          set +e
          python3 -m unittest discover -s tests -p 'test_synthetica3_*.py' -v > "$RUNNER_TEMP/host-tests.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/host-tests.log"
          if [ "$rc" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'host-tests.log').read_text(errors='replace')[-16000:]
          for i in range(0, len(text), 1800):
              s = text[i:i + 1800].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Host test diagnostics {i // 1800 + 1}::{s}')
          PY
          fi
          exit "$rc"
