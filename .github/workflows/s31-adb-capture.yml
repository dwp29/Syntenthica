name: "Synthetica 3.1 - recovery log capture host tests"

on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths:
      - '.github/workflows/s31-adb-capture.yml'
      - 'build-kit/ci/s31-adb-capture/**'
      - 'tests/test_s31_adb_capture.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: "Fake-ADB tests (no device or recovery)"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python and run offline host tests
        run: |
          python --version
          python -m py_compile build-kit/ci/s31-adb-capture/capture.py
          python -m unittest discover -s tests -p test_s31_adb_capture.py -v
