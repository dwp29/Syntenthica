name: Diagnose Neon Manager verification (temporary)
on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica30-neon-diagnostic-temp.yml'
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: synthetica30-neon-unsigned-42344911073
          run-id: 42344911073
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/neon-failed
      - name: Identify previous verification failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api 'repos/dwp29/Syntenthica/actions/jobs/128320452662/logs' > "$RUNNER_TEMP/manager-failed.log" 2> "$RUNNER_TEMP/log-error.txt" || true
          python3 - <<'PY'
          import os,pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          text=(tmp/'manager-failed.log').read_text(errors='replace')
          error=(tmp/'log-error.txt').read_text(errors='replace')
          if error:
              safe=error[-3000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Log fetch result::'+safe)
          lines=text.splitlines()
          needle=[i for i,line in enumerate(lines) if 'Verify package, permissions, alignment and UAPI' in line]
          if needle:
              relevant='\n'.join(lines[needle[-1]:][-120:])
          else:
              relevant='\n'.join(lines[-130:])
          for i in range(0,len(relevant),3500):
              s=relevant[i:i+3500].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice title=Failed verification log {i//3500+1}::{s}')
          files=tmp/'neon-failed'
          for p in sorted(files.rglob('*')):
              if p.is_file():
                  print(f'::notice title=Failed output file::{p.relative_to(files)} ({p.stat().st_size} bytes)')
                  if p.suffix == '.txt':
                      data=p.read_text(errors='replace')[-3000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print(f'::notice title={p.name}::{data}')
          PY
      - name: Transfer unverified compiled bytes for diagnostic-only retest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,hashlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          found=list((tmp/'neon-failed').rglob('Synthetica-Manager-3.0.0-Neon-UNSIGNED.apk'))
          if len(found)!=1:
              raise SystemExit(f'Expected one compiled APK, got {found}')
          data=found[0].read_bytes()
          print('::notice title=UNVERIFIED candidate SHA-256::'+hashlib.sha256(data).hexdigest())
          (tmp/'diag-blob.json').write_text(json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}))
          PY
          blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/diag-blob.json" --jq .sha)
          echo "::notice title=Compiled candidate blob before retest::$blob"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build tools for candidate retest
        run: |
          set -euo pipefail
          SDK="$HOME/neon-verify-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.1.0' 2>&1 | tail -8
      - name: Recheck exact previously compiled APK without rebuilding
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/neon-failed/Synthetica-Manager-3.0.0-Neon-UNSIGNED.apk"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          echo '2c04be6a223f53217305e39a0b6cce9e6c7e01c2df5d59f19826427b3bcd6441  '"$APK" | sha256sum -c -
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/retest-badging.txt"
          grep -F "name='net.ember.labs'" "$RUNNER_TEMP/retest-badging.txt"
          grep -F "versionCode='40000'" "$RUNNER_TEMP/retest-badging.txt"
          grep -F "versionName='3.0.0'" "$RUNNER_TEMP/retest-badging.txt"
          "$TOOLS/aapt" dump permissions "$APK" | grep '^uses-permission' | sort > "$RUNNER_TEMP/retest-permissions.txt" || true
          "$TOOLS/aapt" dump permissions release/Synthetica-2.0.apk | grep '^uses-permission' | sort > "$RUNNER_TEMP/retest-reference-permissions.txt" || true
          test -s "$RUNNER_TEMP/retest-permissions.txt"
          test -s "$RUNNER_TEMP/retest-reference-permissions.txt"
          diff -u "$RUNNER_TEMP/retest-reference-permissions.txt" "$RUNNER_TEMP/retest-permissions.txt"
          python3 tests/verify_synthetica30_apk.py "$APK" | tee "$RUNNER_TEMP/retest-static.txt"
          if "$TOOLS/apksigner" verify "$APK" > "$RUNNER_TEMP/retest-signature.txt" 2>&1; then
            echo '::error::The candidate should be unsigned.'
            exit 1
          fi
          grep -q 'DOES NOT VERIFY' "$RUNNER_TEMP/retest-signature.txt"
          "$TOOLS/apksigner" verify --print-certs release/Synthetica-2.0.apk > "$RUNNER_TEMP/retest-reference-cert.txt"
          grep -iF 'fe833710a733f63061691c87ff222e84ca2fa462582aceaf5f577fe799ab4140' "$RUNNER_TEMP/retest-reference-cert.txt"
          python3 - <<'PY'
          import os,pathlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ('retest-badging.txt','retest-static.txt','retest-signature.txt','retest-reference-cert.txt'):
              text=(tmp/name).read_text(errors='replace')[-3000:]
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice title={name}::{text}')
          PY
          echo '::notice title=Candidate retest::Exact compiled APK passed metadata, permission parity, alignment, UAPI and unsigned gates. No runtime/root/device validation.'
