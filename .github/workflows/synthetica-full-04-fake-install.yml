name: Synthetica 04 complete updater simulation and capacity
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths:
      - .github/workflows/synthetica-full-04-fake-install.yml
      - synthetica-project/audit_boot04_full_install.py
      - tests/test_audit_boot04_full_install.py
  workflow_dispatch:
# Only pinned input and disposable regular files. No release or image upload.
permissions:
  contents: write # required to read the existing unpublished draft
  checks: write
concurrency:
  group: synthetica-full-04-fake-install
  cancel-in-progress: false
jobs:
  emulate:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned filesystem reader and verify isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-boot-audit.txt
          command -v unshare
          unshare --user --map-root-user --mount --net --pid --fork true
          for test in test_updater_emulation.py test_guarded_zip64_draft_emulation.py \
            test_audit_spatialflow04_product.py test_audit_boot04_full_install.py; do
            python -m unittest discover -s tests -p "$test" -v
          done
      - name: Reserve space for one read-only archive and disposable target files
        shell: bash
        run: |
          set -euo pipefail
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free < 18500000000 )); then sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; fi
          python -c 'import os,shutil; free=shutil.disk_usage(os.environ["RUNNER_TEMP"]).free; print("Free disposable runner bytes:",free); assert free > 17500000000'
          mkdir "$RUNNER_TEMP/full-04-work"
      - name: Fetch pinned public QEMU and camera tree metadata only
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/RuriOSS/qemu-user-static-x86_64.git "$RUNNER_TEMP/qemu-ref"
          git -C "$RUNNER_TEMP/qemu-ref" checkout --quiet adf37fd001dfa1f20d681b9cf0cedcba82b92bf9 -- qemu-aarch64-static
          test "$(git -C "$RUNNER_TEMP/qemu-ref" rev-parse adf37fd001dfa1f20d681b9cf0cedcba82b92bf9:qemu-aarch64-static)" = df7501e7cff2e43df6fff8342710d28a6967c369
          echo '4f55e2e88dc05dc0f619562d5795b8eb25ed2ad2547504fb4835207a6911c350  '"$RUNNER_TEMP/qemu-ref/qemu-aarch64-static" | sha256sum --check --status
          gh api 'repos/AbdoAhmedElbanaa/android_vendor_xiaomi_leicacamera_miatoll/git/trees/2582e3859181d32372a669f0cdaad151095b8a53?recursive=1' > "$RUNNER_TEMP/leica-tree.json"
      - name: Execute exact 04 updater against disposable regular files
        id: emulate
        shell: bash
        run: |
          set -euo pipefail
          python -u synthetica-project/audit_boot04_full_install.py \
            --work "$RUNNER_TEMP/full-04-work" \
            --qemu "$RUNNER_TEMP/qemu-ref/qemu-aarch64-static" \
            --leica-tree "$RUNNER_TEMP/leica-tree.json" \
            --report "$RUNNER_TEMP/full-04-result.json"
      - name: Record only bounded metadata, including failures
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.emulate.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'full-04-result.json'
          result=json.loads(path.read_text()) if path.is_file() else {'status':'PREPARATION_FAILED_HOLD'}
          result['outcome']=os.environ['RUN_OUTCOME']
          text=json.dumps(result,ensure_ascii=True,separators=(',',':'))
          if len(text)>60000: raise SystemExit('Result exceeds bounded check size')
          ok=(result.get('status')=='HOST_FAKE_TARGETS_VERIFIED_HOLD'
              and result.get('execution',{}).get('all_outputs_match_locked_04') is True
              and result.get('outcome')=='success')
          payload={'name':'Synthetica complete 04 updater host simulation','head_sha':os.environ['GITHUB_SHA'],
                   'status':'completed','conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Disposable files only; boot and recovery remain untested','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(),stdout=subprocess.DEVNULL,check=True)
          PY
