name: Synthetica recovery signature host controls

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-recovery-signature.yml'
      - 'synthetica-project/audit_recovery_signature.py'
      - 'synthetica-project/audit_signed_ota.py'
      - 'synthetica-project/build_ota_metadata_candidate.py'
      - 'synthetica-project/build_guarded_candidate.py'
      - 'synthetica-project/build_boot_candidate.py'
      - 'synthetica-project/audit_boot_first_installer.py'
      - 'synthetica-project/verify_preservation.py'
      - 'synthetica-project/third_party/aosp_ota_metadata/**'
      - 'synthetica-project/requirements-recovery-audit.txt'
      - 'synthetica-project/requirements-ota-metadata.txt'
      - 'tests/test_audit_recovery_signature.py'
      - 'tests/test_audit_signed_ota.py'
      - 'tests/test_build_ota_metadata_candidate.py'
      - 'tests/test_audit_boot_first_installer.py'
      - 'tests/test_aosp_signapk_recovery_interop.py'
      - 'tests/test_aosp_signed_ota_interop.py'
  workflow_dispatch:

# Synthetic archives and ephemeral test keys only: never reads or signs a ROM,
# stores a production key, accesses a device, or claims the reference key is trusted.
permissions:
  contents: read

concurrency:
  group: synthetica-recovery-signature-host-controls
  cancel-in-progress: false

jobs:
  controls:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up host Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install the pinned bounded ASN.1 and protobuf readers
        run: python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-recovery-audit.txt -r synthetica-project/requirements-ota-metadata.txt
      - name: Exercise independent synthetic RSA, EC, ZIP64 and failure controls
        run: |
          set -euo pipefail
          command -v openssl
          python - <<'PY'
          import sys, unittest
          patterns = ('test_audit_recovery_signature.py', 'test_audit_signed_ota.py',
                      'test_build_ota_metadata_candidate.py', 'test_audit_boot_first_installer.py')
          suites = [unittest.defaultTestLoader.discover('tests', pattern=p) for p in patterns]
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(suites))
          if result.testsRun < 55 or result.skipped or not result.wasSuccessful():
              sys.exit('All 55 or more synthetic and regression controls must run without skips')
          PY
      - name: Fetch and verify the pinned public Android 17 host tools
        run: |
          set -euo pipefail
          url='https://ci.android.com/builds/submitted/16644040/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip'
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 900 --max-filesize 734003200 "$url" -o "$RUNNER_TEMP/recovery-otatools.zip"
          echo 'bc85557aa0c59a7d0b48b8175250948d67b2d0f293bd74eb8d5753ba4ad7781f  '"$RUNNER_TEMP/recovery-otatools.zip" | sha256sum -c -
      - name: Extract only SignApk and its required JNI library
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, stat, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          out = root / 'recovery-signapk'
          out.mkdir()
          with zipfile.ZipFile(root / 'recovery-otatools.zip') as z:
              for name in ('framework/signapk.jar', 'lib64/libconscrypt_openjdk_jni.so'):
                  rows = [i for i in z.infolist() if i.filename == name]
                  if len(rows) != 1:
                      raise SystemExit('Pinned otatools does not contain one ' + name)
                  entry = rows[0]
                  if (entry.is_dir() or entry.flag_bits & 1 or stat.S_ISLNK(entry.external_attr >> 16)
                          or not 0 < entry.file_size <= 64 * 1024**2):
                      raise SystemExit('Unexpected or oversized SignApk entry')
                  data = z.read(entry)  # bounded and CRC checked
                  target = out / name
                  target.parent.mkdir(exist_ok=True, parents=True)
                  target.write_bytes(data)
                  print(name, 'bytes', len(data), 'sha256', hashlib.sha256(data).hexdigest())
          PY
      - name: Test genuine AOSP SignApk output on a throwaway package
        env:
          AOSP_SIGNAPK_JAR: ${{ runner.temp }}/recovery-signapk/framework/signapk.jar
          AOSP_SIGNAPK_LIB: ${{ runner.temp }}/recovery-signapk/lib64
        run: |
          set -euo pipefail
          command -v java
          test -s "$AOSP_SIGNAPK_JAR"
          test -s "$AOSP_SIGNAPK_LIB/libconscrypt_openjdk_jni.so"
          python - <<'PY'
          import sys, unittest
          patterns = ('test_aosp_signapk_recovery_interop.py', 'test_aosp_signed_ota_interop.py')
          suites = [unittest.defaultTestLoader.discover('tests', pattern=p) for p in patterns]
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(suites))
          if result.testsRun != 2 or result.skipped or not result.wasSuccessful():
              sys.exit('Both real-SignApk synthetic interop controls must run and pass without skips')
          PY
