name: "Validate Synthetica 4.0 isolated preview on Android emulator"
on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica40-preview-emulator.yml'
      - 'tests/run_pixel40_emulator.py'
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build run containing the isolated 4.0 preview"
        required: true
        type: string
      preview_sha256:
        description: "SHA-256 of the separate preview APK"
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate inputs
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id || '42377314005' }}
          PREVIEW_SHA256: ${{ inputs.preview_sha256 || '72a7b9598716941ed41ac85a453501b493ffacf4122aba20c35675a547dbd5c7' }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PREVIEW_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: synthetica40-preview-${{ inputs.build_run_id || '42377314005' }}
          run-id: ${{ inputs.build_run_id || '42377314005' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/preview40-artifact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require accelerated emulator
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then echo '::error::KVM unavailable: Android runtime checks did not run.'; exit 1; fi
          sudo chmod a+rw /dev/kvm
      - name: Install emulator and API 35 image
        run: |
          set -euo pipefail
          SDK="$HOME/pixel40-emulator-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK" ANDROID_AVD_HOME="$RUNNER_TEMP/pixel40-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' 2>&1 | tail -12
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -f -n pixel40 -k 'system-images;android-35;google_apis;x86_64' -d pixel_2
          test -f "$ANDROID_AVD_HOME/pixel40.ini"
          python3 -m pip install --user --disable-pip-version-check pillow
      - name: Boot emulator and validate preview only
        env:
          PREVIEW_SHA256: ${{ inputs.preview_sha256 || '72a7b9598716941ed41ac85a453501b493ffacf4122aba20c35675a547dbd5c7' }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/preview40-artifact/Synthetica-4.0-Pixel-PREVIEW-NOT-MANAGER.apk"
          printf '%s  %s\n' "$PREVIEW_SHA256" "$APK" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pixel40-test-output"
          emulator -avd pixel40 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/pixel40-test-output/emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 12
          if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/pixel40-test-output/emulator.log"; exit 1; fi
          adb start-server
          timeout 240s adb -s emulator-5554 wait-for-device
          timeout 240s bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done'
          python3 tests/run_pixel40_emulator.py --serial emulator-5554 --apk "$APK" --sha256 "$PREVIEW_SHA256" \
            --output "$RUNNER_TEMP/pixel40-test-output" 2>&1 | tee "$RUNNER_TEMP/pixel40-test-output/test.log"
          echo '::notice title=4.0 preview emulator::UI, simulated actions, source disclosures, and reduced motion checked; real root Manager was not tested.'
      - name: Transfer emulator results as Git blobs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,shutil,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'pixel40-test-output'
          if not root.is_dir(): raise SystemExit(0)
          snapshots=list(root.glob('*.xml'))
          if snapshots: shutil.copy2(max(snapshots,key=lambda p:p.stat().st_mtime_ns),root/'last-ui.xml')
          for name in ('test.log','emulator.log','last-ui.xml','home.png','home.xml','diagnostics.png','control-confirm.png','lsposed-confirm.png','settings-light.png','settings-dark.png','settings-amoled.png','motion-off-1.png','motion-off-2.png','system-motion-off-1.png','system-motion-off-2.png'):
              path=root/name
              if not path.is_file(): continue
              payload=root/(name+'.json')
              payload.write_text(json.dumps({'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'}))
              out=subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--method','POST','--input',str(payload),'--jq','.sha'],capture_output=True,text=True,check=True).stdout.strip()
              print(f'::notice title=Pixel emulator {name} blob::{out}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pixel40-preview-emulator-${{ github.run_id }}
          path: ${{ runner.temp }}/pixel40-test-output/
          retention-days: 7
          if-no-files-found: warn
