name: "Save verified Joyeuse mi-memory test kernel — DO NOT FLASH"
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: ['.github/workflows/joyeuse-save-mi-memory-image.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  save:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: arena/96cbd65a-syntenthica
          fetch-depth: 0
      - name: Recover the exact completed test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 41786395643 --json status,conclusion,headSha \
            --jq 'select(.status == "completed" and .conclusion == "success" and .headSha == "b9be51534a48f33407eba87b26d7cb7bc54ea13c") | .headSha' \
            | grep -Fx 'b9be51534a48f33407eba87b26d7cb7bc54ea13c'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13302990007/zip" > "$RUNNER_TEMP/joyeuse-builtins.zip"
          echo "4fb65986a90026f7063eae721be47281593b5a12ed072e72075847560cf1c98b  $RUNNER_TEMP/joyeuse-builtins.zip" | sha256sum -c -
          mkdir "$RUNNER_TEMP/joyeuse-builtins"
          unzip -q "$RUNNER_TEMP/joyeuse-builtins.zip" -d "$RUNNER_TEMP/joyeuse-builtins"
      - name: Verify image, safeguards and linked built-ins again
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, importlib.util, json, os, re
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          bundle = Path(os.environ['RUNNER_TEMP']) / 'joyeuse-builtins'
          spec = importlib.util.spec_from_file_location('joyeuse_experiment', root / 'synthetica-project/build_joyeuse_builtin_experiment.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.EXPECTED_RELEASE = '4.14.357-openela-Synthetica-2.0-JOYEUSE-MIMEM-EXPERIMENT'
          mod.REQUIRED_SYMBOLS += ('mi_memory_sysfs_init', 'set_ufs_hba_data', 'ufs_get_string_desc', 'memblock_mem_size_in_gb')
          image = bundle / 'DO-NOT-FLASH-JOYEUSE-BUILTIN-Image.gz'
          config = bundle / 'generated.config.txt'
          status = json.loads((bundle / 'STATUS.json').read_text())
          assert status['status'] == 'COMPILED_ONLY_DO_NOT_FLASH'
          assert status['boot_test'] == 'NOT_RUN' and status['security_config_unchanged'] is True
          assert status['embedded_config_matches_generated'] is True
          assert status['mi_memory_backport']['matches_joyeuse_module'] == 'NOT_PROVEN'
          assert status['mi_memory_backport']['unsupported_debug_attributes_omitted'] == ['tag_stats', 'err_state', 'err_reason', 'req_stats']
          assert status['private_module_signing_key_exported'] is False and status['rom_or_boot_image_modified'] is False
          assert image.stat().st_size == status['image_bytes'] and image.stat().st_size > 8 * 1024 * 1024
          assert mod.digest(image) == status['image_sha256']
          assert mod.digest(config) == status['config_sha256']
          mod.check_config(mod.verified_baseline(root / 'artifacts/generated.config.txt'), config.read_text())
          opts = mod.read_config(config.read_text())
          assert opts.get('MI_MEMORY_SYSFS') == 'y' and opts.get('DEBUG_FS', 'n') == 'n'
          names = {line.split()[-1] for line in (bundle / 'System.map.txt').read_text().splitlines() if line.split()}
          assert set(mod.REQUIRED_SYMBOLS).issubset(names)
          with gzip.open(image, 'rb') as f:
              raw = f.read(96 * 1024 * 1024)
          match = re.search(rb'Linux version ([^\s]+)', raw)
          assert match and match.group(1).decode('ascii') == mod.EXPECTED_RELEASE
          mod.verify_embedded_config(raw, config.read_bytes())
          assert not any('signing_key' in p.name or p.suffix == '.zip' for p in bundle.rglob('*'))
          print('Verified experimental Image.gz SHA-256:', status['image_sha256'])
          PY
      - name: Save only the requested kernel and small metadata to the session branch
        run: |
          set -euo pipefail
          dest='artifacts/experimental/joyeuse-mi-memory-ikconfig-fixed-2026-11-04'
          mkdir -p "$dest"
          for file in DO-NOT-FLASH-JOYEUSE-BUILTIN-Image.gz STATUS.json generated.config.txt README-DO-NOT-FLASH.txt; do
            src="$RUNNER_TEMP/joyeuse-builtins/$file"
            if [ -e "$dest/$file" ] && ! cmp -s "$src" "$dest/$file"; then
              echo "Refusing to overwrite a different existing experimental artifact: $file" >&2
              exit 1
            fi
            cp "$src" "$dest/$file"
          done
          (cd "$dest" && sha256sum DO-NOT-FLASH-JOYEUSE-BUILTIN-Image.gz STATUS.json generated.config.txt README-DO-NOT-FLASH.txt > SHA256SUMS.txt)
          git config user.name 'synthetica-ci'
          git config user.email 'ci@users.noreply.github.com'
          git add -f -- "$dest/DO-NOT-FLASH-JOYEUSE-BUILTIN-Image.gz" "$dest/STATUS.json" "$dest/generated.config.txt" "$dest/README-DO-NOT-FLASH.txt" "$dest/SHA256SUMS.txt"
          if git diff --cached --quiet; then
            echo 'The identical image is already saved.'
            exit 0
          fi
          git commit -m 'Save non-flashable Joyeuse mi-memory kernel experiment'
          for attempt in 1 2 3; do
            git fetch origin arena/96cbd65a-syntenthica
            git rebase FETCH_HEAD
            if git push origin HEAD:refs/heads/arena/96cbd65a-syntenthica; then
              exit 0
            fi
          done
          echo 'Could not fast-forward the session branch; no force push attempted.' >&2
          exit 1
