name: "BREAKFAST - Manager APK"
on:
  push:
    branches:
      - arena/96cbd65a-synthentica
    paths:
      - '.github/workflows/breakfast-apk.yml'
      - 'breakfast-app/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: breakfast-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Provide the KernelSU bridge library
        run: |
          set -euo pipefail
          # The UAPI row must come from the kernel, not from a guess, and the only
          # way to ask is libkernelsu.so. It is taken from the pinned donor APK
          # already in the repository rather than downloaded, so the build has no
          # new external input.
          mkdir -p breakfast-app/app/src/main/jniLibs/arm64-v8a
          unzip -o -q build-kit/ci/rollercoaster/manager/base.apk \
            lib/arm64-v8a/libkernelsu.so -d /tmp/ksu-lib
          cp /tmp/ksu-lib/lib/arm64-v8a/libkernelsu.so \
             breakfast-app/app/src/main/jniLibs/arm64-v8a/libkernelsu.so
          # Pin the bytes: a different library would mean a different JNI surface.
          # Digest read from the library itself, not invented: a placeholder here
          # would look like pinning while pinning nothing.
          EXPECTED=f69d947a6f7e8f2f30a7813d278b26e78d5aa94e38f708bf1e66abd9ee1079ef
          ACTUAL=$(sha256sum breakfast-app/app/src/main/jniLibs/arm64-v8a/libkernelsu.so | cut -d' ' -f1)
          echo "libkernelsu.so sha256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED" \
            || { echo "::error::libkernelsu.so digest changed: $ACTUAL"; exit 1; }
          test "$(stat -c%s breakfast-app/app/src/main/jniLibs/arm64-v8a/libkernelsu.so)" -eq 13896 \
            || { echo "::error::libkernelsu.so is not the pinned 13896-byte library"; exit 1; }
          # The symbol this app binds must exist, or the UAPI row would silently
          # fall back to "—" on every device.
          strings breakfast-app/app/src/main/jniLibs/arm64-v8a/libkernelsu.so \
            | grep -q "Java_com_rifsxd_ksunext_Natives_getKernelUAPIVersion" \
            || { echo "::error::getKernelUAPIVersion symbol missing from libkernelsu.so"; exit 1; }
      - name: Host checks without a JVM (formulas, contrast, whitelist, pairing)
        run: |
          set -euo pipefail
          python3 breakfast-app/tools/gen_pairing.py
          git diff --exit-code -- breakfast-app/app/src/main/java/app/breakfast/manager/data/PairingGenerated.kt \
            || { echo "::error::PairingGenerated.kt is stale; run gen_pairing.py and commit"; exit 1; }
          python3 breakfast-app/tools/check_logic.py
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-36" "build-tools;36.1.0" 2>&1 | tail -5
      - name: Unit tests (JVM, no device)
        run: |
          set -euo pipefail
          # Script, not inline shell: this step is the one that silently passed
          # before, so its exit status is worth keeping in a file that can be
          # reviewed later.
          bash breakfast-app/tools/run_gradle_tests.sh
      - name: Build release APK
        env:
          # Optional stable signing. When these four secrets exist, the APK can be
          # installed over a previous build; when they do not, a fresh ephemeral
          # key is generated and the artifact is labelled as CI-only. Creating
          # secrets needs admin rights this workspace does not have, so the
          # fallback is real rather than theoretical.
          # Defaults are empty so `set -u` cannot fail when the secrets are absent,
          # which is the normal case until someone with admin rights adds them.
          KEYSTORE_B64: ${{ secrets.BREAKFAST_KEYSTORE_B64 || '' }}
          KEYSTORE_PASS: ${{ secrets.BREAKFAST_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ secrets.BREAKFAST_KEY_ALIAS || '' }}
          KEY_PASS: ${{ secrets.BREAKFAST_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          # No evidence, no artifact: a green build without recorded tests is
          # what produced an unverified APK earlier in this session.
          test -f ci-stage/breakfast/TESTS-PASSED || { echo "::error::unit test evidence missing"; exit 1; }
          rm -f ci-stage/breakfast/BREAKFAST-manager.apk
          mkdir -p ci-stage/breakfast

          STORE=/tmp/breakfast-signing.jks
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASS:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "signing: stable key from repository secrets"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$STORE"
            KEYPASS="${KEY_PASS:-$KEYSTORE_PASS}"
            echo "stable" > ci-stage/breakfast/SIGNING-MODE.txt
          else
            echo "signing: ephemeral key generated for this run"
            KEYSTORE_PASS="$(openssl rand -hex 16)"
            KEYPASS="$KEYSTORE_PASS"
            KEY_ALIAS=breakfast-ci
            # A throwaway key means no long-lived signing secret exists to leak,
            # and no artifact can be mistaken for an official release. The cost
            # is that installs do not upgrade across runs.
            keytool -genkeypair -v -keystore "$STORE" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYPASS" \
              -dname "CN=BREAKFAST CI, OU=ephemeral, O=none, L=CI, ST=CI, C=ID"
            echo "ephemeral" > ci-stage/breakfast/SIGNING-MODE.txt
          fi

          cd breakfast-app
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PbreakfastVersionCode="${{ github.run_number }}" \
            -PbreakfastVersionName="0.1.0-run${{ github.run_number }}" \
            -PciStoreFile="$STORE" \
            -PciStorePassword="$KEYSTORE_PASS" \
            -PciKeyAlias="$KEY_ALIAS" \
            -PciKeyPassword="$KEYPASS"
          find app/build/outputs/apk/release -name '*.apk' -print
      - name: Verify APK metadata and alignment
        run: |
          set -euo pipefail
          APK=$(find breakfast-app/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          BT="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/aapt" dump badging "$APK" | head -1 | tee ci-stage/breakfast/APK-BADGING.txt
          grep -F "package: name='app.breakfast.manager'" ci-stage/breakfast/APK-BADGING.txt
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libkernelsu.so" \
            || { echo "::error::libkernelsu.so missing from the APK"; exit 1; }
          cp "$APK" ci-stage/breakfast/BREAKFAST-manager.apk
          sha256sum ci-stage/breakfast/BREAKFAST-manager.apk | tee ci-stage/breakfast/APK-SHA256.txt
          # The certificate digest is the fingerprint a user can compare to know
          # whether an update will install over the build they already have.
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" \
            > ci-stage/breakfast/APK-CERT.txt || true
          cat ci-stage/breakfast/APK-CERT.txt 2>/dev/null || true
          ls -l ci-stage/breakfast/
      - name: Save APK and diagnostics to the session branch
        if: always()
        run: |
          set -euo pipefail
          [ -d ci-stage/breakfast ] || exit 0
          git config user.name 'breakfast-ci'
          git config user.email 'ci@users.noreply.github.com'
          # Unlike the 2.1 build, this APK is deliberately KEPT in git so it can
          # be pulled into the workspace and handed to the user. It is a CI-signed
          # artifact with an ephemeral key, and the repository already carries
          # binary artifacts under the same convention.
          git add -A -f ci-stage/breakfast/
          git diff --cached --quiet && exit 0
          git commit -qm "ci: BREAKFAST manager APK (run ${GITHUB_RUN_ID})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
