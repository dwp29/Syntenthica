name: Synthetica Google APEX signature checks
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-gms-apex-signatures.yml, synthetica-project/audit_gms_apex_signatures.py, tests/test_audit_gms_apex_signatures.py]
  workflow_dispatch:
# Read-only host checks on a private copy; no device or release is changed.
permissions:
  contents: write # read private draft 03
  checks: write
jobs:
  audit:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned filesystem reader
        run: python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-boot-audit.txt
      - name: Run host signature controls
        run: |
          python -m unittest discover -s tests -p 'test_audit_gms_apex_signatures.py' -v
          python -m unittest discover -s tests -p 'test_audit_apex_avb_verify.py' -v
      - name: Select Android verifier and reserve temporary space
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools=$(find "$root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$tools/apksigner"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free < 15000000000 )); then sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; fi
          python -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free > 14000000000'
          mkdir "$RUNNER_TEMP/gms-signatures"
      - name: Fetch pinned Android host verifiers
        shell: bash
        run: |
          set -euo pipefail
          url='https://ci.android.com/builds/submitted/16644040/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip'
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 900 --max-filesize 734003200 "$url" -o "$RUNNER_TEMP/aosp-otatools.zip"
          echo 'bc85557aa0c59a7d0b48b8175250948d67b2d0f293bd74eb8d5753ba4ad7781f  '"$RUNNER_TEMP/aosp-otatools.zip" | sha256sum -c -
          gh api 'repos/aosp-mirror-neo/platform_external_avb/contents/avbtool.py?ref=761178607206f4cb2af79ed9eec52d8cbd814adb' --jq .content | base64 -d > "$RUNNER_TEMP/avbtool.py"
          echo 'e5a664a38db623da00f080219bc0ee60a640a9dc4a872803616fae4938ac749b  '"$RUNNER_TEMP/avbtool.py" | sha256sum -c -
      - name: Check signatures after synthetic controls
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          tools='${{ steps.setup.outputs.tools }}'
          python -u synthetica-project/audit_gms_apex_signatures.py --work "$RUNNER_TEMP/gms-signatures" \
            --report "$RUNNER_TEMP/gms-signatures-result.json" --otatools "$RUNNER_TEMP/aosp-otatools.zip" \
            --avbtool "$RUNNER_TEMP/avbtool.py" --apksigner "$tools/apksigner"
      - name: Record bounded checks including failures
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'gms-signatures-result.json'
          result=json.loads(path.read_text()) if path.is_file() else {'status':'PREPARATION_FAILED_HOLD'}
          result['outcome']=os.environ['AUDIT_OUTCOME']
          text=json.dumps(result,ensure_ascii=True,separators=(',',':'))
          if len(text)>30000: raise SystemExit('Signature audit exceeds bounded check size')
          ok=result.get('both_host_checks_passed') is True and result['outcome']=='success'
          payload={'name':'Synthetica Google APEX signature checks','head_sha':os.environ['GITHUB_SHA'],'status':'completed',
                   'conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Self-consistency only; device trust not assessed','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(),stdout=subprocess.DEVNULL,check=True)
          PY
