name: Compare Neutron MGLRU evidence (temporary)
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/exp-metadata.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Synthetica-2.0-neutron-MGLRU-on-DO-NOT-FLASH-42258512643
          path: ${{ runner.temp }}/on
          run-id: 42258512643
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Synthetica-2.0-neutron-MGLRU-off-DO-NOT-FLASH-42258512643
          path: ${{ runner.temp }}/off
          run-id: 42258512643
          github-token: ${{ github.token }}
      - name: Verify downloaded candidates and compare their public metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']); t=Path(os.environ['RUNNER_TEMP'])
          sys.path.insert(0,str(root/'build-kit/scripts'))
          import audit_synthetica2_rom_modules as audit
          import build_synthetica2_experimental as s2x
          statuses={}; targets={}; configs={}
          for mode in ('on','off'):
              directory=t/mode
              statuses[mode]=json.loads((directory/'STATUS.json').read_text())
              targets[mode]=audit.load_candidate(directory,root/'artifacts/generated.config.txt')
              configs[mode]=(directory/'generated.config.txt').read_text()
          difference=s2x.compare_mglru_configs(s2x.v3.verified_baseline(root/'artifacts/generated.config.txt'),configs['on'],configs['off'])
          a,b=(statuses[x] for x in ('on','off'))
          identity=('kind','clang_sha256','lld_sha256','neutron_archive_sha256')
          same_compiler=all(a['compiler'][k]==b['compiler'][k] for k in identity)
          if not same_compiler: raise ValueError('the on/off toolchains differ')
          result={'kind':'STATIC_COMPARISON_ONLY_NOT_A_DEVICE_TEST', 'config_difference':difference,
                  'same_compiler_executables':same_compiler,
                  'on_image_sha256':a['image_sha256'],'off_image_sha256':b['image_sha256'],
                  'on_config_sha256':a['config_sha256'],'off_config_sha256':b['config_sha256'],
                  'on_layout_crc':a['module_layout_crc'],'off_layout_crc':b['module_layout_crc'],
                  'on_public_cert_sha256':a['module_public_cert_sha256'],'off_public_cert_sha256':b['module_public_cert_sha256'],
                  'same_build_public_certificate':a['module_public_cert_sha256']==b['module_public_cert_sha256'],
                  'scope':'Build evidence only; ROM compatibility, active keyring, boot and runtime are not proven.'}
          print('::notice title=Neutron on-off static evidence::'+json.dumps(result).replace('%','%25').replace('\n','%0A'))
          PY
