name: Synthetica official EROFS host tool probe

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-erofs-tool-probe.yml'
  workflow_dispatch:

# No ROM or device input: verify an official otatools archive, inspect its
# EROFS utilities, and run only tiny self-created positive/negative fixtures.
# The build statement signature was not verified. No binaries are uploaded.
permissions:
  contents: read
  checks: write

jobs:
  probe:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Fetch and identify pinned public host tools
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/erofs-fetch.log") 2>&1
          archive="$RUNNER_TEMP/aosp-otatools.zip"
          url='https://ci.android.com/builds/submitted/16644040/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip'
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 900 --max-filesize 734003200 "$url" -o "$archive"
          echo 'bc85557aa0c59a7d0b48b8175250948d67b2d0f293bd74eb8d5753ba4ad7781f  '"$archive" | sha256sum -c -
          python3 - <<'PY'
          import hashlib, os, shutil, stat, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          archive = root / 'aosp-otatools.zip'
          if archive.stat().st_size != 531408471:
              raise SystemExit('Unexpected archive size')
          output = root / 'erofs-tool-probe'
          output.mkdir()
          with zipfile.ZipFile(archive) as z:
              for name in ('bin/fsck.erofs', 'bin/mkfs.erofs'):
                  rows = [x for x in z.infolist() if x.filename == name]
                  if len(rows) != 1:
                      raise SystemExit(f'Expected one {name}; found {len(rows)}')
                  item = rows[0]
                  if item.is_dir() or item.flag_bits & 1 or not 0 < item.file_size <= 64 * 1024**2 or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('Unsafe tool archive entry')
                  destination = output / Path(name).name
                  with z.open(item) as src, destination.open('xb') as out:
                      shutil.copyfileobj(src, out, 1024 * 1024)
                  destination.chmod(0o555)
                  print(name, 'bytes=', item.file_size, 'sha256=', hashlib.sha256(destination.read_bytes()).hexdigest())
          PY
          file "$RUNNER_TEMP/erofs-tool-probe/fsck.erofs" "$RUNNER_TEMP/erofs-tool-probe/mkfs.erofs"
          readelf -d "$RUNNER_TEMP/erofs-tool-probe/fsck.erofs" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          readelf -d "$RUNNER_TEMP/erofs-tool-probe/mkfs.erofs" | grep -E 'NEEDED|RPATH|RUNPATH' || true

      - name: Test only synthetic EROFS fixtures without network
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/erofs-synthetic.log") 2>&1
          root="$RUNNER_TEMP/erofs-tool-probe"
          mkdir -p "$root/tree/bin" "$root/unpacked"
          printf 'synthetic-linker-32-do-not-execute\n' > "$root/tree/bin/linker"
          printf 'synthetic-linker-64-do-not-execute\n' > "$root/tree/bin/linker64"
          # These are host utilities and synthetic bytes, not ROM or phone code.
          timeout 20 env -i PATH=/usr/bin:/bin /usr/bin/unshare --user --map-root-user --net --pid --fork "$root/mkfs.erofs" -V
          timeout 20 env -i PATH=/usr/bin:/bin /usr/bin/unshare --user --map-root-user --net --pid --fork "$root/fsck.erofs" -V
          timeout 30 env -i PATH=/usr/bin:/bin /usr/bin/unshare --user --map-root-user --net --pid --fork \
            "$root/mkfs.erofs" "$root/synthetic.erofs" "$root/tree"
          timeout 30 env -i PATH=/usr/bin:/bin /usr/bin/unshare --user --map-root-user --net --pid --fork \
            "$root/fsck.erofs" --extract="$root/unpacked" "$root/synthetic.erofs"
          cmp "$root/tree/bin/linker" "$root/unpacked/bin/linker"
          cmp "$root/tree/bin/linker64" "$root/unpacked/bin/linker64"
          printf 'not an EROFS image' > "$root/invalid.erofs"
          if timeout 30 env -i PATH=/usr/bin:/bin /usr/bin/unshare --user --map-root-user --net --pid --fork \
              "$root/fsck.erofs" "$root/invalid.erofs"; then
            echo 'ERROR: invalid synthetic image unexpectedly accepted'
            exit 1
          fi
          echo 'Synthetic extraction matched both files; malformed synthetic image rejected.'

      - name: Preserve bounded synthetic probe metadata
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          logs = []
          for name in ('erofs-fetch.log', 'erofs-synthetic.log'):
              p = root / name
              logs.append(f'{name}:\n' + (p.read_text(errors='replace')[:12000] if p.exists() else '(not started)'))
          ok = os.environ['FETCH_OUTCOME'] == os.environ['PROBE_OUTCOME'] == 'success'
          body = {'name': 'Synthetica EROFS synthetic tool probe metadata', 'head_sha': os.environ['GITHUB_SHA'],
                  'status': 'completed', 'conclusion': 'success' if ok else 'neutral',
                  'output': {'title': 'Official host EROFS tool; synthetic data only',
                             'summary': 'No ROM, images or device; build statement signature not verified.\n\n' + '\n\n'.join(logs)}}
          subprocess.run(['gh', 'api', '--method', 'POST', 'repos/dwp29/Syntenthica/check-runs', '--input', '-'],
                         input=json.dumps(body).encode(), stdout=subprocess.DEVNULL, check=True)
          PY
