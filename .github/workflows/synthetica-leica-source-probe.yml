name: Synthetica Leica miatoll source probe
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-leica-source-probe.yml, synthetica-project/probe_leica_miatoll.py, tests/test_probe_leica_miatoll.py, synthetica-project/apk_signer_output.py, tests/test_apk_signer_output.py]
  workflow_dispatch:
# Only inspects pinned public blobs on a throwaway runner; nothing is installed or published.
permissions:
  contents: read
  checks: write
jobs:
  probe:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run source identity and manifest controls
        run: |
          python -m unittest discover -s tests -p 'test_apk_signer_output.py' -v
          python -m unittest discover -s tests -p 'test_probe_leica_miatoll.py' -v
      - name: Select Android host readers
        id: setup
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools=$(find "$root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$tools/aapt" && test -x "$tools/aapt2" && test -x "$tools/apksigner"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/leica-probe"
      - name: Read pinned split APK without installing it
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          tools='${{ steps.setup.outputs.tools }}'
          python -u synthetica-project/probe_leica_miatoll.py --work "$RUNNER_TEMP/leica-probe" \
            --report "$RUNNER_TEMP/leica-probe-result.json" --aapt "$tools/aapt" --aapt2 "$tools/aapt2" \
            --apksigner "$tools/apksigner"
      - name: Record bounded inspection including failures
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'leica-probe-result.json'
          result=json.loads(path.read_text()) if path.is_file() else {'status':'PREPARATION_FAILED_HOLD'}
          result['outcome']=os.environ['PROBE_OUTCOME']
          text=json.dumps(result,ensure_ascii=True,separators=(',',':'))
          if len(text)>30000: raise SystemExit('Leica metadata exceeds the bounded check size')
          ok=result.get('status')=='READ_ONLY_PREBUILT_INSPECTED_HOLD' and result['outcome']=='success'
          payload={'name':'Synthetica Leica miatoll source probe','head_sha':os.environ['GITHUB_SHA'],'status':'completed',
                   'conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Host-only APK inspection; no device verdict','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(),stdout=subprocess.DEVNULL,check=True)
          PY
