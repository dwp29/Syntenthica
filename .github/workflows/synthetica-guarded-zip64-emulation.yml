name: Synthetica guarded draft ZIP64 read-only emulation

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-guarded-zip64-emulation.yml'
  workflow_dispatch:

# Draft assets require an authenticated token with access to unpublished
# releases. The test never edits, uploads, publishes, or deletes a release.
permissions:
  contents: write
  checks: write

concurrency:
  group: synthetica-guarded-zip64-readonly-emulation
  cancel-in-progress: false

jobs:
  guarded-zip64-emulation:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact host test code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check the sandbox prerequisites and synthetic regression tests
        shell: bash
        run: |
          set -euo pipefail
          command -v unshare
          test -x /usr/bin/mount
          unshare --user --map-root-user --mount --net --pid --fork true
          python3 -m unittest discover -s tests -p 'test_updater_emulation.py' -v
          python3 -m unittest discover -s tests -p 'test_guarded_zip64_draft_emulation.py' -v
          python3 -m unittest discover -s tests -p 'test_github_guarded_report_relay.py' -v

      - name: Fetch the pinned QEMU binary into temporary runner storage
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/RuriOSS/qemu-user-static-x86_64.git "$RUNNER_TEMP/synthetica-qemu"
          git -C "$RUNNER_TEMP/synthetica-qemu" checkout --quiet \
            adf37fd001dfa1f20d681b9cf0cedcba82b92bf9 -- qemu-aarch64-static
          test "$(git -C "$RUNNER_TEMP/synthetica-qemu" rev-parse \
            adf37fd001dfa1f20d681b9cf0cedcba82b92bf9:qemu-aarch64-static)" = \
            'df7501e7cff2e43df6fff8342710d28a6967c369'
          echo '4f55e2e88dc05dc0f619562d5795b8eb25ed2ad2547504fb4835207a6911c350  '"$RUNNER_TEMP/synthetica-qemu/qemu-aarch64-static" | sha256sum --check --status

      - name: Read-only reassemble and emulate the exact guarded candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/synthetica-guarded-zip64"
          python3 -u synthetica-project/audit_guarded_zip64_draft.py \
            --work "$RUNNER_TEMP/synthetica-guarded-zip64" \
            --qemu "$RUNNER_TEMP/synthetica-qemu/qemu-aarch64-static" \
            --report "$RUNNER_TEMP/synthetica-guarded-zip64-result.json"

      - name: Publish only the small host-test report as a GitHub check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_PATH: ${{ runner.temp }}/synthetica-guarded-zip64-result.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          with open(os.environ['RESULT_PATH'], encoding='utf-8') as stream:
              result = json.load(stream)
          if result.get('status') != 'all_scenarios_passed' or result.get('scenario_count') != 7:
              raise SystemExit('The actual guarded ZIP emulation report is incomplete')
          summary = 'Only a disposable host sandbox was tested; no recovery or phone was used.\n\n```json\n' + json.dumps(result, indent=2) + '\n```'
          if len(summary.encode()) > 60000:
              raise SystemExit('Refusing an oversized check summary')
          payload = {'name': 'Synthetica actual guarded ZIP64 host emulation report',
                     'head_sha': os.environ['GITHUB_SHA'], 'status': 'completed', 'conclusion': 'success',
                     'output': {'title': 'Read-only guarded ZIP host emulation', 'summary': summary}}
          subprocess.run(['gh', 'api', '--method', 'POST',
                          'repos/dwp29/Syntenthica/check-runs', '--input', '-'],
                         input=json.dumps(payload).encode(), check=True, stdout=subprocess.DEVNULL)
          print('Small non-sensitive host-test report stored in the GitHub check.')
          PY
