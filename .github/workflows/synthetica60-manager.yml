name: "Synthetica Manager 6.0.0 — standalone universal-kernel build"

on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths:
      - '.github/workflows/synthetica60-manager.yml'
      - 'synthetica-manager/**'
      - 'build-kit/scripts/build_manager_60_standalone.py'
      - 'build-kit/scripts/sign_manager_60_locally.py'
      - 'tests/test_synthetica60_*.py'
      - 'tests/verify_synthetica60_apk.py'
  workflow_dispatch:
  # Lets the thin dispatcher that lives on the default branch start this exact
  # job. GitHub only shows "Run workflow" when the file exists on main, and main
  # holds nothing but a README, so main calls this workflow by branch ref.
  workflow_call:

permissions:
  contents: write # unsigned APK, evidence logs and test output as unreferenced blobs only

jobs:
  manager:
    name: "Unsigned Manager 6.0.0 — standalone tree, pinned UAPI-4 daemon"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # When called from the default-branch dispatcher, github.ref is main;
          # the sources live on the working branch, so it is named explicitly.
          ref: arena/96cbd65a-synthentica
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Host guards for the standalone tree and universal helpers
        run: | 
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manager60-output"
          python3 -m unittest tests.test_synthetica60_standalone tests.test_synthetica60_signing -v \
            > "$RUNNER_TEMP/manager60-output/host-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/manager60-output/host-tests.log"; exit 1;
            }
          tail -n 6 "$RUNNER_TEMP/manager60-output/host-tests.log"
          python3 build-kit/scripts/build_manager_60_standalone.py --verify-only
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk60"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865' 'cmake;3.22.1' 2>&1 | tail -10
      - name: Compile unsigned Manager 6.0.0 from the standalone tree
        run: |
          set -euo pipefail
          python3 build-kit/scripts/build_manager_60_standalone.py \
            --workdir "$RUNNER_TEMP/manager60-source" \
            --output "$RUNNER_TEMP/manager60-output/Manager-6.0.0-UNSIGNED.apk" \
            2>&1 | tee "$RUNNER_TEMP/manager60-output/build.log"
      - name: Verify identity, permissions, daemon, alignment and unsigned status
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/manager60-output/Manager-6.0.0-UNSIGNED.apk"
          OUT="$RUNNER_TEMP/manager60-output"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/zipalign" -c -P 16 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" > "$OUT/badging.txt"
          grep -F "name='net.ember.labs'" "$OUT/badging.txt"
          grep -F "versionCode='70000'" "$OUT/badging.txt"
          grep -F "versionName='6.0.0'" "$OUT/badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$OUT/badging.txt"
          "$TOOLS/aapt" dump permissions "$APK" | grep '^uses-permission' | sort > "$RUNNER_TEMP/manager60-permissions.txt" || true
          "$TOOLS/aapt" dump permissions release/Synthetica-2.0.apk | grep '^uses-permission' | sort > "$RUNNER_TEMP/reference-permissions.txt" || true
          test -s "$RUNNER_TEMP/manager60-permissions.txt" && test -s "$RUNNER_TEMP/reference-permissions.txt"
          diff -u "$RUNNER_TEMP/reference-permissions.txt" "$RUNNER_TEMP/manager60-permissions.txt"
          python3 tests/verify_synthetica60_apk.py "$APK" | tee "$OUT/static-checks.txt"
          if "$TOOLS/apksigner" verify "$APK" > "$OUT/signature-check.txt" 2>&1; then
            echo '::error::Expected an unsigned build'; exit 1
          fi
          grep -q 'DOES NOT VERIFY' "$OUT/signature-check.txt"
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$sha" > "$OUT/SHA256.txt"
          echo "::notice title=Unsigned Manager 6.0.0 SHA256::$sha"
      - name: Transfer unsigned Manager as Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP'])
          apk=t/'manager60-output/Manager-6.0.0-UNSIGNED.apk'
          (t/'manager60-blob.json').write_text(json.dumps({'content':base64.b64encode(apk.read_bytes()).decode(),'encoding':'base64'}))
          PY
          blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/manager60-blob.json" --jq .sha)
          echo "::notice title=Unsigned Manager 6.0.0 blob::$blob"
      - name: Transfer diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for log in "$RUNNER_TEMP/manager60-output/build.log" "$RUNNER_TEMP/manager60-output/host-tests.log"; do
            if [ -s "$log" ]; then
              LOG="$log" python3 - <<'PY'
          import base64,json,os,pathlib
          p=pathlib.Path(os.environ['LOG']); t=pathlib.Path(os.environ['RUNNER_TEMP'])
          (t/'manager60-log.json').write_text(json.dumps({'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'}))
          PY
              blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/manager60-log.json" --jq .sha)
              echo "::notice title=Manager 6.0.0 $(basename "$log") blob::$blob"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetica60-manager-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/manager60-output/
          retention-days: 14
          if-no-files-found: warn

# rebuild after aapt fix
