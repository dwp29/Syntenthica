name: Synthetica guarded draft independent verification

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-guarded-report-verification.yml'
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric ID of the separate guarded-candidate draft
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: synthetica-guarded-report-verification
  cancel-in-progress: false

jobs:
  independent-verification:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - name: Check out the exact verification code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Python for independent host verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.2'

      - name: Test independent verifier on synthetic files
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_github_guarded_report_relay.py' -v
          python -m unittest discover -s tests -p 'test_github_guarded_release.py' -v

      - name: Resolve the separate unpublished draft
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_ID" ]]; then
            id="$RELEASE_ID"
          else
            id=$(gh api 'repos/dwp29/Syntenthica/releases?per_page=100' --jq \
              '[.[] | select(.draft == true and .tag_name == "synthetica-boot-first-20261102-02-installer-guard-draft") | .id] | if length == 1 then .[0] else error("Expected exactly one new draft") end')
          fi
          [[ "$id" =~ ^[1-9][0-9]*$ ]]
          echo "RELEASE_ID=$id" >> "$GITHUB_ENV"

      - name: Redownload and verify all five draft assets and the reassembled ZIP hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/synthetica-independent-verification"
          python synthetica-project/github_guarded_report_relay.py \
            --release-id "$RELEASE_ID" --work "$RUNNER_TEMP/synthetica-independent-verification"
