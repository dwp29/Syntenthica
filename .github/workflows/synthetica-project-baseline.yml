name: "Synthetica-Project — original ROM read-only baseline"

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    # Only an explicit change to this workflow starts a large download.
    paths:
      - '.github/workflows/synthetica-project-baseline.yml'

permissions:
  contents: read

concurrency:
  group: synthetica-project-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: "Read-only original ZIP and component identity"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out this exact commit without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run host-only tests on synthetic ZIPs
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_hyperos4_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_hyperos4_lp_metadata.py' -v
          python3 -m unittest discover -s tests -p 'test_rom_preservation.py' -v

      - name: Download published original to ephemeral runner storage only
        id: download
        run: |
          set -euo pipefail
          # The URL is public. The file is neither committed nor uploaded as an artifact.
          # Subsequent inspection stops unless the pinned byte count and SHA-256 match.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --retry-delay 5 --connect-timeout 30 --max-time 3000 \
            --max-filesize 4512854711 \
            --output "$RUNNER_TEMP/synthetica-base.zip" \
            'https://pixeldrain.com/api/file/DKkWRTMZ?download'

      - name: Verify identity and stream only the three core members
        id: audit
        run: |
          set -euo pipefail
          python3 research/hyperos4/verify_archive.py --inspect-core \
            "$RUNNER_TEMP/synthetica-base.zip" > "$RUNNER_TEMP/baseline-audit.json"

      - name: Verify preservation guard against the stock ZIP
        id: preservation
        run: |
          set -euo pipefail
          # Exact stock identity is a test fixture, not a newly built ROM.
          python3 synthetica-project/verify_preservation.py \
            "$RUNNER_TEMP/synthetica-base.zip" > "$RUNNER_TEMP/preservation-audit.json"

      - name: Fingerprint fixed-size portions of the public reference ZIP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          # Only public reference ZIP bytes are read; no Drive files or credentials.
          path = Path(os.environ['RUNNER_TEMP']) / 'synthetica-base.zip'
          part_size = 104857600
          partial_43_bytes = 86760763
          parts = []
          prefix_43 = None
          with path.open('rb') as stream:
              while True:
                  digest = hashlib.sha256()
                  prefix_digest = hashlib.sha256()
                  prefix_count = 0
                  part_count = 0
                  while part_count < part_size:
                      block = stream.read(min(4 * 1024 * 1024, part_size - part_count))
                      if not block:
                          break
                      digest.update(block)
                      if len(parts) == 42 and prefix_count < partial_43_bytes:
                          fragment = block[:partial_43_bytes - prefix_count]
                          prefix_digest.update(fragment)
                          prefix_count += len(fragment)
                      part_count += len(block)
                  if not part_count:
                      break
                  parts.append({'number': len(parts) + 1, 'bytes': part_count, 'sha256': digest.hexdigest()})
                  if len(parts) == 43:
                      prefix_43 = {'bytes': prefix_count, 'sha256': prefix_digest.hexdigest()}
          summary = {'source': 'verified_public_zip', 'part_size': part_size, 'parts': parts,
                     'part_43_prefix': prefix_43}
          out = Path(os.environ['RUNNER_TEMP']) / 'reference-part-hashes.json'
          out.write_text(json.dumps(summary, indent=2) + '\n')
          # GitHub truncates oversized annotations, so publish short, parseable batches.
          for offset in range(0, len(parts), 8):
              batch = parts[offset:offset + 8]
              text = json.dumps(batch, separators=(',', ':'))
              escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              title = f'Public reference parts {batch[0]["number"]}-{batch[-1]["number"]}'
              print(f'::notice file=.github/workflows/synthetica-project-baseline.yml,line=1,title={title}::{escaped}')
          text = json.dumps(prefix_43, separators=(',', ':'))
          print('::notice file=.github/workflows/synthetica-project-baseline.yml,line=1,title=Public reference part 43 prefix::' + text)
          PY

      - name: Publish compact diagnostics, never image bytes
        if: always()
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PRESERVATION_OUTCOME: ${{ steps.preservation.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'baseline-audit.json'
          summary = {'download': os.environ['DOWNLOAD_OUTCOME'], 'audit': os.environ['AUDIT_OUTCOME'],
                     'preservation': os.environ['PRESERVATION_OUTCOME']}
          guard = Path(os.environ['RUNNER_TEMP']) / 'preservation-audit.json'
          if guard.is_file():
              try:
                  checked = json.loads(guard.read_text())
                  summary['preservation_status'] = checked.get('status')
                  summary['preservation_checked_files'] = len(checked.get('entries') or [])
                  summary['preservation_mismatch_count'] = len(checked.get('mismatches') or [])
              except (ValueError, OSError) as exc:
                  summary['preservation_report_error'] = str(exc)[:200]
          if path.is_file():
              try:
                  data = json.loads(path.read_text())
                  summary.update({
                      'status': data.get('status'),
                      'zip_bytes': data.get('observed', {}).get('bytes'),
                      'zip_sha256': data.get('observed', {}).get('sha256'),
                      'directory_findings': (data.get('archive') or {}).get('finding_count'),
                      'error': data.get('error'),
                  })
                  core = data.get('core_members') or {}
                  summary['reference_matches'] = core.get('matches_reference')
                  summary['super'] = core.get('members', {}).get('super.img')
                  summary['super_prefix'] = core.get('super_prefix')
              except (ValueError, OSError) as exc:
                  summary['report_error'] = str(exc)[:200]
          text = json.dumps(summary, ensure_ascii=True, separators=(',', ':'))
          # Workflow command escaping; diagnostic only, not a proof of bootability.
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice file=research/hyperos4/verify_archive.py,line=1,title=Baseline identity::' + escaped)
          print('Baseline audit (no image bytes): ' + text)
          PY

      - name: Retain only the small diagnostic manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetica-project-baseline-audit
          path: |
            ${{ runner.temp }}/baseline-audit.json
            ${{ runner.temp }}/preservation-audit.json
            ${{ runner.temp }}/reference-part-hashes.json
          if-no-files-found: ignore
          retention-days: 3
