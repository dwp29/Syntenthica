name: Synthetica Google APEX audit
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-gmssystem-apex-audit.yml, synthetica-project/audit_gmssystem_apex.py, synthetica-project/audit_gms_erofs.py, tests/test_audit_gmssystem_apex.py, tests/test_audit_gms_erofs.py]
  workflow_dispatch:
# Reads verified draft 03; no packages or ROM images are uploaded or altered.
permissions:
  contents: write # required to read the existing private draft
  checks: write
jobs:
  inventory:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned ext4 reader
        run: python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-boot-audit.txt
      - name: Run package scan controls
        run: |
          python -m unittest discover -s tests -p 'test_scan_apk_packages.py' -v
          python -m unittest discover -s tests -p 'test_audit_gmssystem_apex.py' -v
          python -m unittest discover -s tests -p 'test_audit_gms_erofs.py' -v
      - name: Select readers and reserve disposable space
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools=$(find "$root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$tools/aapt" && test -x "$tools/aapt2"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free < 15000000000 )); then sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; fi
          python -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free > 14000000000'
          mkdir "$RUNNER_TEMP/base-packages"
      - name: Fetch pinned public Android host tools for isolated EROFS
        shell: bash
        run: |
          set -euo pipefail
          url='https://ci.android.com/builds/submitted/16644040/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip'
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 900 --max-filesize 734003200 "$url" -o "$RUNNER_TEMP/aosp-otatools.zip"
          echo 'bc85557aa0c59a7d0b48b8175250948d67b2d0f293bd74eb8d5753ba4ad7781f  '"$RUNNER_TEMP/aosp-otatools.zip" | sha256sum -c -
      - name: Inspect Google APEX payload without mounting
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          tools='${{ steps.setup.outputs.tools }}'
          python -u synthetica-project/audit_gmssystem_apex.py --work "$RUNNER_TEMP/base-packages" \
            --report "$RUNNER_TEMP/base-packages-result.json" --aapt "$tools/aapt" --aapt2 "$tools/aapt2" \
            --otatools "$RUNNER_TEMP/aosp-otatools.zip"
      - name: Record bounded inventory including failures
        if: always()
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
        run: |
          python - <<'PY2'
          import json, os, subprocess
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'base-packages-result.json'
          result=json.loads(path.read_text()) if path.is_file() else {'status':'PREPARATION_FAILED_HOLD'}
          result['outcome']=os.environ['INVENTORY_OUTCOME']
          text=json.dumps(result,ensure_ascii=True,separators=(',',':'))
          if len(text)>40000: raise SystemExit('Inventory report exceeds check limit')
          ok=result.get('status')=='READ_ONLY_APEX_CONTENTS_INSPECTED_HOLD' and result['outcome']=='success'
          payload={'name':'Synthetica Google APEX audit','head_sha':os.environ['GITHUB_SHA'],'status':'completed',
                   'conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Read-only APEX contents; no activation verdict','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(),stdout=subprocess.DEVNULL,check=True)
          PY2
