name: Synthetica boot-first 03 OTA metadata repair

on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica-ota-metadata-candidate.yml'
  workflow_dispatch:

# Work only on a disposable hosted runner and an explicit separate 03 draft.
# Drafts 01/02 and their assets are immutable, no flash or device is involved.
# This is an unsigned packaging-only candidate; VINTF/AVB/boot remain HOLD.
permissions:
  contents: write
  checks: write

concurrency:
  group: synthetica-boot-first-03-ota-metadata
  cancel-in-progress: false

jobs:
  build-03:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact approved branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up host Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install the pinned AOSP protobuf runtime
        run: python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-ota-metadata.txt
      - name: Run metadata, ZIP64, preservation and transfer regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in test_build_ota_metadata_candidate.py test_github_ota_metadata_release.py \
            test_build_guarded_candidate.py test_github_guarded_release.py \
            test_github_guarded_report_relay.py test_audit_boot_first_installer.py \
            test_audit_package_integrity.py test_rom_preservation.py; do
            python -m unittest discover -s tests -p "$test" -v
          done
      - name: Prepare disposable runner disk space
        shell: bash
        run: |
          set -euo pipefail
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free < 13500000000 )); then
            echo 'Removing optional SDKs from this disposable runner only.'
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          fi
          python - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          print('Available runner disk bytes:', free)
          if free < 13_500_000_000:
              raise SystemExit('Insufficient space for separate input, output and temporary chunk')
          PY
          mkdir "$RUNNER_TEMP/ota03-source-parts" "$RUNNER_TEMP/ota03-transfer"
      - name: Reconstruct the locked candidate 02 without altering its draft
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          python -u synthetica-project/github_ota_metadata_release.py fetch-source \
            --destination "$RUNNER_TEMP/synthetica-boot-first-20261102-02-installer-guard.zip" \
            --work "$RUNNER_TEMP/ota03-source-parts" 2>&1 | tee "$RUNNER_TEMP/ota03-fetch.log"
      - name: Build and independently verify the distinct 03 archive
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python -u synthetica-project/build_ota_metadata_candidate.py \
            "$RUNNER_TEMP/synthetica-boot-first-20261102-02-installer-guard.zip" \
            "$RUNNER_TEMP/synthetica-boot-first-20261102-03-ota-metadata.zip" \
            --report "$RUNNER_TEMP/BUILD-REPORT-BOOT-FIRST-03.json" 2>&1 | tee "$RUNNER_TEMP/ota03-build.log"
          unzip -t "$RUNNER_TEMP/synthetica-boot-first-20261102-03-ota-metadata.zip" \
            | tee "$RUNNER_TEMP/ota03-unzip.log"
      - name: Upload only to the separate draft and independently redownload its three parts
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          python -u synthetica-project/github_ota_metadata_release.py upload \
            --source "$RUNNER_TEMP/synthetica-boot-first-20261102-02-installer-guard.zip" \
            --candidate "$RUNNER_TEMP/synthetica-boot-first-20261102-03-ota-metadata.zip" \
            --report "$RUNNER_TEMP/BUILD-REPORT-BOOT-FIRST-03.json" \
            --unzip-log "$RUNNER_TEMP/ota03-unzip.log" \
            --work "$RUNNER_TEMP/ota03-transfer" \
            --result "$RUNNER_TEMP/ota03-manifest.json" 2>&1 | tee "$RUNNER_TEMP/ota03-upload.log"
      - name: Record bounded build outcome and verified hashes
        if: always()
        shell: bash
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          outcomes = {name: os.environ.get(name + '_OUTCOME', '') for name in ('FETCH', 'BUILD', 'UPLOAD')}
          report = root / 'BUILD-REPORT-BOOT-FIRST-03.json'
          manifest = root / 'ota03-manifest.json'
          ok = all(value == 'success' for value in outcomes.values()) and report.is_file() and manifest.is_file()
          if ok:
              build = json.loads(report.read_text())
              upload = json.loads(manifest.read_text())
              summary = {
                  'status': 'HOLD_NOT_FLASH_APPROVED', 'outcomes': outcomes,
                  'source': build['source'], 'output': build['output'],
                  'changed_members': build['changed_members'],
                  'metadata': build['ota_metadata_verification'],
                  'unchanged_members': build['output_members'],
                  'source_all_member_hashes_and_crc_verified': build['source_all_member_hashes_and_crc_verified'],
                  'unchanged_member_compressed_streams_identical': build['unchanged_member_compressed_streams_identical'],
                  'source_unchanged_during_build': build['source_unchanged_during_build'],
                  'manifest': upload, 'independent_part_redownload_verified': True,
                  'limitations': build['limitations'],
              }
          else:
              logs = {}
              for name in ('fetch', 'build', 'unzip', 'upload'):
                  path = root / ('ota03-' + name + '.log')
                  if path.exists():
                      logs[name] = re.sub(r'https?://[^\s\"\']+', '[URL redacted]',
                                          path.read_text(errors='replace')[-9000:])
              summary = {'status': 'BUILD_OR_TRANSFER_INCOMPLETE_HOLD', 'outcomes': outcomes, 'logs': logs}
          text = json.dumps(summary, ensure_ascii=True, separators=(',', ':'))
          if len(text) > 45000:
              raise SystemExit('Unexpectedly large build status')
          payload = {'name': 'Synthetica boot-first 03 verified metadata', 'head_sha': os.environ['GITHUB_SHA'],
                     'status': 'completed', 'conclusion': 'success' if ok else 'neutral',
                     'output': {'title': '03 packaging repair only; HOLD', 'summary': text}}
          subprocess.run(['gh', 'api', '--method', 'POST', 'repos/dwp29/Syntenthica/check-runs', '--input', '-'],
                         input=json.dumps(payload).encode(), stdout=subprocess.DEVNULL, check=True)
          PY
