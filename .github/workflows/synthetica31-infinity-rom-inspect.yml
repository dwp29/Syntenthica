name: "Synthetica 3.1 - inspect public Infinity 4.1 ROM archive"
on:
  workflow_dispatch:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: ['.github/workflows/synthetica31-infinity-rom-inspect.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download public official Infinity 4.1 GAPPS archive
        timeout-minutes: 25
        run: |
          set -euo pipefail
          url='https://mirror.tejas101k.workers.dev/0:/Project_Infinity-X-4.1-miatoll-21.10.2026-GAPPS-OFFICIAL.zip'
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 1300 --output "$RUNNER_TEMP/infinity.zip" "$url"
          test "$(stat -c %s "$RUNNER_TEMP/infinity.zip")" = 2641732377
          echo "6b3d41aea18311e663266489adf54307  $RUNNER_TEMP/infinity.zip" | md5sum -c -
      - name: Inspect archive layout, without extracting or executing ROM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile,json
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'infinity.zip'
          with zipfile.ZipFile(p) as z:
              infos=z.infolist()
              print('Entry count:',len(infos))
              for i in infos:
                  if not i.is_dir():
                      print(json.dumps({'name':i.filename,'bytes':i.file_size,'compressed_bytes':i.compress_size}))
          PY
      - name: Scope
        run: echo '::notice::Public publisher archive only; not a user image, installed-ROM proof, boot test, or module audit.'
