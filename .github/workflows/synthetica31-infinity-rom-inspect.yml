name: "Synthetica 3.1 - inspect public Infinity 4.1 ROM archive"
on:
  workflow_dispatch:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: ['.github/workflows/synthetica31-infinity-rom-inspect.yml']
permissions:
  contents: write # Only public ROM module audit report, never private device images.
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install offline extraction tools
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get install -y -qq brotli e2fsprogs openssl
      - name: Download public official Infinity 4.1 GAPPS archive
        timeout-minutes: 25
        run: |
          set -euo pipefail
          url='https://mirror.tejas101k.workers.dev/0:/Project_Infinity-X-4.1-miatoll-21.10.2026-GAPPS-OFFICIAL.zip'
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 1300 --output "$RUNNER_TEMP/infinity.zip" "$url"
          test "$(stat -c %s "$RUNNER_TEMP/infinity.zip")" = 2641732377
          echo "6b3d41aea18311e663266489adf54307  $RUNNER_TEMP/infinity.zip" | md5sum -c -
          echo "::notice title=Publisher ROM SHA256::$(sha256sum "$RUNNER_TEMP/infinity.zip" | cut -d' ' -f1)"
          echo "ROM_SHA=$(sha256sum "$RUNNER_TEMP/infinity.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Extract full vendor and compare ROM boot
        run: |
          set -euo pipefail
          if ! python3 build-kit/scripts/extract_synthetica2_block_ota.py --archive "$RUNNER_TEMP/infinity.zip" \
            --out "$RUNNER_TEMP/rom-extracted" --sha256 "$ROM_SHA" --bytes 2641732377 > "$RUNNER_TEMP/extract.log" 2>&1; then
            echo "::error title=ROM extraction refused::$(tail -c 4000 "$RUNNER_TEMP/extract.log" | tr '\n' ' ')"
            exit 1
          fi
          cat "$RUNNER_TEMP/extract.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'rom-extracted/extraction-report.json').read_text())
          print('::notice title=ROM boot SHA256::'+x['boot_image_sha256'])
          print('::notice title=ROM vendor SHA256::'+x['vendor_image_sha256'])
          print('::notice title=Uploaded boot matches public ROM boot::'+str(x['boot_image_sha256']=='d33c01c2fd84faff24c8b80b60ed32df735fc966cff2472b1d30403c3e6fec1f'))
          PY
      - name: Extract vendor modules without mounting the filesystem
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/mods"
          debugfs -R "rdump /lib/modules $RUNNER_TEMP/mods" "$RUNNER_TEMP/rom-extracted/vendor.img" > "$RUNNER_TEMP/debugfs.log" 2>&1
          echo "::notice title=Vendor module extraction::$(tail -c 1800 "$RUNNER_TEMP/debugfs.log" | tr '\n' ' ')"
          find "$RUNNER_TEMP/mods" -type f | head -30
          n=$(find "$RUNNER_TEMP/mods" -type f -name '*.ko' | wc -l)
          echo "::notice title=Vendor uncompressed .ko count::$n"
          test "$n" -gt 0
          python3 - <<'PY'
          import json,os,sys,struct
          from pathlib import Path
          sys.path.insert(0,'build-kit/scripts')
          import audit_chronicle_s31 as ca
          import verify_synthetica3_modules as vm
          t=Path(os.environ['RUNNER_TEMP']); image=t/'rom-extracted/boot.img'
          with image.open('rb') as f:
              head=f.read(4096); size=struct.unpack_from('<I',head,8)[0]
              if size<=0 or size>100000000: raise ValueError('unexpected kernel size')
              kernel=f.read(size)
          certs=ca.certs(kernel); assert len(certs)==1
          cert_hash,cert=next(iter(certs.items()))
          assert cert_hash=='af3673e410a81247e88bffdb44cac8e642b140cb7caaedc342cdb3170aa5600a'
          root=t/'mods/modules'; loaded=(root/'modules.load').read_text().splitlines()
          checks={}
          for p in sorted(root.glob('*.ko')):
              payload,sig=vm.split_signature(p.read_bytes())
              try: vm.verify_pkcs7(payload,sig,cert); ok=True
              except ValueError: ok=False
              checks[p.name]={'verified_by_rom_boot_cert':ok,'listed_in_modules_load':p.name in {Path(s.strip()).name for s in loaded if s.strip() and not s.lstrip().startswith('#')}}
          print('::notice title=ROM module load list::'+json.dumps(loaded,separators=(',',':')))
          print('::notice title=ROM module signature controls::'+json.dumps(checks,separators=(',',':')))
          (t/'rom-module-controls.json').write_text(json.dumps({'rom_boot_cert_sha256':cert_hash,'modules_load':loaded,'modules':checks},indent=2))
          PY
      - name: Inspect vendor init module load commands
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/vendor-init"
          debugfs -R "rdump /etc/init $RUNNER_TEMP/vendor-init" "$RUNNER_TEMP/rom-extracted/vendor.img" > "$RUNNER_TEMP/init-debugfs.log" 2>&1
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'vendor-init'; findings=[]; scanned=0
          for p in sorted(root.rglob('*.rc')):
              if p.is_symlink() or not p.is_file() or p.stat().st_size>1048576: continue
              scanned+=1
              for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if re.search(r'\b(?:insmod|modprobe)\b|modules\.load|/vendor/lib/modules',line,re.I) and not line.lstrip().startswith('#'):
                      findings.append(f'{p.relative_to(root)}:{i}: {line.strip()}')
          print(f'::notice title=Vendor init module references::{scanned} rc files scanned; '+(' | '.join(findings) or 'no matching directives')[:5500].replace('%','%25'))
          PY
      - name: Inspect modules in system partition
        run: |
          set -euo pipefail
          if ! python3 - <<'PY' > "$RUNNER_TEMP/system-extract.log" 2>&1
          import os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'build-kit/scripts'); import extract_synthetica2_block_ota as ex
          t=Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(t/'infinity.zip') as z:
              transfer=ex.info_once(z,'system.transfer.list',ex.MAX_TRANSFER)
              info=ex.info_once(z,'system.new.dat.br',ex.MAX_VENDOR_COMPRESSED)
              patch=ex.info_once(z,'system.patch.dat',0)
              size,ranges=ex.parse_transfer(z.read(transfer))
              ex.extract_vendor(z,info,t/'system.img',size,ranges)
          PY
          then
            echo "::error title=System extraction refused::$(tail -c 3000 "$RUNNER_TEMP/system-extract.log" | tr '\n' ' ')"; exit 1
          fi
          mkdir "$RUNNER_TEMP/system-modules"
          debugfs -R "rdump /system/lib/modules $RUNNER_TEMP/system-modules" "$RUNNER_TEMP/system.img" > "$RUNNER_TEMP/system-debug.log" 2>&1
          debugfs -R "rdump /lib/modules $RUNNER_TEMP/system-modules" "$RUNNER_TEMP/system.img" >> "$RUNNER_TEMP/system-debug.log" 2>&1
          python3 - <<'PY'
          import os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); root=t/'system-modules'; rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and not p.is_symlink(): rows.append(f'{p.relative_to(root)}:{p.stat().st_size}')
          print('::notice title=System module files::'+(' | '.join(rows) or 'none')[:5000])
          print('::notice title=System debugfs::'+(t/'system-debug.log').read_text()[-1500:].replace('\n',' '))
          PY
      - name: Fetch 3.1 evidence and audit ROM modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/git/blobs/0f815b773d39a8f0b392a7d190be9ca1ad702ead" > "$RUNNER_TEMP/evidence31.zip"
          echo "67c804f049c9bb00977c067e06bc663f75a8b7782b4f47bd2626b3fd5a36a847  $RUNNER_TEMP/evidence31.zip" | sha256sum -c -
          if ! python3 build-kit/scripts/audit_synthetica31_rom_modules.py --modules "$RUNNER_TEMP/mods" \
            --evidence "$RUNNER_TEMP/evidence31.zip" --report "$RUNNER_TEMP/rom-modules-report.json" > "$RUNNER_TEMP/audit.log" 2>&1; then
            echo "::error title=Module audit refused::$(tail -c 4000 "$RUNNER_TEMP/audit.log" | tr '\n' ' ')"; exit 1
          fi
          cat "$RUNNER_TEMP/audit.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'rom-modules-report.json').read_text())
          print('::notice title=3.1 vs public Infinity vendor module summary::'+json.dumps(r['summary'],separators=(',',':')))
          PY
      - name: Store public audit report as an unreferenced Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); data=(t/'rom-modules-report.json').read_bytes()
          assert len(data)<10000000
          (t/'report-blob.json').write_text(json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}))
          PY
          blob=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input "$RUNNER_TEMP/report-blob.json" --jq .sha)
          echo "::notice title=Public ROM modules audit blob::$blob"
      - name: Transfer public ROM module evidence for independent audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,zipfile
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); m=t/'mods/modules'; names=['gspca_main.ko','rmnet_perf.ko','rmnet_shs.ko','modules.load','modules.dep']
          output=t/'public-infinity-vendor-evidence.zip'
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  p=m/name
                  if p.is_symlink() or not p.is_file() or p.stat().st_size>20_000_000: raise ValueError('unexpected module evidence')
                  z.write(p,'modules/'+name)
              z.write(t/'rom-module-controls.json','rom-module-controls.json')
              z.write(t/'rom-extracted/extraction-report.json','extraction-report.json')
          raw=output.read_bytes(); assert len(raw)<10_000_000
          (t/'evidence-blob.json').write_text(json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}))
          print('::notice title=Public vendor evidence zip SHA256::'+hashlib.sha256(raw).hexdigest())
          PY
          blob=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input "$RUNNER_TEMP/evidence-blob.json" --jq .sha)
          echo "::notice title=Public vendor evidence blob::$blob"
      - name: Scope
        run: echo '::notice::Public publisher archive only; not installed-ROM proof, runtime module loading or physical boot.'
