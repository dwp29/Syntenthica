name: "Inspect a Synthetica 4.0 unsigned build artifact"
on:
  push:
    branches:
      - arena/96cbd65a-synthentica
    paths:
      - '.github/workflows/synthetica40-inspect-build.yml'
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build run with unsigned Manager artifact"
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate run ID
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id || '42377314005' }}
        run: '[[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: synthetica40-manager-unsigned-${{ inputs.build_run_id || '42377314005' }}
          run-id: ${{ inputs.build_run_id || '42377314005' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/inspection
      - name: Diagnose static verification and transfer unsigned artifact and logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/inspection/Synthetica-Manager-4.0.0-Pixel-UNSIGNED.apk"
          test -s "$APK"
          python3 tests/verify_synthetica40_apk.py "$APK" > "$RUNNER_TEMP/inspection/verify-retry.log" 2>&1 || true
          cat "$RUNNER_TEMP/inspection/verify-retry.log"
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'inspection'
          for name in ('Synthetica-Manager-4.0.0-Pixel-UNSIGNED.apk','verify-retry.log','badging.txt','static-checks.txt','signature-check.txt','host-tests.log'):
              path=root/name
              if not path.is_file() or not path.stat().st_size: continue
              payload=root/(name+'.json')
              payload.write_text(json.dumps({'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'}))
              out=subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--method','POST','--input',str(payload),'--jq','.sha'],capture_output=True,text=True,check=True).stdout.strip()
              print(f'::notice title=Unsigned inspection {name} blob::{out}')
          PY
