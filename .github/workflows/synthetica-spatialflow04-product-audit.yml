name: Synthetica 04 product preservation audit
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-spatialflow04-product-audit.yml, synthetica-project/audit_spatialflow04_product.py, tests/test_audit_spatialflow04_product.py]
  workflow_dispatch:
# Read exact unpublished 04 only; no new release, device changes or publication.
permissions:
  contents: write # needed to read the existing private draft
  checks: write
jobs:
  audit:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned filesystem reader
        run: python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-boot-audit.txt
      - name: Run bounded reconstruction and read controls
        run: python -m unittest discover -s tests -p 'test_audit_spatialflow04_product.py' -v
      - name: Reserve disposable space
        shell: bash
        run: |
          set -euo pipefail
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free < 12000000000 )); then sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; fi
          python -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free > 11000000000'
          mkdir "$RUNNER_TEMP/spatialflow04-audit"
      - name: Read pinned 04 product and compare exact file hashes
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          python -u synthetica-project/audit_spatialflow04_product.py --work "$RUNNER_TEMP/spatialflow04-audit" \
            --report "$RUNNER_TEMP/spatialflow04-audit-result.json"
      - name: Record bounded result including failures
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'spatialflow04-audit-result.json'
          result=json.loads(path.read_text()) if path.is_file() else {'status':'PREPARATION_FAILED_HOLD'}
          result['outcome']=os.environ['AUDIT_OUTCOME']
          text=json.dumps(result,ensure_ascii=True,separators=(',',':'))
          if len(text)>30000: raise SystemExit('Audit result exceeds bounded check size')
          ok=(result.get('status')=='READ_ONLY_04_PRODUCT_PRESERVATION_HOLD'
              and result.get('gms_apex_sha_matches_independent_candidate03_audit') is True
              and result.get('spatialflow_sha_matches_pinned_release') is True and result['outcome']=='success')
          payload={'name':'Synthetica 04 product preservation','head_sha':os.environ['GITHUB_SHA'],'status':'completed',
                   'conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Static bytes only; device and boot remain untested','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(),stdout=subprocess.DEVNULL,check=True)
          PY
