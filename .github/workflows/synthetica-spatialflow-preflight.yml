name: Synthetica SpatialFlow host preparation
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-spatialflow-preflight.yml]
  workflow_dispatch:
# Accept both established and SDK 37 apksigner output; no APK or ROM is uploaded.
permissions:
  contents: write # Required to read private draft releases.
  checks: write
concurrency:
  group: synthetica-spatialflow-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install the pinned read-only ext4 reader
        run: python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-boot-audit.txt
      - name: Run host controls
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_preflight_spatialflow.py' -v
          python -m unittest discover -s tests -p 'test_audit_vintf_candidate.py' -v
      - name: Select installed Android APK inspection tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools=$(find "$root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for name in aapt apksigner zipalign; do test -x "$tools/$name"; done
          echo "dir=$tools" >> "$GITHUB_OUTPUT"
          echo 'Android SDK tools located'
      - name: Reserve disposable space, keeping Android build tools
        shell: bash
        run: |
          set -euo pipefail
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free < 15000000000 )); then
            sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          python - <<'PY2'
          import os, shutil
          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          print('Free bytes:', free)
          if free < 14_000_000_000:
              raise SystemExit('Not enough disposable runner space for source and read-only extents')
          PY2
          mkdir "$RUNNER_TEMP/spatialflow-preflight"
      - name: Verify APK and examine locked baseline extents without modifying them
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          tools='${{ steps.tools.outputs.dir }}'
          python -u synthetica-project/preflight_spatialflow.py \
            --work "$RUNNER_TEMP/spatialflow-preflight" --report "$RUNNER_TEMP/spatialflow-result.json" \
            --aapt "$tools/aapt" --apksigner "$tools/apksigner" --zipalign "$tools/zipalign"
      - name: Publish bounded host result, including failures
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python - <<'PY2'
          import json, os, subprocess
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'spatialflow-result.json'
          if path.is_file():
              result = json.loads(path.read_text())
          else:
              result = {'status': 'PREPARATION_FAILED_HOLD', 'audit_outcome': os.environ['AUDIT_OUTCOME']}
          text = json.dumps(result, ensure_ascii=True, separators=(',', ':'))
          if len(text) > 40000: raise SystemExit('Result exceeds check-run limit')
          ok = os.environ['AUDIT_OUTCOME'] == 'success' and result.get('status') == 'READ_ONLY_PREFLIGHT_NOT_A_ROM_BUILD_HOLD'
          payload = {'name': 'Synthetica SpatialFlow host preparation', 'head_sha': os.environ['GITHUB_SHA'],
                     'status': 'completed', 'conclusion': 'success' if ok else 'neutral',
                     'output': {'title': 'Read-only preparation; not a ROM build or device test', 'summary': text}}
          subprocess.run(['gh', 'api', '--method', 'POST', 'repos/dwp29/Syntenthica/check-runs', '--input', '-'],
                         input=json.dumps(payload).encode(), stdout=subprocess.DEVNULL, check=True)
          PY2
