name: Synthetica experimental SpatialFlow ROM candidate
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-spatialflow-candidate.yml]
  workflow_dispatch:
# An unpublished experimental draft only, never a device action or flash approval.
permissions:
  contents: write
  checks: write
concurrency:
  group: synthetica-spatialflow-candidate-04
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned host dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-boot-audit.txt
          python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-ota-metadata.txt
      - name: Run filesystem, LP, ZIP, transfer and metadata controls
        shell: bash
        run: |
          set -euo pipefail
          for test in test_preflight_spatialflow.py test_feature_ext4.py test_expand_product_lp.py \
            test_expand_locked_spatial_layout.py test_scan_apk_packages.py \
            test_prepare_spatialflow_music_intent.py test_build_spatialflow_candidate.py test_build_spatialflow_grown.py \
            test_release_spatialflow_candidate.py test_hyperos4_lp_metadata.py \
            test_audit_vintf_candidate.py test_build_ota_metadata_candidate.py \
            test_build_guarded_candidate.py test_audit_boot_first_installer.py; do
            python -m unittest discover -s tests -p "$test" -v
          done
      - name: Check disposable runner space and Android APK tools
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools=$(find "$root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for name in aapt aapt2 apksigner zipalign; do test -x "$tools/$name"; done
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          free=$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          if (( free < 18500000000 )); then
            sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          python - <<'PY2'
          import os, shutil
          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          print('Free disposable runner bytes:', free)
          if free < 18_000_000_000:
              raise SystemExit('Insufficient disk for separately verified inputs, product images and candidate')
          PY2
          mkdir "$RUNNER_TEMP/spatialflow-build" "$RUNNER_TEMP/spatialflow-transfer" "$RUNNER_TEMP/lpdump-probe"
      - name: Verify isolated independent LP reader against synthetic controls
        id: lp_controls
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/ravindu644/android-lptools-static-x86_64/git/blobs/d90449a803e1bf3df2ebb5a2a466f89bbc3f29a4' --jq .content | base64 -d > "$RUNNER_TEMP/lpdump"
          echo 'a7877918d01a98466d88980b2163756acd5926b602e97c2efb9e8de8a5a27a39  '"$RUNNER_TEMP/lpdump" | sha256sum -c -
          python -u synthetica-project/probe_lpdump_tool.py --binary "$RUNNER_TEMP/lpdump" \
            --work "$RUNNER_TEMP/lpdump-probe" --report "$RUNNER_TEMP/lpdump-result.json"
      - name: Build and independently verify separate experimental candidate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          tools='${{ steps.prepare.outputs.tools }}'
          python -u synthetica-project/build_spatialflow_candidate.py \
            --work "$RUNNER_TEMP/spatialflow-build" \
            --output "$RUNNER_TEMP/synthetica-feature-20261103-04-spatialflow.zip" \
            --report "$RUNNER_TEMP/BUILD-REPORT-SPATIALFLOW-04.json" \
            --aapt "$tools/aapt" --apksigner "$tools/apksigner" --zipalign "$tools/zipalign" \
            --lpdump-sandbox "$RUNNER_TEMP/lpdump-probe/sandbox" --lpdump-report "$RUNNER_TEMP/lpdump-result.json"
          unzip -t "$RUNNER_TEMP/synthetica-feature-20261103-04-spatialflow.zip" > "$RUNNER_TEMP/spatialflow-unzip.log"
          echo 'Independent unzip integrity check passed.'
      - name: Free only verified disposable source copies
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/spatialflow-build/synthetica-boot-first-20261102-03-ota-metadata.zip"
          test -f "$RUNNER_TEMP/spatialflow-build/product-after.img"
          rm "$RUNNER_TEMP/spatialflow-build/synthetica-boot-first-20261102-03-ota-metadata.zip" \
             "$RUNNER_TEMP/spatialflow-build/product-after.img"
      - name: Save only to new unpublished HOLD draft and re-download its parts
        id: transfer
        shell: bash
        run: |
          set -euo pipefail
          python -u synthetica-project/release_spatialflow_candidate.py \
            --report "$RUNNER_TEMP/BUILD-REPORT-SPATIALFLOW-04.json" \
            --output "$RUNNER_TEMP/synthetica-feature-20261103-04-spatialflow.zip" \
            --work "$RUNNER_TEMP/spatialflow-transfer" \
            --tag "synthetica-feature-spatialflow-04-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --commit "$GITHUB_SHA" --result "$RUNNER_TEMP/spatialflow-transfer-result.json"
      - name: Record bounded result, including failures
        if: always()
        env:
          LP_OUTCOME: ${{ steps.lp_controls.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TRANSFER_OUTCOME: ${{ steps.transfer.outcome }}
        run: |
          python - <<'PY2'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          result = {'status': 'INCOMPLETE_HOLD', 'outcomes': {k: os.environ[k] for k in ('LP_OUTCOME','BUILD_OUTCOME','TRANSFER_OUTCOME')}}
          for key,name in [('lp_controls','lpdump-result.json'), ('build','BUILD-REPORT-SPATIALFLOW-04.json'),
                           ('transfer','spatialflow-transfer-result.json')]:
              path=root/name
              if path.exists(): result[key]=json.loads(path.read_text())
          ok = (all(x=='success' for x in result['outcomes'].values())
                and result.get('build',{}).get('status')=='HOST_VERIFIED_DEVICE_UNTESTED_HOLD_DO_NOT_FLASH'
                and result.get('transfer',{}).get('status')=='UNPUBLISHED_HOLD_DO_NOT_FLASH')
          result['status'] = 'EXPERIMENTAL_DRAFT_BUILT_HOLD_DO_NOT_FLASH' if ok else 'INCOMPLETE_HOLD'
          text=json.dumps(result, ensure_ascii=True, separators=(',',':'))
          if len(text)>60000: raise SystemExit('Result exceeds bounded check-run size')
          payload={'name':'Synthetica SpatialFlow 04 build result', 'head_sha':os.environ['GITHUB_SHA'],
                   'status':'completed','conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Experimental draft only; no device or boot test','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(), stdout=subprocess.DEVNULL, check=True)
          PY2
