name: "Pure Manager — build APK"

# Builds are the only way to produce an APK here: this sandbox has no JDK and no
# Android SDK, and dl.google.com is not reachable from it. The runner has both.
on:
  push:
    branches: [arena/96cbd65a-synthentica]
    paths:
      - 'pure-manager/**'
      - 'build-kit/scripts/apk_v2_sign.py'
      - '.github/workflows/pure-manager-build.yml'
  workflow_dispatch:

permissions:
  contents: write   # only to store the unsigned APK as an unreferenced blob

jobs:
  build:
    name: "Unsigned Pure Manager APK"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/96cbd65a-synthentica
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk-pm"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 2>&1 | tail -5

      - name: Generate Gradle wrapper
        working-directory: pure-manager
        run: |
          set -euo pipefail
          # No wrapper is committed yet; the first build produces one so that later
          # runs are reproducible against a pinned Gradle version.
          gradle wrapper --gradle-version 8.9 --distribution-type bin 2>&1 | tail -5 \
            || {
              curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
              unzip -q /tmp/gradle.zip -d /opt
              /opt/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --distribution-type bin
            }
          ls -la gradlew gradle/wrapper/

      # assembleRelease with no signingConfig produces an unsigned APK, which
      # cannot be installed. Generate the debug keystore if the runner has none,
      # then sign with it.
      # The browser's sorting, formatting, name validation and copy/move/delete
      # logic is pure Kotlin, so it can be executed here. Everything that touches
      # a device is verified by the owner instead.
      # Tests block the artifact again. They were briefly non-blocking because a
      # failing step on this repository emitted nothing readable -- no ::error, no
      # ::group::, no blob, and the run log is EOF from here. The way out was not a
      # better instrumented failure but a reporter that cannot fail: a separate
      # step that always succeeds and publishes the count AND the failing test
      # names as ::notice. That is how the last three bugs were found.
      #
      # With that in place, blocking is safe again: a red test names itself.
      - name: Run unit tests
        working-directory: pure-manager
        run: |
          mkdir -p "$RUNNER_TEMP/pm-output"
          set +e
          ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace \
            > "$RUNNER_TEMP/pm-output/tests.log" 2>&1
          GRADLE_EXIT=$?
          set -e
          tail -25 "$RUNNER_TEMP/pm-output/tests.log" || true
          {
            echo "===== testReleaseUnitTest ====="
            tail -c 30000 "$RUNNER_TEMP/pm-output/tests.log" || true
            echo
            echo "===== JUnit summary ====="
            python3 -c '
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testReleaseUnitTest/*.xml")
          t = f = e = s = 0
          for path in files:
              root = ET.parse(path).getroot()
              t += int(root.get("tests", 0)); f += int(root.get("failures", 0))
              e += int(root.get("errors", 0)); s += int(root.get("skipped", 0))
          print(f"unit tests: {t} run, {f} failed, {e} errored, {s} skipped")
          ' 2>&1 || echo "JUnit XML tidak ditemukan"
          } >> "$RUNNER_TEMP/pm-output/build.log"
          # Independently of the big log, keep the summary where the reporter can
          # find it without parsing anything.
          python3 -c '
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testReleaseUnitTest/*.xml")
          t = f = e = sk = 0
          for path in files:
              root = ET.parse(path).getroot()
              t += int(root.get("tests", 0)); f += int(root.get("failures", 0))
              e += int(root.get("errors", 0)); sk += int(root.get("skipped", 0))
          open("'"$RUNNER_TEMP"'/pm-output/test-summary.txt", "w").write(
              f"{t} run, {f} failed, {e} errored, {sk} skipped")
          ' 2>/dev/null || echo "JUnit XML tidak ditemukan" > "$RUNNER_TEMP/pm-output/test-summary.txt"
          # Only now fail, after both reports are written, so the reporter step
          # still has something to say about WHY the build is red.
          exit "$GRADLE_EXIT"

      - name: Ensure a signing key exists
        run: |
          set -euo pipefail
          KS="$HOME/.android/debug.keystore"
          if [ ! -f "$KS" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$KS" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$KS" -storepass android | tail -3

      - name: Assemble release
        working-directory: pure-manager
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pm-output"
          # tee into the artifact directory as well: the run-log download endpoint
          # returns EOF for this repo, so the compiler output has to travel with
          # the artifact instead.
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/pm-output/build.log" | tail -40

      # Even when everything passes, say how many tests ran: "success" alone has
      # already meant "zero tests" once in this project.
      - name: Report test count
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY=$(cat "$RUNNER_TEMP/pm-output/test-summary.txt" 2>/dev/null | tr -d '\n')
          echo "::notice title=Unit tests::${SUMMARY:-no summary}"
          # Nama tes yang gagal, langsung dari log Gradle ("... FAILED"). Langkah
          # ini selalu sukses, jadi notice-nya pasti terkirim -- berbeda dari
          # langkah tes yang gagal, yang pesannya hilang di repo ini.
          FAILS=$(grep -E "^[A-Za-z].* FAILED$" "$RUNNER_TEMP/pm-output/tests.log" 2>/dev/null | head -6 | tr '\n' ';' || true)
          if [ -n "${FAILS:-}" ]; then
            echo "::notice title=Gagal::${FAILS}"
          fi
          if [ -n "${SUMMARY:-}" ]; then
            echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Compiler errors, one per line, as notices. The blob API accepted the
          # build log twice and then could not read it back (404), and the run log
          # endpoint returns EOF for this repository. A notice is the only channel
          # that has never failed -- and `e: ` lines are short enough to survive it.
          ERRORS=$(grep -E "^e: " "$RUNNER_TEMP/pm-output/tests.log" 2>/dev/null \
                   | sed -E 's#^\(e: file://[^/]*/)##' | head -8 | tr '\n' ';' || true)
          if [ -n "${ERRORS:-}" ]; then
            echo "::notice title=Kompilasi gagal::${ERRORS}"
          fi

      - name: Verify the APK
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pm-output"
          mkdir -p "$OUT"
          # The version is read, not repeated. Renaming it by hand in nine places is
          # how build 18 went red with 38 passing tests: the artifact was 0.3.1 and
          # the check still said 0.3.0.
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' pure-manager/app/build.gradle.kts | head -1)
          test -n "$VERSION"
          # Exported under the name the later steps read. Exporting PM_VERSION while
          # they read VERSION is how run 42994597044 failed with a green APK.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          APK=$(find pure-manager/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "$OUT/PureManager-$VERSION-DEBUGKEY.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" verify --print-certs "$APK" | head -6
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          "$TOOLS/zipalign" -c -p 4 "$OUT/PureManager-${VERSION}-DEBUGKEY.apk"
          "$TOOLS/aapt" dump badging "$OUT/PureManager-${VERSION}-DEBUGKEY.apk" > "$OUT/badging.txt"
          grep -F "package: name='net.pure.manager'" "$OUT/badging.txt"
          grep -F "sdkVersion:'29'" "$OUT/badging.txt"
          grep -F "targetSdkVersion:'36'" "$OUT/badging.txt"
          grep -F "versionName='$VERSION'" "$OUT/badging.txt"
          # This used to assert the APK was UNSIGNED, back when 0.1.0 shipped an
          # installable-looking artifact that no device would accept. It now
          # asserts the opposite: the signature has to be present and v2.
          "$TOOLS/apksigner" verify --verbose "$OUT/PureManager-${VERSION}-DEBUGKEY.apk" \
               > "$OUT/signature-check.txt" 2>&1
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" \
               "$OUT/signature-check.txt"
          sha256sum "$OUT/PureManager-${VERSION}-DEBUGKEY.apk" | tee "$OUT/SHA256.txt"
          echo "::notice title=Signed Pure Manager SHA256::$(cut -d' ' -f1 "$OUT/SHA256.txt")"
          echo "::notice title=APK size::$(stat -c%s "$OUT/PureManager-${VERSION}-DEBUGKEY.apk") bytes"

      # The APK is 11 MB. Blob-then-notice works for a 25 KB log but not for this:
      # the blob API accepts the upload and the blob is then unreadable (404 on
      # read-back), and artifacts come from a host that returns EOF. Committing the
      # APK to a throwaway branch uses the plain git transport, which is the one
      # path proven to work for this repository. It is not merged anywhere and is
      # replaced on every build, so nothing accumulates in history.
      - name: Publish the APK on the build-output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/pm-output/PureManager-${VERSION}-DEBUGKEY.apk"
          test -s "$APK"
          work="$RUNNER_TEMP/publish"
          rm -rf "$work"
          git init -q --initial-branch=build-output "$work"
          cp "$APK" "$work/PureManager-${VERSION}-DEBUGKEY.apk"
          (
            cd "$work"
            git config user.name  "Pure Manager CI"
            git config user.email "ci@users.noreply.github.com"
            printf '%s\n' \
              "Pure Manager ${VERSION} — debug-key signed APK" \
              "" \
              "Built from $GITHUB_SHA by run $GITHUB_RUN_ID." \
              "This branch is overwritten by every build and is never merged." \
              "The APK is debug-key signed by AGP until the release keystore is wired in." \
              > README.md
            git add -A
            git commit -q -m "build: Pure Manager ${VERSION} APK (run $GITHUB_RUN_ID)"
            git push -q --force \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:refs/heads/build-output
          )
          echo "::notice title=Unsigned Pure Manager APK::https://github.com/${GITHUB_REPOSITORY}/raw/build-output/PureManager-${VERSION}-DEBUGKEY.apk"

      - name: Upload diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s "$RUNNER_TEMP/pm-output/build.log" ]; then
            tail -c 60000 "$RUNNER_TEMP/pm-output/build.log" > "$RUNNER_TEMP/tail.log"
            LOG="$RUNNER_TEMP/tail.log" python3 - <<'PY'
          import base64, json, os, pathlib
          p = pathlib.Path(os.environ['LOG']); t = pathlib.Path(os.environ['RUNNER_TEMP'])
          (t / 'log.json').write_text(json.dumps({
              'content': base64.b64encode(p.read_bytes()).decode(),
              'encoding': 'base64'}))
          PY
            blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST \
                    --input "$RUNNER_TEMP/log.json" --jq .sha)
            echo "::notice title=Pure Manager build log::$blob"
            {
              echo "### Pure Manager build log (last 12 KB)"
              echo '```'
              tail -c 12000 "$RUNNER_TEMP/pm-output/build.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The whole pm-output directory, including tests.log. The run-log endpoint
      # returns EOF for this repository and the blob API accepts an upload then 404s
      # on read-back; an artifact is the only transport left, and `gh run download`
      # uses a different host. On a red build this file is the only account of what
      # the compiler said.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pure-manager-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/pm-output/
          retention-days: 14
          if-no-files-found: warn
