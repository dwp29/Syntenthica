name: "Synthetica 3.2 - build kernel, signed modules, and cross-ROM AVB-fix installer"

on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths:
      - '.github/workflows/synthetica32-final.yml'
      - 'build-kit/ci/s31-avb-fix/**'
      - 'build-kit/scripts/build_synthetica32_final.py'
      - 'build-kit/scripts/package_synthetica32_final.py'
      - 'tests/test_synthetica31_avb_fix.py'
      - 'tests/test_synthetica32_final_qemu.py'
  workflow_dispatch:

permissions:
  contents: write # Unreferenced evidence blob only; no branch writes.

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and ARM QEMU tools
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get install -y -qq \
            gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc flex bison libssl-dev libelf-dev device-tree-compiler \
            cpio lz4 xz-utils zstd python3 patch openssl zip unzip rsync git curl binutils kmod \
            busybox qemu-user-static
      - name: Fetch and verify exact 2.0-exp, 3.0, and 3.1 configurations and symvers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/git/blobs/8541d4a26081b94215d4d493332cc27711f2fd15" > "$RUNNER_TEMP/transfer30.zip"
          echo '77f7a76159c5f450704adc75d9dc7daa02a7c6e18f33edf4216025314e38e5c9  '"$RUNNER_TEMP/transfer30.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/transfer30.zip" generated.config.txt > "$RUNNER_TEMP/config30"
          echo '253a89a338e8c5b71da71b698a0160d9fb361468cfac3a3bfc7fae2c52f4af2d  '"$RUNNER_TEMP/config30" | sha256sum -c -
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/git/blobs/d5e292c91a36c7706deedfdb9f1ca8b7a703ee3e" > "$RUNNER_TEMP/transfer20.zip"
          echo '742068c09eb99f6eb37d55aa3ee1bca9ee156db592d10d3d901fca738900dabc  '"$RUNNER_TEMP/transfer20.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/transfer20.zip" generated.config.txt > "$RUNNER_TEMP/config20exp"
          echo 'c72503550d74446f5af3573288b4e93dc1407854c5df338d20681d1866ccb96c  '"$RUNNER_TEMP/config20exp" | sha256sum -c -
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/git/blobs/0f815b773d39a8f0b392a7d190be9ca1ad702ead" > "$RUNNER_TEMP/transfer31.zip"
          echo '67c804f049c9bb00977c067e06bc663f75a8b7782b4f47bd2626b3fd5a36a847  '"$RUNNER_TEMP/transfer31.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/transfer31.zip" generated.config.txt > "$RUNNER_TEMP/config31"
          echo '4b53a2cb030e9aa55ff798a3ee5c773c0eb50e56cd36430d2874adcb56fa236d  '"$RUNNER_TEMP/config31" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/transfer31.zip" Module.symvers > "$RUNNER_TEMP/symvers31"
          echo '1ce7153529b53f3f4bf361ea2e061ec575e712cd47cc5a0f10a854cf91d19ac3  '"$RUNNER_TEMP/symvers31" | sha256sum -c -
          echo "S31_BASELINE_CONFIG=$RUNNER_TEMP/config30" >> "$GITHUB_ENV"
          echo "S3RC_TESTED_CONFIG=$RUNNER_TEMP/config20exp" >> "$GITHUB_ENV"
          echo "S32_BASELINE31_CONFIG=$RUNNER_TEMP/config31" >> "$GITHUB_ENV"
          echo "S32_SYMVERS31=$RUNNER_TEMP/symvers31" >> "$GITHUB_ENV"
      - name: Download and verify the Neutron Clang 18 toolchain
        timeout-minutes: 15
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/neutron-clang-06092026.tar.zst"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          echo "531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30  $archive" | sha256sum -c -
          test "$(stat -c %s "$archive")" = 77768187
          mkdir "$RUNNER_TEMP/neutron"
          tar -I zstd -xf "$archive" -C "$RUNNER_TEMP/neutron"
          echo "S2X_TOOLCHAIN_BIN=$RUNNER_TEMP/neutron/bin" >> "$GITHUB_ENV"
      - name: Compile ARM AVB helper and run synthetic AVB tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/LineageOS/android_external_avb/git/blobs/7932b111ce2b8bb23ea50bebf42c201a20c4eea5 --jq .content | base64 -d > "$RUNNER_TEMP/avbtool.py"
          test "$(git hash-object "$RUNNER_TEMP/avbtool.py")" = 7932b111ce2b8bb23ea50bebf42c201a20c4eea5
          arm-linux-gnueabi-gcc -std=c11 -O2 -Wall -Wextra -Werror -static -s build-kit/ci/s31-avb-fix/fix_avb.c -o "$RUNNER_TEMP/fix-avb-arm"
          gcc -std=c11 -O2 -Wall -Wextra -Werror build-kit/ci/s31-avb-fix/fix_avb.c -o "$RUNNER_TEMP/fix-avb-host"
          S31_FIX_AVB="$RUNNER_TEMP/fix-avb-host" S31_AVBTOOL="$RUNNER_TEMP/avbtool.py" python3 -m unittest discover -s tests -p 'test_synthetica31_avb_fix.py' -v
          S31_FIX_AVB="$RUNNER_TEMP/fix-avb-arm" S31_FIX_PREFIX=qemu-arm-static S31_AVBTOOL="$RUNNER_TEMP/avbtool.py" python3 -m unittest discover -s tests -p 'test_synthetica31_avb_fix.py' -v
          echo "S32_HELPER_SHA=$(sha256sum "$RUNNER_TEMP/fix-avb-arm" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Prepare isolated 3.2 build kit and compile kernel + same-build signed modules
        timeout-minutes: 75
        env:
          SP_JOBS: '4'
          SP_RELEASE_VERSION: '3.2'
          SP_PROFILE: synthetica
          SP_BUILD_NAME: synthetica
          SP_BUILD_KVER: '3.2'
          SP_EXPECT_RELEASE: 4.14.357-openela-synthetica-3.2
          PYTHONOPTIMIZE: '0'
        run: |
          set -euo pipefail
          python3 build-kit/scripts/build_synthetica32_final.py prepare --source build-kit \
            --destination "$RUNNER_TEMP/s32-kit" --baseline artifacts/generated.config.txt
          export SP_WORK_DIR="$RUNNER_TEMP/s32-work"
          export S2X_HELPER="$GITHUB_WORKSPACE/build-kit/scripts/build_synthetica32_final.py"
          export S2X_BASELINE="$GITHUB_WORKSPACE/artifacts/generated.config.txt"
          python3 "$RUNNER_TEMP/s32-kit/scripts/build_chronicle_base.py"
          python3 build-kit/scripts/build_synthetica32_final.py finish \
            --kit "$RUNNER_TEMP/s32-kit" --out "$RUNNER_TEMP/s32-work/tree/out-synthetica" \
            --baseline artifacts/generated.config.txt --tested-config "$S3RC_TESTED_CONFIG" \
            --baseline30 "$S31_BASELINE_CONFIG" --baseline31 "$S32_BASELINE31_CONFIG" \
            --symvers31 "$S32_SYMVERS31" --result "$RUNNER_TEMP/s32-result" \
            --toolchain-bin "$S2X_TOOLCHAIN_BIN" \
            --neutron-archive "$RUNNER_TEMP/neutron-clang-06092026.tar.zst"
          echo "S32_IMAGE_SHA=$(sha256sum "$RUNNER_TEMP/s32-result/Image.gz.DO-NOT-FLASH" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Publish verified 3.2 compile evidence, signed modules, and ARM helper as Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, zipfile
          from pathlib import Path
          t = Path(os.environ['RUNNER_TEMP']); r = t/'s32-result'; out = t/'s32-transfer.zip'
          names = ('Image.gz.DO-NOT-FLASH','STATUS.json','generated.config.txt','module-signing-public-cert.x509','Module.symvers','System.map')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for name in names: z.write(r/name, name)
              for ko in sorted((r/'signed-modules').glob('*.ko')):
                  z.write(ko, f'signed-modules/{ko.name}')
              z.write(t/'fix-avb-arm', 'tools/fix-avb')
          data = out.read_bytes()
          (t/'s32-blob.json').write_text(json.dumps({'content':base64.b64encode(data).decode('ascii'),'encoding':'base64'}))
          print('::notice title=3.2 transfer SHA256::'+hashlib.sha256(data).hexdigest())
          print('::notice title=3.2 Image SHA256::'+hashlib.sha256((r/'Image.gz.DO-NOT-FLASH').read_bytes()).hexdigest())
          print('::notice title=3.2 Helper SHA256::'+hashlib.sha256((t/'fix-avb-arm').read_bytes()).hexdigest())
          PY
          blob=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input "$RUNNER_TEMP/s32-blob.json" --jq .sha)
          test "${#blob}" = 40
          echo "::notice title=3.2 transfer Git blob::$blob"
      - name: Package Synthetica-3.2.zip and verify cross-ROM + Infinity 4.1 + upgrade in ARM QEMU
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python3 build-kit/scripts/package_synthetica32_final.py \
            --result "$RUNNER_TEMP/s32-result" --tested20 "$S3RC_TESTED_CONFIG" \
            --baseline30 "$S31_BASELINE_CONFIG" --baseline31 "$S32_BASELINE31_CONFIG" \
            --helper "$RUNNER_TEMP/fix-avb-arm" --helper-sha256 "$S32_HELPER_SHA" \
            --output "$RUNNER_TEMP/Synthetica-3.2.zip"
          echo "::notice title=3.2 ZIP SHA256::$(sha256sum "$RUNNER_TEMP/Synthetica-3.2.zip" | cut -d' ' -f1)"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 1300 \
            --output "$RUNNER_TEMP/rom.zip" 'https://mirror.tejas101k.workers.dev/0:/Project_Infinity-X-4.1-miatoll-21.10.2026-GAPPS-OFFICIAL.zip'
          test "$(stat -c %s "$RUNNER_TEMP/rom.zip")" = 2641732377
          echo "dc107bce866c6d2ba60d0c0f77578ac1b3de8dca04428ecafb06a4b11f9f648a  $RUNNER_TEMP/rom.zip" | sha256sum -c -
          python3 - <<'PY'
          import os, shutil, zipfile
          from pathlib import Path
          t = Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(t/'rom.zip') as z:
              with z.open('boot.img') as src, (t/'public-boot.img').open('xb') as dst:
                  shutil.copyfileobj(src, dst)
          PY
          echo "d33c01c2fd84faff24c8b80b60ed32df735fc966cff2472b1d30403c3e6fec1f  $RUNNER_TEMP/public-boot.img" | sha256sum -c -
          set +e
          S32_FINAL_QEMU=1 S32_ZIP="$RUNNER_TEMP/Synthetica-3.2.zip" S32_IMAGE_SHA="$S32_IMAGE_SHA" \
            S31_PUBLIC_BOOT="$RUNNER_TEMP/public-boot.img" \
            python3 -m unittest discover -s tests -p 'test_synthetica32_final_qemu.py' -v > "$RUNNER_TEMP/qemu.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/qemu.log"
          if [ "$rc" != 0 ]; then
            python3 - <<'PY2'
          import os
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'qemu.log').read_text(errors='replace')[-9000:]
          print('::error title=3.2 QEMU diagnostic::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY2
            exit "$rc"
          fi
