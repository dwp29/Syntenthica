name: "Diagnosis build Synthetica 3.0 yang gagal"
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: ['.github/workflows/synthetica3-diagnose.yml']

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read only the failed verification message
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected='64884c30eefe2d8c7c0d64077367fc09bcf95f8d'
          gh run view 41953079538 --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha \
            --jq 'select(.status == "completed" and .conclusion == "failure") | .headSha' | grep -Fx "$expected" \
            || { echo '::error::Could not verify the failed run identity'; exit 1; }
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/jobs/127001366270/logs" > "$RUNNER_TEMP/failed-job.log" 2> "$RUNNER_TEMP/log-fetch-error"; then
            echo '::error::Could not retrieve the job log on the runner'
            exit 1
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'failed-job.log').read_text(errors='replace')
          lines = []
          for row in log.splitlines():
              m = re.search(r'(Synthetica 3\.0 build refused: .+|(?:ValueError|TypeError|KeyError|AttributeError|IndexError|FileNotFoundError|ImportError|RuntimeError): .+)', row)
              if m:
                  lines.append(m.group(1))
          if not lines:
              print('::error::No recognized exception in failed verification log')
              raise SystemExit(1)
          for text in lines[-5:]:
              text = text[:350].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Verification diagnostic::' + text)
          PY
