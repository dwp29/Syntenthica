name: "Joyeuse mi_memory kernel link experiment — DO NOT FLASH"
on:
  workflow_dispatch:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths:
      - '.github/workflows/joyeuse-mi-memory-kernel-experimental.yml'
      - 'synthetica-project/build_joyeuse_mi_memory_kernel.py'
      - 'synthetica-project/build_joyeuse_mi_memory_probe.py'
      - 'synthetica-project/build_joyeuse_builtin_experiment.py'
      - 'build-kit/ci/rollercoaster/profiles/joyeuse-builtins-experimental.config'
      - 'tests/test_build_joyeuse_mi_memory_kernel.py'
      - 'tests/test_build_joyeuse_mi_memory_probe.py'
      - 'tests/test_build_joyeuse_builtin_experiment.py'

permissions:
  contents: read

concurrency:
  group: joyeuse-mi-memory-kernel-ikconfig-fixed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install kernel toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc flex bison \
            libssl-dev libelf-dev device-tree-compiler cpio lz4 xz-utils \
            python3 patch openssl zip rsync git curl binutils
          mkdir -p experiment-logs
          printf '%s\n' 'Kernel linking experiment only; source from another SoC is not verified for Joyeuse. DO NOT FLASH.' > experiment-logs/README.txt
      - name: Test host guards
        run: |
          python3 -m unittest discover -s tests -p 'test_build_joyeuse_builtin_experiment.py' -v
          python3 -m unittest discover -s tests -p 'test_build_joyeuse_mi_memory_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_build_joyeuse_mi_memory_kernel.py' -v
      - name: Fetch pinned donor and prepare isolated build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 synthetica-project/build_joyeuse_mi_memory_probe.py fetch --destination "$RUNNER_TEMP/mi-memory-donor"
          python3 synthetica-project/build_joyeuse_mi_memory_kernel.py prepare \
            --source "$GITHUB_WORKSPACE/build-kit" --destination "$RUNNER_TEMP/mi-memory-kernel-kit" \
            --fragment "$GITHUB_WORKSPACE/build-kit/ci/rollercoaster/profiles/joyeuse-builtins-experimental.config"
      - name: Compile and link mi_memory as built-in
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          export SP_JOBS=4 SP_RELEASE_VERSION=2.0 SP_PROFILE=synthetica
          export SP_BUILD_NAME=Synthetica SP_BUILD_KVER=2.0-JOYEUSE-MIMEM-EXPERIMENT
          export SP_WORK_DIR="$RUNNER_TEMP/mi-memory-kernel-work"
          export SP_EXPERIMENT_GUARD="$GITHUB_WORKSPACE/synthetica-project/build_joyeuse_builtin_experiment.py"
          export SP_EXPERIMENT_BASELINE_CONFIG="$GITHUB_WORKSPACE/artifacts/generated.config.txt"
          export SP_MI_MEMORY_PROBE="$GITHUB_WORKSPACE/synthetica-project/build_joyeuse_mi_memory_probe.py"
          export SP_MI_MEMORY_DONOR="$RUNNER_TEMP/mi-memory-donor"
          cd "$RUNNER_TEMP/mi-memory-kernel-kit"
          python3 scripts/build_chronicle_base.py 2>&1 | tee "$GITHUB_WORKSPACE/experiment-logs/kernel-console.log"
      - name: Validate image and collect non-flashable result
        run: |
          set -euo pipefail
          python3 synthetica-project/build_joyeuse_mi_memory_kernel.py finish \
            --kit "$RUNNER_TEMP/mi-memory-kernel-kit" \
            --out "$RUNNER_TEMP/mi-memory-kernel-work/tree/out-synthetica" \
            --baseline "$GITHUB_WORKSPACE/artifacts/generated.config.txt" \
            --result "$GITHUB_WORKSPACE/experiment-result"
          cp experiment-logs/kernel-console.log experiment-result/kernel-console.log.txt
          (cd experiment-result && sha256sum -- * > SHA256SUMS.txt)
      - name: Upload compile-only experiment (not an installer)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DO-NOT-FLASH-joyeuse-mi-memory-experiment-${{ github.run_id }}
          path: experiment-result/
          if-no-files-found: error
          retention-days: 14
      - name: Surface build failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('experiment-logs/kernel-console.log')
          if p.is_file():
              lines = p.read_text(errors='replace').splitlines()
              important = [line for line in lines if any(word in line.lower() for word in ('error:', 'fatal error', 'undefined reference', 'error 1', 'error 2', 'failed'))]
              text = ('\n'.join(important[-20:]) + '\n--- final lines ---\n' + '\n'.join(lines[-25:]))[-6000:]
              print('::error title=Kernel experiment failure::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joyeuse-mi-memory-kernel-failure-${{ github.run_id }}
          path: experiment-logs/
          if-no-files-found: warn
          retention-days: 14
