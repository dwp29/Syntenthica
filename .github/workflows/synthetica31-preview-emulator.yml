name: "Validate Synthetica 3.1 preview on Android emulator"
on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica31-preview-emulator.yml'
      - 'tests/run_neon31_emulator.py'
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "3.1 build run containing the separate preview"
        required: true
        type: string
      preview_sha256:
        description: "SHA-256 of that preview APK"
        required: true
        type: string
# Push-triggered validation is pinned to the latest successful 3.1 preview.
# For another build, change these fallback inputs or dispatch with explicit values.
permissions:
  contents: write
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate input
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id || '42362880121' }}
          PREVIEW_SHA256: ${{ inputs.preview_sha256 || '6b75f6cb4e254f1c3f7d9d3eb163143ee6db0d4a28893a62ef713a05540249bd' }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PREVIEW_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: synthetica31-preview-${{ inputs.build_run_id || '42362880121' }}
          run-id: ${{ inputs.build_run_id || '42362880121' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/preview31-artifact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require accelerated emulator
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo '::error::KVM unavailable: Android runtime checks did not run.'
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
      - name: Install emulator and API 35 image
        run: |
          set -euo pipefail
          SDK="$HOME/neon31-emulator-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK" ANDROID_AVD_HOME="$RUNNER_TEMP/neon31-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' 2>&1 | tail -12
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -f -n neon31 -k 'system-images;android-35;google_apis;x86_64' -d pixel_2
          test -f "$ANDROID_AVD_HOME/neon31.ini"
          python3 -m pip install --user --disable-pip-version-check pillow
      - name: Boot emulator and validate preview only
        env:
          PREVIEW_SHA256: ${{ inputs.preview_sha256 || '6b75f6cb4e254f1c3f7d9d3eb163143ee6db0d4a28893a62ef713a05540249bd' }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/preview31-artifact/Synthetica-3.1-Neon-PREVIEW-NOT-MANAGER.apk"
          printf '%s  %s\n' "$PREVIEW_SHA256" "$APK" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/neon31-test-output"
          emulator -avd neon31 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/neon31-test-output/emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 12
          if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/neon31-test-output/emulator.log"; exit 1; fi
          adb start-server
          timeout 240s adb -s emulator-5554 wait-for-device
          timeout 240s bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done'
          python3 tests/run_neon31_emulator.py --serial emulator-5554 --apk "$APK" --sha256 "$PREVIEW_SHA256" \
            --output "$RUNNER_TEMP/neon31-test-output" 2>&1 | tee "$RUNNER_TEMP/neon31-test-output/test.log"
          echo '::notice title=3.1 preview emulator::Light/dark/AMOLED/system, saved preferences and Device Check passed. Real root Manager was not tested.'
      - name: Transfer emulator screenshots or test log as Git blobs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'neon31-test-output'
          for name in ('settings-light.png','settings-dark.png','settings-amoled.png','settings-system-light.png','settings-system-dark.png','device-check.png','device-check.xml','settings-light.xml','settings-dark.xml','settings-amoled.xml','home.xml','test.log'):
              path=root/name
              if not path.is_file(): continue
              payload=root/(name+'.json')
              payload.write_text(json.dumps({'content':base64.b64encode(path.read_bytes()).decode(),'encoding':'base64'}))
              out=subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--method','POST','--input',str(payload),'--jq','.sha'],capture_output=True,text=True,check=True).stdout.strip()
              print(f'::notice title=Emulator {name} blob::{out}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: neon31-preview-emulator-${{ github.run_id }}
          path: ${{ runner.temp }}/neon31-test-output/
          retention-days: 7
          if-no-files-found: warn
