name: Diagnose Neon preview emulator log (temporary)
on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica30-preview-logs-temp.yml'
permissions:
  actions: read
  contents: write
jobs:
  logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: neon-preview-emulator-42348074508
          run-id: 42348074508
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/neon-emulator
      - name: Inspect failed step and recover UI diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'neon-emulator'
          def emit(title,text):
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice title={title}::{text}',flush=True)
          for file in sorted(root.rglob('*')):
              if not file.is_file(): continue
              emit('Output',f'{file.relative_to(root)} ({file.stat().st_size} bytes)')
              if file.name not in ('home.png','settings.png','settings-pink.png','home.xml','settings.xml','restarted-settings.xml','preferences-before-restart.xml','preferences-after-restart.xml'): continue
              body=root.parent/(file.name+'.blob.json')
              body.write_text(json.dumps({'content':base64.b64encode(file.read_bytes()).decode(),'encoding':'base64'}))
              blob=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--method','POST','--input',str(body),'--jq','.sha'],text=True).strip()
              emit(f'Diagnostic {file.name} blob',blob)
          PY
