name: "Joyeuse mi_memory compile-only probe — DO NOT FLASH"
on:
  workflow_dispatch:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/joyeuse-mi-memory-probe.yml'
      - 'synthetica-project/build_joyeuse_mi_memory_probe.py'
      - 'tests/test_build_joyeuse_mi_memory_probe.py'

permissions:
  contents: read

concurrency:
  group: joyeuse-mi-memory-compile-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc flex bison libssl-dev libelf-dev device-tree-compiler python3 curl git
          mkdir -p probe-logs
          printf '%s\n' 'COMPILE-ONLY PROBE. No image, ROM, installer or device validation.' 'Donor is sm8250 and is not proven to match Joyeuse. DO NOT FLASH.' > probe-logs/README-DO-NOT-FLASH.txt
      - name: Run host tests
        run: |
          python3 -m unittest discover -s tests -p 'test_build_joyeuse_mi_memory_probe.py' -v
          python3 -m unittest discover -s tests -p 'test_build_joyeuse_builtin_experiment.py' -v
      - name: Prepare pinned, disposable source and donor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mi-memory-kernel.tar.gz"
          curl -fsSL --retry 3 'https://codeload.github.com/Saamitk/kernel_xiaomi_sm6250-switchoff/tar.gz/c1e6f795b557b7bf92220c91f05a42b456de7a74' -o "$archive"
          echo "a68c9e306a3e14de92a258b185531a2562e3631f616a74b7882fc2667ac10ec0  $archive" | sha256sum -c -
          test "$(stat -c %s "$archive")" = 200408248
          mkdir "$RUNNER_TEMP/mi-memory-tree"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/mi-memory-tree"
          python3 synthetica-project/build_joyeuse_mi_memory_probe.py fetch --destination "$RUNNER_TEMP/mi-memory-donor"
          python3 synthetica-project/build_joyeuse_mi_memory_probe.py apply \
            --tree "$RUNNER_TEMP/mi-memory-tree" --donor "$RUNNER_TEMP/mi-memory-donor" | tee probe-logs/preparation.txt
      - name: Compile donor and UFS objects only (no kernel image)
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          export ARCH=arm64 LC_ALL=C
          tree="$RUNNER_TEMP/mi-memory-tree"
          out="$RUNNER_TEMP/mi-memory-out"
          mkdir "$out"
          cat artifacts/generated.config.txt build-kit/ci/rollercoaster/profiles/joyeuse-builtins-experimental.config > "$out/.config"
          printf '\nCONFIG_MI_MEMORY_SYSFS=y\n' >> "$out/.config"
          mo=(O="$out" ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
              LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
              READELF=llvm-readelf STRIP=llvm-strip SIZE=llvm-size HOSTCC=clang HOSTCXX=clang++
              HOSTLD=ld.lld HOSTAR=llvm-ar LLVM=1 LLVM_IAS=1
              KCFLAGS='-Wno-error=implicit-int -Wno-error=strict-prototypes')
          (
            cd "$tree"
            make "${mo[@]}" olddefconfig
            python3 "$GITHUB_WORKSPACE/synthetica-project/build_joyeuse_builtin_experiment.py" check-config \
              --baseline "$GITHUB_WORKSPACE/artifacts/generated.config.txt" --generated "$out/.config"
            grep -Fx 'CONFIG_MI_MEMORY_SYSFS=y' "$out/.config"
            cp "$out/.config" "$GITHUB_WORKSPACE/probe-logs/generated.config.txt"
            make -j4 "${mo[@]}" prepare scripts
            make -j4 "${mo[@]}" drivers/misc/mi-memory/ drivers/scsi/ufs/ufshcd.o
            test -s "$out/drivers/misc/mi-memory/mi_memory.o"
            llvm-nm -u "$out/drivers/misc/mi-memory/mi_memory.o" > "$GITHUB_WORKSPACE/probe-logs/unresolved-objects.txt"
            echo 'COMPILED OBJECTS ONLY. No full-kernel link or runtime/device test.'
          ) 2>&1 | tee probe-logs/compiler-console.txt
      - name: Surface compiler failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('probe-logs/compiler-console.txt')
          if p.is_file():
              lines = p.read_text(errors='replace').splitlines()
              important = [line for line in lines if any(word in line.lower() for word in ('error:', 'fatal error', 'error 1', 'error 2', 'failed'))]
              tail = ('\n'.join(important[-15:]) + '\n--- final lines ---\n' + '\n'.join(lines[-20:]))[-6000:]
              safe = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Compile-only diagnostic::' + safe)
          PY
      - name: Upload diagnostics only (no object or image)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: joyeuse-mi-memory-compile-only-${{ github.run_id }}
          path: probe-logs/
          if-no-files-found: warn
          retention-days: 14
