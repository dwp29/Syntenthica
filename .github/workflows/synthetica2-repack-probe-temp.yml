name: "Probe boot-v2 repacking behavior (temporary)"
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica2-repack-probe-temp.yml]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: Synthetica-2.0-neutron-MGLRU-on-DO-NOT-FLASH-42258512643
          path: ${{ runner.temp }}/evidence
          run-id: 42258512643
          github-token: ${{ github.token }}
      - name: Install synthetic fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static lz4 cpio > /dev/null
      - name: Exercise bundled ARM magiskboot against synthetic v2 fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/probe"
          mkdir -p "$t/rd" "$t/first" "$t/second"
          unzip -p release/Synthetica-2.0.zip tools/magiskboot > "$t/magiskboot"
          chmod +x "$t/magiskboot"
          printf '#!/bin/sh\nexit 0\n' > "$t/rd/init"
          ( cd "$t/rd"; printf 'init\n' | cpio -o -H newc --quiet ) | lz4 -l -z > "$t/ramdisk.lz4"
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])/'probe'
          spec=importlib.util.spec_from_file_location('bootfixture','tests/test_synthetica3_boot.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          (t/'original.img').write_bytes(m.boot(kernel=b'synthetic original kernel',ramdisk=(t/'ramdisk.lz4').read_bytes()))
          PY
          gh api 'repos/LineageOS/android_external_avb/git/blobs/7932b111ce2b8bb23ea50bebf42c201a20c4eea5' --jq .content | base64 -d > "$t/avbtool.py"
          test "$(git hash-object "$t/avbtool.py")" = 7932b111ce2b8bb23ea50bebf42c201a20c4eea5
          python3 "$t/avbtool.py" add_hash_footer --image "$t/original.img" --partition_size 67108864 --partition_name boot
          ( cd "$t/first"; qemu-arm-static "$t/magiskboot" unpack -n "$t/original.img" )
          cp "$RUNNER_TEMP/evidence/Image.gz.DO-NOT-FLASH" "$t/first/kernel"
          ( cd "$t/first"; PATCHVBMETAFLAG=false qemu-arm-static "$t/magiskboot" repack -n "$t/original.img" "$t/candidate.img" )
          ( cd "$t/second"; qemu-arm-static "$t/magiskboot" unpack -n "$t/candidate.img" )
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])/'probe'
          sys.path.insert(0,'build-kit/scripts'); import audit_synthetica3_boot as audit
          a,b=(audit.inspect_boot(t/n) for n in ('original.img','candidate.img'))
          r=audit.compare_boot(a,b,hashlib.sha256((Path(os.environ['RUNNER_TEMP'])/'evidence/Image.gz.DO-NOT-FLASH').read_bytes()).hexdigest())
          r['original_avb']=a['avb']; r['candidate_avb']=b['avb']
          r['original_bytes']=a['file_bytes'];r['candidate_bytes']=b['file_bytes']
          for p in ['ramdisk.cpio','dtb','second','extra','recovery_dtbo','kernel_dtb']:
              x,y=(t/d/p for d in ['first','second'])
              r['file_'+p]=((not x.exists() and not y.exists()) or (x.exists() and y.exists() and x.read_bytes()==y.read_bytes()))
          print('::notice title=Synthetic boot repack behavior::'+json.dumps(r))
          PY
