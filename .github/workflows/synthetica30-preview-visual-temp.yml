name: "Validate Neon preview on an Android emulator (temporary)"
on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica30-preview-visual-temp.yml'
permissions:
  contents: write
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: synthetica30-neon-preview-42347623465
          run-id: 42347623465
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/preview-artifact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check emulator acceleration
        id: kvm
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::KVM unavailable: emulator runtime test not run.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Android emulator and API 35 image
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          SDK="$HOME/neon-emulator-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK" ANDROID_AVD_HOME="$RUNNER_TEMP/neon-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' 2>&1 | tail -12
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -f -n neon-preview -k 'system-images;android-35;google_apis;x86_64' -d pixel_2
          test -f "$ANDROID_AVD_HOME/neon-preview.ini"
      - name: Boot emulator, launch preview and exercise navigation
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/preview-artifact/Synthetica-3.0-Neon-PREVIEW-NOT-MANAGER.apk"
          echo 'aab692aea781154d68a8cfaedeb7236674f6e033a979b6aa5420b81757993e48  '"$APK" | sha256sum -c -
          emulator -avd neon-preview -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 12
          if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          adb start-server
          timeout 240s adb wait-for-device
          timeout 240s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1
          adb install -r "$APK"
          adb shell am start -W -n 'net.ember.labs.neonpreview/com.rifsxd.ksunext.PreviewActivity'
          sleep 5
          adb shell uiautomator dump /sdcard/neon-window.xml > /dev/null
          adb exec-out cat /sdcard/neon-window.xml > "$RUNNER_TEMP/home.xml"
          grep -q 'PRATINJAU SAJA' "$RUNNER_TEMP/home.xml"
          adb exec-out screencap -p > "$RUNNER_TEMP/home.png"
          python3 - <<'PY'
          import os,re,subprocess,xml.etree.ElementTree as ET
          root=ET.parse(os.path.join(os.environ['RUNNER_TEMP'],'home.xml')).getroot()
          nodes=[n for n in root.iter('node') if n.get('text')=='Setelan']
          if not nodes: raise SystemExit('Settings tab or tile not found')
          def rect(n):
              m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.get('bounds',''))
              if not m: raise ValueError('invalid node bounds')
              return [int(v) for v in m.groups()]
          target=max(nodes,key=lambda n:rect(n)[3])
          x1,y1,x2,y2=rect(target)
          subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
          PY
          sleep 3
          adb shell uiautomator dump /sdcard/neon-settings.xml > /dev/null
          adb exec-out cat /sdcard/neon-settings.xml > "$RUNNER_TEMP/settings.xml"
          grep -q 'AKSEN NEON' "$RUNNER_TEMP/settings.xml"
          grep -q 'Animasi neon' "$RUNNER_TEMP/settings.xml"
          adb exec-out screencap -p > "$RUNNER_TEMP/settings.png"
          echo '::notice title=Android emulator preview::API 35 preview launched and navigation to neon settings passed; root Manager was not tested.'
      - name: Exercise accent and motion preferences across process restart
        if: steps.kvm.outputs.available == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PYTAP'
          import os,re,subprocess,xml.etree.ElementTree as ET
          root=ET.parse(os.path.join(os.environ['RUNNER_TEMP'],'settings.xml')).getroot()
          for text in ('Merah muda', 'Animasi neon'):
              nodes=[n for n in root.iter('node') if text in n.get('text','')]
              if not nodes: raise SystemExit(f'Settings label not found: {text}')
              def rect(n):
                  m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.get('bounds',''))
                  if not m: raise ValueError('invalid bounds')
                  return [int(v) for v in m.groups()]
              # A text descendant is sufficient: tapping it bubbles to the selectable row.
              target=min(nodes,key=lambda n:(rect(n)[2]-rect(n)[0])*(rect(n)[3]-rect(n)[1]))
              x1,y1,x2,y2=rect(target)
              subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
          PYTAP
          sleep 3
          adb shell run-as net.ember.labs.neonpreview cat shared_prefs/settings.xml > "$RUNNER_TEMP/preferences-before-restart.xml"
          grep -F '<string name="neon_accent">pink</string>' "$RUNNER_TEMP/preferences-before-restart.xml"
          grep -F '<boolean name="neon_motion" value="false"' "$RUNNER_TEMP/preferences-before-restart.xml"
          adb shell am force-stop net.ember.labs.neonpreview
          adb shell am start -W -n 'net.ember.labs.neonpreview/com.rifsxd.ksunext.PreviewActivity'
          sleep 4
          adb shell uiautomator dump /sdcard/neon-restarted-home.xml > /dev/null
          adb exec-out cat /sdcard/neon-restarted-home.xml > "$RUNNER_TEMP/restarted-home.xml"
          python3 - <<'PYTAP'
          import os,re,subprocess,xml.etree.ElementTree as ET
          root=ET.parse(os.path.join(os.environ['RUNNER_TEMP'],'restarted-home.xml')).getroot()
          nodes=[n for n in root.iter('node') if n.get('text')=='Setelan']
          if not nodes: raise SystemExit('Settings tab not found after restart')
          def rect(n):
              m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.get('bounds',''))
              if not m: raise ValueError('invalid bounds')
              return [int(v) for v in m.groups()]
          target=max(nodes,key=lambda n:rect(n)[3]); x1,y1,x2,y2=rect(target)
          subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
          PYTAP
          sleep 3
          adb shell uiautomator dump /sdcard/neon-restarted-settings.xml > /dev/null
          adb exec-out cat /sdcard/neon-restarted-settings.xml > "$RUNNER_TEMP/restarted-settings.xml"
          adb exec-out screencap -p > "$RUNNER_TEMP/settings-pink.png"
          adb shell run-as net.ember.labs.neonpreview cat shared_prefs/settings.xml > "$RUNNER_TEMP/preferences-after-restart.xml"
          grep -F '<string name="neon_accent">pink</string>' "$RUNNER_TEMP/preferences-after-restart.xml"
          grep -F '<boolean name="neon_motion" value="false"' "$RUNNER_TEMP/preferences-after-restart.xml"
          python3 - <<'PYASSERT'
          import os,xml.etree.ElementTree as ET
          root=ET.parse(os.path.join(os.environ['RUNNER_TEMP'],'restarted-settings.xml')).getroot()
          parents={c:p for p in root.iter() for c in p}
          def assert_checked(label, expected):
              candidates=[n for n in root.iter('node') if label in n.get('text','')]
              for node in candidates:
                  while node is not None:
                      if node.get('checkable') == 'true' and node.get('checked') == expected:
                          print(f'{label}: checkable row checked={expected}')
                          return
                      node=parents.get(node)
              raise SystemExit(f'Cannot confirm {label}: checkable row checked={expected}')
          assert_checked('Merah muda','true')
          assert_checked('Animasi neon','false')
          PYASSERT
          echo '::notice title=Android emulator preferences::Accent and motion changes were persisted and restored after restarting the preview process.'
      - name: Transfer screenshots for inspection
        if: always() && steps.kvm.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in home settings settings-pink; do
            [ -s "$RUNNER_TEMP/$name.png" ] || continue
            NAME="$name" python3 - <<'PY'
          import base64,json,os,pathlib,hashlib
          tmp=pathlib.Path(os.environ['RUNNER_TEMP']); name=os.environ['NAME']
          data=(tmp/(name+'.png')).read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n')
          (tmp/(name+'-blob.json')).write_text(json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}))
          print(f'::notice title=Screenshot {name} SHA-256::{hashlib.sha256(data).hexdigest()}')
          PY
            blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/$name-blob.json" --jq .sha)
            echo "::notice title=Screenshot $name blob::$blob"
          done
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: neon-preview-emulator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/home.png
            ${{ runner.temp }}/settings.png
            ${{ runner.temp }}/settings-pink.png
            ${{ runner.temp }}/preferences-before-restart.xml
            ${{ runner.temp }}/preferences-after-restart.xml
            ${{ runner.temp }}/restarted-settings.xml
            ${{ runner.temp }}/home.xml
            ${{ runner.temp }}/settings.xml
            ${{ runner.temp }}/emulator.log
          retention-days: 7
          if-no-files-found: warn
