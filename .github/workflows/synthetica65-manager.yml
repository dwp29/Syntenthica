name: "Synthetica Manager 6.5.0 — themes reworked, custom wallpaper"

on:
  push:
    branches: [arena/96cbd65a-synthentica]
    paths:
      - '.github/workflows/synthetica65-manager.yml'
      - 'synthetica-manager/**'
      - 'build-kit/scripts/build_manager_60_standalone.py'
      - 'build-kit/scripts/sign_manager_60_locally.py'
      - 'tests/test_synthetica60_*.py'
      - 'tests/verify_synthetica60_apk.py'
  workflow_dispatch:
  # Lets the thin dispatcher that lives on the default branch start this exact
  # job. GitHub only shows "Run workflow" when the file exists on main, and main
  # holds nothing but a README, so main calls this workflow by branch ref.
  workflow_call:

permissions:
  contents: write # unsigned APK, evidence logs and test output as unreferenced blobs only

jobs:
  manager:
    name: "Unsigned Manager 6.5.0 — standalone tree, pinned UAPI-4 daemon"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # When called from the default-branch dispatcher, github.ref is main;
          # the sources live on the working branch, so it is named explicitly.
          ref: arena/96cbd65a-synthentica
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Host guards for the standalone tree and universal helpers
        run: | 
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manager65-output"
          python3 -m unittest tests.test_synthetica60_standalone tests.test_synthetica60_signing -v \
            > "$RUNNER_TEMP/manager65-output/host-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/manager65-output/host-tests.log"; exit 1;
            }
          tail -n 6 "$RUNNER_TEMP/manager65-output/host-tests.log"
          python3 build-kit/scripts/build_manager_60_standalone.py --verify-only
      - name: Confirm the 6.5 theme and wallpaper changes are present
        run: |
          set -euo pipefail
          M="synthetica-manager/app/src/main/java/com/rifsxd/ksunext/ui/theme"
          # The two retired themes must be gone from both code and resources.
          if grep -rq "ANIME_WIBU\|GOTHIC_CRIMSON" "$M"; then
            echo '::error::A retired theme is still referenced'; exit 1
          fi
          if [ -e "synthetica-manager/app/src/main/res/drawable-nodpi/ic_emblem_anime.png" ] \
             || [ -e "synthetica-manager/app/src/main/res/drawable-nodpi/ic_emblem_gothic.png" ]; then
            echo '::error::Artwork for a retired theme is still packaged'; exit 1
          fi
          # The wallpaper feature must actually be wired into the canvas and the UI.
          grep -q 'CustomWallpaperLayer()' "$M/Glass.kt"
          grep -q 'WallpaperControls()' "$M/AppearanceControls.kt"
          test -f "$M/CustomWallpaper.kt"
          # Signature of the new accent fan-out.
          grep -q 'fun accentTierForStyle' "$M/VisualStyles.kt"
          echo "6.5 theme and wallpaper gates passed"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk60"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SYNTHETICA_APP_ID=net.ember.labs.standalone" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865' 'cmake;3.22.1' 2>&1 | tail -10
      - name: Compile unsigned Manager 6.5.0 from the standalone tree
        run: |
          set -euo pipefail
          python3 build-kit/scripts/build_manager_60_standalone.py \
            --workdir "$RUNNER_TEMP/manager65-source" \
            --output "$RUNNER_TEMP/manager65-output/Manager-6.5.1-standalone-UNSIGNED.apk" \
            2>&1 | tee "$RUNNER_TEMP/manager65-output/build.log" || {
              # Surface the actual compiler errors as run annotations. Downloading job logs
              # needs a token scope this environment does not always have, so the failure has
              # to be readable from the run page itself.
              grep -E "^e: |error:|Execution failed|What went wrong|Caused by|> Task .*FAILED|^\* |^FAILURE" \
                "$RUNNER_TEMP/manager65-output/build.log" | head -n 30 | while IFS= read -r line; do
                  echo "::error::$line"
                done
              # The Gradle error body sits a few lines under "What went wrong".
              grep -A 6 -m1 "What went wrong" "$RUNNER_TEMP/manager65-output/build.log" \
                | tail -n 5 | while IFS= read -r line; do echo "::error::ctx $line"; done
              grep -A 4 -m1 "^e: " "$RUNNER_TEMP/manager65-output/build.log" \
                | tail -n 3 | while IFS= read -r line; do echo "::error::detail $line"; done
              exit 1
            }
      - name: Verify identity, permissions, daemon, alignment and unsigned status
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/manager65-output/Manager-6.5.1-standalone-UNSIGNED.apk"
          OUT="$RUNNER_TEMP/manager65-output"
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          # Each check names itself, so a failure is readable from the run page even when
          # job logs cannot be downloaded.
          step() { echo "--- $1"; }
          "$TOOLS/aapt" dump badging "$APK" > "$OUT/badging.txt"
          step "identity"
          grep -F "name='net.ember.labs.standalone'" "$OUT/badging.txt" || { echo "::error::package name mismatch (expected net.ember.labs.standalone)"; grep -m3 "^package" "$OUT/badging.txt"; exit 1; }
          grep -F "versionCode='75100'" "$OUT/badging.txt" || { echo "::error::versionCode is not 75100"; grep -m1 "^package" "$OUT/badging.txt"; exit 1; }
          grep -F "versionName='6.5.1'" "$OUT/badging.txt" || { echo "::error::versionName is not 6.5.1"; grep -m1 "^package" "$OUT/badging.txt"; exit 1; }
          step "native code"
          grep -F "native-code: 'arm64-v8a'" "$OUT/badging.txt" || { echo "::error::arm64-v8a missing"; grep -m1 "native-code" "$OUT/badging.txt"; exit 1; }
          step "alignment"
          "$TOOLS/zipalign" -c -p 4 "$APK" || { echo "::error::not zip-aligned at 4"; exit 1; }
          "$TOOLS/zipalign" -c -P 16 4 "$APK" || { echo "::error::not 16 KiB page aligned"; exit 1; }
          step "permissions against the 2.0 reference"
          # aapt dumps the package-scoped DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION, which is
          # derived from the applicationId by Kotlin. Normalise that one name so the diff
          # still proves every real permission matches; anything else must be identical.
          normalise() {
            sed -E "s/name='[^']*\\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'/name='<appid>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'/"
          }
          "$TOOLS/aapt" dump permissions "$APK" | grep '^uses-permission' | sort | normalise > "$RUNNER_TEMP/manager65-permissions.txt" || true
          "$TOOLS/aapt" dump permissions release/Synthetica-2.0.apk | grep '^uses-permission' | sort | normalise > "$RUNNER_TEMP/reference-permissions.txt" || true
          test -s "$RUNNER_TEMP/manager65-permissions.txt" || { echo "::error::built APK declares no permissions"; exit 1; }
          test -s "$RUNNER_TEMP/reference-permissions.txt" || { echo "::error::reference APK unreadable"; exit 1; }
          if ! diff -u "$RUNNER_TEMP/reference-permissions.txt" "$RUNNER_TEMP/manager65-permissions.txt" > "$RUNNER_TEMP/perm.diff"; then
            echo "::error::permission set differs from the 2.0 reference"
            # Print the actual difference: a bare failure message cost a whole CI round trip.
            head -n 12 "$RUNNER_TEMP/perm.diff" | while IFS= read -r l; do echo "::error::perm $l"; done
            exit 1
          fi
          step "static DEX gates"
          python3 tests/verify_synthetica60_apk.py "$APK" 2>&1 | tee "$OUT/static-checks.txt" || {
            grep -E "ValueError|Error|missing|stale" "$OUT/static-checks.txt" | head -5 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          step "signature"
          if "$TOOLS/apksigner" verify "$APK" > "$OUT/signature-check.txt" 2>&1; then
            echo '::error::Expected an unsigned build'; exit 1
          fi
          grep -q 'DOES NOT VERIFY' "$OUT/signature-check.txt" || { echo "::error::unexpected signature state"; cat "$OUT/signature-check.txt"; exit 1; }
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$sha" > "$OUT/SHA256.txt"
          echo "::notice title=Unsigned Manager 6.5.0 SHA256::$sha"
      - name: Sign a directly installable build with a fresh debug key
        run: |
          set -euo pipefail
          # A throwaway key, generated in this job and stored nowhere. It exists only because
          # the real release key is unavailable, and the package name differs from the released
          # 6.0.0 so this installs beside it rather than failing to update it.
          fail() { echo "::error::$1"; [ -s "$RUNNER_TEMP/manager65-output/sign.log" ] && tail -n 12 "$RUNNER_TEMP/manager65-output/sign.log"; exit 1; }
          TOOLS="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          OUT="$RUNNER_TEMP/manager65-output"
          APK="$OUT/Manager-6.5.1-standalone-UNSIGNED.apk"
          SIGNED="$OUT/Synthetica-Manager-6.5.1-standalone-DEBUG-SIGNED.apk"
          KS="$OUT/debug-only.keystore"

          test -f "$APK" || fail "unsigned APK not found at $APK"

          keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
            -alias standalone -keyalg RSA -keysize 4096 -validity 3650 \
            -storepass synthesa-debug-only -keypass synthesa-debug-only \
            -dname "CN=Synthetica Manager Standalone (debug key), O=Synthetica, C=ID" \
            > "$OUT/sign.log" 2>&1 || fail "keytool could not generate the debug key"

          "$TOOLS/zipalign" -p -f 4 "$APK" "$OUT/aligned.apk" >> "$OUT/sign.log" 2>&1 \
            || fail "zipalign failed before signing"

          "$TOOLS/apksigner" sign --ks "$KS" --ks-key-alias standalone \
            --ks-pass pass:synthetica-debug-only --key-pass pass:synthetica-debug-only \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "$SIGNED" "$OUT/aligned.apk" >> "$OUT/sign.log" 2>&1 \
            || fail "apksigner sign failed"

          "$TOOLS/apksigner" verify --verbose --print-certs "$SIGNED" > "$OUT/signed-verify.txt" 2>&1 \
            || fail "signed APK does not verify"
          grep -q "Verifies" "$OUT/signed-verify.txt" || fail "apksigner reports no verification"
          grep -q "Verified using v2 scheme" "$OUT/signed-verify.txt" || fail "signature scheme v2 missing"
          grep -q "Verified using v3 scheme" "$OUT/signed-verify.txt" || fail "signature scheme v3 missing"

          sha=$(sha256sum "$SIGNED" | cut -d' ' -f1)
          echo "::notice title=Signed 6.5.1 (debug key) SHA256::$sha"
          python3 - <<'PY'
          import base64,json,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP'])
          apk=t/'manager65-output/Synthetica-Manager-6.5.1-standalone-DEBUG-SIGNED.apk'
          (t/'manager65-signed-blob.json').write_text(json.dumps({'content':base64.b64encode(apk.read_bytes()).decode(),'encoding':'base64'}))
          print('[info] signed APK bytes:', apk.stat().st_size)
          PY
          blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/manager65-signed-blob.json" --jq .sha)
          echo "::notice title=Signed 6.5.1 APK blob::$blob"
      - name: Transfer unsigned Manager as Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP'])
          apk=t/'manager65-output/Manager-6.5.1-standalone-UNSIGNED.apk'
          (t/'manager65-blob.json').write_text(json.dumps({'content':base64.b64encode(apk.read_bytes()).decode(),'encoding':'base64'}))
          PY
          blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/manager65-blob.json" --jq .sha)
          echo "::notice title=Unsigned Manager 6.5.0 blob::$blob"
      - name: Transfer diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for log in "$RUNNER_TEMP/manager65-output/build.log" "$RUNNER_TEMP/manager65-output/host-tests.log"; do
            if [ -s "$log" ]; then
              LOG="$log" python3 - <<'PY'
          import base64,json,os,pathlib
          p=pathlib.Path(os.environ['LOG']); t=pathlib.Path(os.environ['RUNNER_TEMP'])
          (t/'manager65-log.json').write_text(json.dumps({'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'}))
          PY
              blob=$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input "$RUNNER_TEMP/manager65-log.json" --jq .sha)
              echo "::notice title=Manager 6.5.0 $(basename "$log") blob::$blob"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetica65-manager-${{ github.run_id }}
          path: ${{ runner.temp }}/manager65-output/
          retention-days: 14
          if-no-files-found: warn

# rebuild after aapt fix
