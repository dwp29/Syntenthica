name: "Neon Manager local signing safety tests"
on:
  push:
    branches:
      - arena/96cbd65a-syntenthica
    paths:
      - '.github/workflows/synthetica30-neon-signing-tests.yml'
      - 'build-kit/scripts/sign_neon_manager_locally.py'
      - 'tests/test_neon_signing.py'
      - 'tests/test_neon_signing_integration.py'
      - 'tests/verify_synthetica30_apk.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  throwaway-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: synthetica30-neon-unsigned-42345579689
          run-id: 42345579689
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/neon-input
      - name: Install Android signing tools
        run: |
          set -euo pipefail
          SDK="$HOME/neon-sign-test-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSLo "$RUNNER_TEMP/cmdline.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;36.1.0' 2>&1 | tail -8
      - name: Exercise refusals and temporary-key mechanics
        env:
          NEON_SIGNING_INTEGRATION: '1'
          NEON_UNSIGNED_APK: ${{ runner.temp }}/neon-input/Synthetica-Manager-3.0.0-Neon-UNSIGNED.apk
        run: |
          set -euo pipefail
          export NEON_ANDROID_BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.1.0"
          echo '2c04be6a223f53217305e39a0b6cce9e6c7e01c2df5d59f19826427b3bcd6441  '"$NEON_UNSIGNED_APK" | sha256sum -c -
          python3 -m unittest discover -s tests -p 'test_neon_signing*.py' -v
          echo '::notice title=Signing test::Only an ephemeral test key was generated; the real Manager identity was neither accessed nor recreated.'
