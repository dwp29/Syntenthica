name: "Diagnose initial Synthetica 2.0 experimental builds"
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: ['.github/workflows/synthetica2-diagnose.yml']

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Surface concise failure diagnostics as check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh run view 42237485378 --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha \
            --jq 'select(.status == "completed" and .conclusion == "failure") | .headSha' \
            > "$RUNNER_TEMP/identity" 2> "$RUNNER_TEMP/identity.error"; then
            echo '::error title=Run identity::Unable to read original run through API'
            exit 1
          fi
          if ! grep -Fx 'f2cc808999df7da91f19504a9a4bb0b3b1864798' "$RUNNER_TEMP/identity"; then
            echo '::error title=Run identity::Unexpected original run identity or status'
            exit 1
          fi
          echo '::notice title=Run identity::Verified initial failed build'
          for job in 127958803333 127958803348; do
            if ! gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/$job.log" 2> "$RUNNER_TEMP/$job.error"; then
              JOB="$job" python3 - <<'PY'
          import os, re
          from pathlib import Path
          job = os.environ['JOB']
          text = (Path(os.environ['RUNNER_TEMP']) / (job + '.error')).read_text(errors='replace')
          text = re.sub(r'https?://\S+', '<url>', text)
          text = text[:1500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Log retrieval ' + job + '::' + (text or 'unknown error'))
          PY
              exit 1
            fi
          done
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          for job in ('127958803333', '127958803348'):
              log = (Path(os.environ['RUNNER_TEMP']) / (job + '.log')).read_text(errors='replace')
              rows = log.splitlines()
              matches = [i for i, row in enumerate(rows) if re.search(
                  r'error:|fatal error|Traceback|RuntimeError|ValueError|failed|FAIL |not found|not supported', row, re.I)]
              if not matches:
                  print('::warning title=Diagnostic ' + job + '::No recognized failure line')
                  continue
              chosen = []
              for i in matches[-12:]:
                  chosen.extend(rows[max(i - 1, 0):min(i + 3, len(rows))])
              unique = list(dict.fromkeys(chosen))[-35:]
              text = '\n'.join(re.sub(r'https?://\S+', '<url>', row[:650]) for row in unique)
              text = text[-14000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Diagnostic ' + job + '::' + text)
          PY
