name: Synthetica AxSandbox vault quarantine source check
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-axsandbox-vault-quarantine.yml, synthetica-project/prepare_axsandbox_vault_quarantine.py, synthetica-project/patches/axsandbox/FileVaultManager-QUARANTINE-ONLY.patch, tests/test_prepare_axsandbox_vault_quarantine.py]
  workflow_dispatch:
# Source-only quarantine; never builds, signs, publishes, installs or uses vault data.
permissions:
  contents: read
  checks: write
jobs:
  quarantine:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test quarantine guards
        run: python -m unittest discover -s tests -p 'test_prepare_axsandbox_vault_quarantine.py' -v
      - name: Fetch and verify the exact upstream source file
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            'repos/AxionAOSP/android_packages_apps_AxSandbox/contents/src/com/android/axion/sandbox/io/FileVaultManager.kt?ref=df0f91f826a32bb5e7cd2aff53de80f6b1b99f62' \
            > "$RUNNER_TEMP/FileVaultManager.kt"
          echo '1883370ab8b947990c65f06b6d317990d068dc521e629e9e452ec89931d43ab5  '"$RUNNER_TEMP/FileVaultManager.kt" | sha256sum -c -
      - name: Prepare and compare quarantine prototype
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python synthetica-project/prepare_axsandbox_vault_quarantine.py \
            --source "$RUNNER_TEMP/FileVaultManager.kt" --output "$RUNNER_TEMP/FileVaultManager-quarantine.kt" \
            > "$RUNNER_TEMP/vault-quarantine-result.json"
          echo '2b1108eaa8df623a598e081b4fa1326affe480d6ac0adc62b1ef2a36e6b896d6  '"$RUNNER_TEMP/FileVaultManager-quarantine.kt" | sha256sum -c -
          diff -u --label a/src/com/android/axion/sandbox/io/FileVaultManager.kt --label b/src/com/android/axion/sandbox/io/FileVaultManager.kt \
            "$RUNNER_TEMP/FileVaultManager.kt" "$RUNNER_TEMP/FileVaultManager-quarantine.kt" > "$RUNNER_TEMP/vault.patch" || test "$?" -eq 1
          cmp "$RUNNER_TEMP/vault.patch" synthetica-project/patches/axsandbox/FileVaultManager-QUARANTINE-ONLY.patch
      - name: Record bounded source-only result
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'vault-quarantine-result.json'
          result=json.loads(path.read_text()) if path.is_file() else {'status':'PREPARATION_FAILED_HOLD'}
          result['outcome']=os.environ['PREPARE_OUTCOME']
          text=json.dumps(result,ensure_ascii=True,separators=(',',':'))
          if len(text)>10000: raise SystemExit('Quarantine summary exceeds bound')
          ok=(result.get('status')=='SOURCE_QUARANTINE_ONLY_NOT_BUILT_NOT_INSTALLED_HOLD'
              and result.get('vault_is_functional') is False and result['outcome']=='success')
          payload={'name':'Synthetica AxSandbox vault quarantine','head_sha':os.environ['GITHUB_SHA'],'status':'completed',
                   'conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Source quarantine only; vault disabled, not built','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(),stdout=subprocess.DEVNULL,check=True)
          PY
