name: "Probe — patch Synthetica di beberapa pohon source"

# No compilation here. The question: which reachable tree can actually carry all
# eight Synthetica patches? Roll 3.3 says 4.14.370, but that string was written by
# whoever built the zip -- it is not evidence of a public tree. Kinesis tops out at
# 4.14.344 and Saamitk at 4.14.357, so the patches are measured against each.
on:
  push:
    paths:
      - '.github/workflows/probe-roll370-patches.yml'
      - 'build-kit/ci/synthetica2-experimental/patches/**'
      - 'build-kit/ci/synthetica3-rc/**'
      - 'build-kit/ci/synthetica3-root/**'
  workflow_dispatch:

permissions:
  contents: write   # to publish the report on a throwaway branch

jobs:
  probe:
    name: "Uji 8 patch di tiap kandidat source"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Clone setiap kandidat, lalu uji patch
        id: matrix
        continue-on-error: true
        run: |
          # GitHub runs this block as `bash -e {0}`. -e is on before the first
          # line, and `set -uo pipefail` does not turn it off -- five runs died at
          # the first failing patch that way. `set +e` is the line that matters.
          set +e
          mkdir -p "$RUNNER_TEMP/probe"
          REP="$RUNNER_TEMP/probe/report.txt"

          PATCHES=(
            "build-kit/ci/synthetica2-experimental/patches/0001-mglru-4.14.patch"
            "build-kit/ci/synthetica2-experimental/patches/0002-uclamp-walt-stune.patch"
            "build-kit/ci/synthetica2-experimental/patches/0003-uclamp-correctness.patch"
            "build-kit/ci/synthetica2-experimental/patches/0004-mglru-anon-file.patch"
            "build-kit/ci/synthetica2-experimental/patches/0005-mglru-pagewalk-caf.patch"
            "build-kit/ci/synthetica2-experimental/patches/0006-neutron-enum-cast.patch"
            "build-kit/ci/synthetica3-rc/0001-ksu-manager-preserve-seccomp.patch"
            "build-kit/ci/synthetica3-root/0001-manager-fd-after-exec.patch"
          )
          SHORT=(mglru uclamp-walt uclamp-corr mglru-anon mglru-pw neutron ksu-seccomp ksu-fd)

          # label|repo|ref   -- the first column is what the report shows.
          CANDS=(
            "Kinesis 4.14.344|https://github.com/clarencelol/kernel_xiaomi_sm6250|kinesis-v29"
            "Kinesis 4.14.343|https://github.com/clarencelol/kernel_xiaomi_sm6250|kinesis-v30"
            "Saamitk 4.14.357|https://github.com/Saamitk/kernel_xiaomi_sm6250-switchoff|a"
          )

          echo "### Uji 8 patch Synthetica per pohon source" >> "$REP"
          echo >> "$REP"
          HEADER="| Pohon | Versi |"
          DIV="|---|---|"
          for s in "${SHORT[@]}"; do HEADER="$HEADER $s |"; DIV="$DIV---|"; done
          HEADER="$HEADER Bersih |"
          DIV="$DIV---|"
          echo "$HEADER" >> "$REP"
          echo "$DIV" >> "$REP"

          for c in "${CANDS[@]}"; do
            label=${c%%|*}; rest=${c#*|}; repo=${rest%%|*}; ref=${rest#*|}
            dir="$RUNNER_TEMP/tree-${ref}"
            rm -rf "$dir"
            if ! git clone -q --depth 1 --branch "$ref" "$repo" "$dir" 2>"$RUNNER_TEMP/probe/clone.err"; then
              echo "| $label | *clone gagal* | | | | | | | | | - |" >> "$REP"
              continue
            fi
            v=$(cd "$dir" && sed -n 's/^\(VERSION\|PATCHLEVEL\|SUBLEVEL\) *= */\1=/p' Makefile | tr -d '\n' \
                | sed 's/VERSION=\([0-9]*\)PATCHLEVEL=\([0-9]*\)SUBLEVEL=\([0-9]*\)/\1.\2.\3/')
            row="| $label | $v |"
            ok=0
            for p in "${PATCHES[@]}"; do
              name=$(basename "$p")
              cell="?"
              if [ ! -f "$p" ]; then
                cell="hilang"; row="$row $cell |"; continue
              fi
              if ( cd "$dir" && git apply --check "$OLDPWD/$p" >/dev/null 2>&1 ); then
                cell="BERSIH"; ok=$((ok+1))
              else
                # "sudah ada" is not a conflict and must not be read as one.
                if ( cd "$dir" && patch -p1 --dry-run --forward < "$OLDPWD/$p" 2>&1 ) \
                     | grep -qi "Reversed (or previously applied)"; then
                  cell="sudah ada"; ok=$((ok+1))
                else
                  cell="KONFLIK"
                fi
              fi
              row="$row $cell |"
            done
            echo "$row $ok/8 |" >> "$REP"
          done

          echo >> "$REP"
          echo "Legenda: **BERSIH** = git apply --check lolos · **sudah ada** = pohonnya" >> "$REP"
          echo "memang sudah memuat perubahan itu · **KONFLIK** = perlu ditulis ulang." >> "$REP"

      - name: Publish the report regardless of what happened
        if: always()
        run: |
          set +e
          cd "$RUNNER_TEMP/probe"
          git init -q -b probe-output .
          cp "$GITHUB_WORKSPACE/build-kit/ci/synthetica2-experimental/patches/0001-mglru-4.14.patch" /dev/null 2>&1
          git checkout -q --orphan probe-output 2>/dev/null || true
          cp report.txt "$GITHUB_WORKSPACE/.probe-report.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name  "probe-bot"
          git config user.email "probe@localhost"
          git checkout -q -B probe-output
          git add -f .probe-report.txt
          git mv -f .probe-report.txt report.txt 2>/dev/null || mv -f .probe-report.txt report.txt
          git add -f report.txt
          git commit -q -m "probe: report"
          git push -q --force origin probe-output
