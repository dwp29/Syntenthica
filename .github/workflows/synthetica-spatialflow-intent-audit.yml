name: Synthetica SpatialFlow release intent audit
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-spatialflow-intent-audit.yml]
  workflow_dispatch:
# Reads only the SHA-locked public release APK; does not publish or edit it.
permissions:
  contents: read
  checks: write
jobs:
  audit:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test intent tree parsing controls
        run: |
          python -m unittest discover -s tests -p 'test_scan_apk_packages.py' -v
          python -m unittest discover -s tests -p 'test_probe_spatialflow_intent.py' -v
      - name: Select Android manifest readers
        id: setup
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          tools=$(find "$root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$tools/aapt" && test -x "$tools/aapt2"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/spatial-intent"
      - name: Inspect the exact release manifest without running the app
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          tools='${{ steps.setup.outputs.tools }}'
          python -u synthetica-project/probe_spatialflow_intent.py --work "$RUNNER_TEMP/spatial-intent" \
            --report "$RUNNER_TEMP/spatial-intent-result.json" --aapt "$tools/aapt" --aapt2 "$tools/aapt2"
      - name: Record bounded results including failures
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'spatial-intent-result.json'
          result=json.loads(path.read_text()) if path.is_file() else {'status':'PREPARATION_FAILED_HOLD'}
          result['outcome']=os.environ['AUDIT_OUTCOME']
          text=json.dumps(result,ensure_ascii=True,separators=(',',':'))
          if len(text)>30000: raise SystemExit('Intent audit exceeds bounded check size')
          ok=result.get('status')=='READ_ONLY_INTENT_INSPECTION_HOLD' and result['outcome']=='success'
          payload={'name':'Synthetica SpatialFlow intent audit','head_sha':os.environ['GITHUB_SHA'],'status':'completed',
                   'conclusion':'success' if ok else 'neutral',
                   'output':{'title':'Manifest routing only; no runtime verdict','summary':text}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(),stdout=subprocess.DEVNULL,check=True)
          PY
