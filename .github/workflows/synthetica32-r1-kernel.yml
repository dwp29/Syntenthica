name: "Synthetica 3.2-r1 - rebuild from 3.1 with features retained"

on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths:
      - '.github/workflows/synthetica32-r1-kernel.yml'
      - 'build-kit/scripts/build_synthetica32_r1.py'
      - 'build-kit/ci/synthetica32-r1/**'
      - 'tests/test_synthetica32_r1.py'
      - 'tests/fixtures/synthetica32-r1/**'
  workflow_dispatch:

permissions:
  contents: write # Unreferenced public build evidence; never export a private key.

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kernel build tools
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get install -y -qq \
            gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc flex bison libssl-dev libelf-dev device-tree-compiler cpio lz4 xz-utils zstd \
            python3 patch openssl zip unzip rsync git curl binutils kmod
      - name: Fetch exact 3.1 and earlier experiment build evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/git/blobs/0f815b773d39a8f0b392a7d190be9ca1ad702ead" > "$RUNNER_TEMP/transfer31.zip"
          echo '67c804f049c9bb00977c067e06bc663f75a8b7782b4f47bd2626b3fd5a36a847  '"$RUNNER_TEMP/transfer31.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/transfer31.zip" generated.config.txt > "$RUNNER_TEMP/config31"
          unzip -p "$RUNNER_TEMP/transfer31.zip" Module.symvers > "$RUNNER_TEMP/symvers31"
          echo '4b53a2cb030e9aa55ff798a3ee5c773c0eb50e56cd36430d2874adcb56fa236d  '"$RUNNER_TEMP/config31" | sha256sum -c -
          echo '1ce7153529b53f3f4bf361ea2e061ec575e712cd47cc5a0f10a854cf91d19ac3  '"$RUNNER_TEMP/symvers31" | sha256sum -c -
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/git/blobs/d5e292c91a36c7706deedfdb9f1ca8b7a703ee3e" > "$RUNNER_TEMP/transfer20.zip"
          echo '742068c09eb99f6eb37d55aa3ee1bca9ee156db592d10d3d901fca738900dabc  '"$RUNNER_TEMP/transfer20.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/transfer20.zip" generated.config.txt > "$RUNNER_TEMP/config20exp"
          echo 'c72503550d74446f5af3573288b4e93dc1407854c5df338d20681d1866ccb96c  '"$RUNNER_TEMP/config20exp" | sha256sum -c -
          echo "S31_EXACT_CONFIG=$RUNNER_TEMP/config31" >> "$GITHUB_ENV"
          echo "S31_EXACT_SYMVERS=$RUNNER_TEMP/symvers31" >> "$GITHUB_ENV"
          echo "S3RC_TESTED_CONFIG=$RUNNER_TEMP/config20exp" >> "$GITHUB_ENV"
      - name: Download and verify the 3.1 Neutron toolchain
        timeout-minutes: 15
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/neutron-clang-06092026.tar.zst"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          echo "531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30  $archive" | sha256sum -c -
          test "$(stat -c %s "$archive")" = 77768187
          mkdir "$RUNNER_TEMP/neutron"
          tar -I zstd -xf "$archive" -C "$RUNNER_TEMP/neutron"
          echo "S2X_TOOLCHAIN_BIN=$RUNNER_TEMP/neutron/bin" >> "$GITHUB_ENV"
      - name: Test real source guards and prepare isolated 3.1-based kit
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_synthetica32_r1.py' -v
          python3 -m unittest discover -s tests -p 'test_synthetica3_root.py' -v
          python3 build-kit/scripts/build_synthetica32_r1.py prepare --source build-kit \
            --destination "$RUNNER_TEMP/s32r1-kit" --baseline artifacts/generated.config.txt
      - name: Compile 3.2-r1 and same-build modules
        timeout-minutes: 80
        env:
          SP_JOBS: '4'
          SP_RELEASE_VERSION: '3.2-r1'
          SP_PROFILE: synthetica
          SP_BUILD_NAME: synthetica
          SP_BUILD_KVER: '3.2-r1'
          SP_EXPECT_RELEASE: 4.14.357-openela-synthetica-3.2-r1
          PYTHONOPTIMIZE: '0'
        run: |
          set -euo pipefail
          export SP_WORK_DIR="$RUNNER_TEMP/s32r1-work"
          export S2X_HELPER="$GITHUB_WORKSPACE/build-kit/scripts/build_synthetica32_r1.py"
          export S2X_BASELINE="$GITHUB_WORKSPACE/artifacts/generated.config.txt"
          if ! python3 "$RUNNER_TEMP/s32r1-kit/scripts/build_chronicle_base.py"; then
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          log=Path(os.environ['RUNNER_TEMP'])/'s32r1-kit/artifacts/build.log'
          rows=(log.read_text(errors='replace') if log.exists() else 'No build log').splitlines()
          indexes=[i for i,row in enumerate(rows) if re.search(r'error:|fatal error|undefined reference|\bFAIL\b|not found|refused', row, re.I)]
          chosen=[]
          for i in indexes[-12:]: chosen.extend(rows[max(0,i-1):min(len(rows),i+3)])
          text=re.sub(r'https?://\S+','<url>','\n'.join(dict.fromkeys(chosen or rows[-40:]))[-12000:])
          for i in range(0,len(text),1800):
              part=text[i:i+1800].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error title=3.2-r1 compile diagnostic {i//1800+1}::{part}')
          PY
            exit 1
          fi
      - name: Check 3.1 feature config, entire ABI, source guards, Manager and modules
        run: |
          set -euo pipefail
          python3 build-kit/scripts/build_synthetica32_r1.py finish \
            --kit "$RUNNER_TEMP/s32r1-kit" --out "$RUNNER_TEMP/s32r1-work/tree/out-synthetica" \
            --baseline artifacts/generated.config.txt --tested-config "$S3RC_TESTED_CONFIG" \
            --baseline31 "$S31_EXACT_CONFIG" --symvers31 "$S31_EXACT_SYMVERS" \
            --result "$RUNNER_TEMP/s32r1-result" --toolchain-bin "$S2X_TOOLCHAIN_BIN" \
            --neutron-archive "$RUNNER_TEMP/neutron-clang-06092026.tar.zst" 2> "$RUNNER_TEMP/finish-error.txt" || {
              cat "$RUNNER_TEMP/finish-error.txt"
              python3 - <<'PY'
          import os
          from pathlib import Path
          s=(Path(os.environ['RUNNER_TEMP'])/'finish-error.txt').read_text(errors='replace')[-4000:]
          print('::error title=3.2-r1 verification diagnostic::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
              exit 1
            }
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])/'s32r1-result'
          provenance={'repository':os.environ['GITHUB_REPOSITORY'],'commit':os.environ['GITHUB_SHA'],
                      'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                      'run_url':f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                      'limitations':'Compile and host tests only; no target ROM integration or physical boot.'}
          (r/'PROVENANCE.json').write_text(json.dumps(provenance,indent=2)+'\n')
          paths=sorted(p for p in r.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt')
          (r/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(r).as_posix()}\n' for p in paths))
          PY
          (cd "$RUNNER_TEMP/s32r1-result" && sha256sum -c SHA256SUMS.txt)
      - name: Upload compile evidence (not flashable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Synthetica-3.2-r1-DO-NOT-FLASH-${{ github.run_id }}
          path: ${{ runner.temp }}/s32r1-result/
          if-no-files-found: error
          retention-days: 7
      - name: Transfer public compile evidence (no private keys)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, zipfile
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']); root=t/'s32r1-result'; output=t/'s32r1-transfer.zip'
          files=sorted(p for p in root.rglob('*') if p.is_file())
          if any(p.suffix in {'.pem','.key','.pk8','.p12','.jks'} for p in files):
              raise SystemExit('private key-like file found; refuse transfer')
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in files: z.write(p,p.relative_to(root).as_posix())
          raw=output.read_bytes()
          (t/'s32r1-blob.json').write_text(json.dumps({'content':base64.b64encode(raw).decode('ascii'),'encoding':'base64'}))
          print('::notice title=3.2-r1 transfer SHA256::'+hashlib.sha256(raw).hexdigest())
          print('::notice title=3.2-r1 Image SHA256::'+hashlib.sha256((root/'Image.gz.DO-NOT-FLASH').read_bytes()).hexdigest())
          PY
          blob=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input "$RUNNER_TEMP/s32r1-blob.json" --jq .sha)
          test "${#blob}" = 40
          echo "::notice title=3.2-r1 transfer Git blob::$blob"
          echo '::notice title=Scope::Host/compile evidence only; ROM integration and physical Android boot not validated.'
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetica-3.2-r1-build-failed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s32r1-kit/artifacts/build.log
            ${{ runner.temp }}/s32r1-kit/artifacts/FAILED.txt
            ${{ runner.temp }}/finish-error.txt
          if-no-files-found: warn
          retention-days: 7
