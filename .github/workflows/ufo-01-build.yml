name: "UFO-0.1 — Kinesis 4.14.344 + seluruh fitur Synthetica 3.2"

# The tree work was done by hand first, then pinned here so it can be replayed:
# Kinesis 4.14.344, the eight Synthetica patches, KernelSU-Next legacy-susfs-v2,
# SuSFS v2.3.0 and NoMount v2.0.0. Everything in build-kit/ci/ufo01/ was produced
# by that session and audited with AUDIT PASSED before this workflow existed.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/96cbd65a-syntenthica
      - arena/96cbd65a-synthentica
    paths:
      - '.github/workflows/ufo-01-build.yml'
      - 'build-kit/ci/ufo01/**'

permissions:
  contents: write   # the build log is only readable on an evidence branch

concurrency:
  group: ufo-01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain the 3.2 builds used
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 lld-18 llvm-18 libclang-18-dev gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi bc flex bison libssl-dev libelf-dev \
            device-tree-compiler cpio lz4 xz-utils python3 patch openssl zip \
            rsync git curl binutils kmod
          # Debian ships these versioned. The 4.14 Makefile invokes bare `ld.lld`
          # and `aarch64-linux-gnu-*`, so unversioned names must exist on PATH.
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100 || true
          for t in clang clang++ llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if ! command -v "$t" >/dev/null 2>&1; then
              sudo update-alternatives --install "/usr/bin/$t" "$t" "/usr/bin/$t-18" 100 || true
            fi
          done
          ld.lld --version | head -1
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

      - name: Lay the root/stealth stack onto a pristine Kinesis tree
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b kinesis-v29 \
            https://github.com/clarencelol/kernel_xiaomi_sm6250 "$RUNNER_TEMP/ufo"
          cd "$RUNNER_TEMP/ufo"
          K="$GITHUB_WORKSPACE/build-kit/ci/ufo01"

          cp -a "$K/KernelSU-Next" .
          cp -a "$K/nomount" fs/nomount
          cp    "$K/susfs.c" fs/
          cp    "$K/susfs.h" "$K/susfs_def.h" include/linux/
          cp -a "$K/root-integration" tools/
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu

          git apply "$K/01-synthetica32-and-susfs-tracking.patch"
          cp "$K/miatoll_defconfig" arch/arm64/configs/vendor/xiaomi/

      - name: Audit — must print AUDIT PASSED or the build is pointless
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ufo"
          bash tools/root-integration/audit_hooks.sh . | tee "$RUNNER_TEMP/audit.txt"
          # Match the closing line only. The script prints "AUDIT PASSED" from an inner
          # verifier even when the outer audit fails, and grepping for the bare string
          # read that as success -- which is how a run that failed the audit still
          # reached the build step.
          grep -q "^AUDIT PASSED (0 errors" "$RUNNER_TEMP/audit.txt"

      - name: Build
        run: |
          # Failures have to be self-reporting: the job log endpoint returns 404 for
          # this repo, and the summary step is the only channel that survives.
          set +e
          cd "$RUNNER_TEMP/ufo"
          LOG="$RUNNER_TEMP/build.log"
          : > "$LOG"

          # The defconfig lives at configs/vendor/xiaomi/, and whether a nested
          # `make vendor/xiaomi/miatoll_defconfig` target exists depends on how this
          # Makefile hands goals to scripts/kconfig. Copying the file and running
          # olddefconfig works regardless of that, so the build does not hinge on a
          # detail that differs between 4.14 trees.
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          cp arch/arm64/configs/vendor/xiaomi/miatoll_defconfig .config

          export ARCH=arm64
          # clang, chosen the way the 3.2 recipe did: CC/LD named explicitly. LLVM=1
          # together with CROSS_COMPILE makes the 4.14 Makefile prefer
          # aarch64-linux-gnu-gcc in places and clang in others.
          export CROSS_COMPILE=aarch64-linux-gnu-
          # arch/arm64/Makefile hard-errors when CROSS_COMPILE_ARM32 is unset and
          # CONFIG_COMPAT is on, so give it the armhf compiler explicitly.
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER=ufo KBUILD_BUILD_HOST=synthetica

          # mrproper refuses on a tree that already holds generated files, and its
          # failure was swallowed: prepare3 then died, KernelSU-Next built against
          # an empty config, and the real error ("No hooks were defined") was three
          # layers away from the cause. mrproper runs first, before anything is
          # copied, and its exit code is checked.
          # mrproper walks every driver including drivers/kernelsu, and that path
          # only exists once the symlink is in place -- so the clean fails while
          # cleaning the very thing that was just added. Remove the symlink for the
          # clean, put it back after.
          rm -f drivers/kernelsu
          make ARCH=arm64 mrproper >> "$LOG" 2>&1
          RC_CLEAN=$?
          if [ "$RC_CLEAN" -ne 0 ]; then
            echo "mrproper failed (exit $RC_CLEAN)" >> "$LOG"
            tail -20 "$LOG"
            exit 1
          fi
          cp arch/arm64/configs/vendor/xiaomi/miatoll_defconfig .config

          make O=out ARCH=arm64 olddefconfig >> "$LOG" 2>&1
          RC_CFG=$?
          if [ "$RC_CFG" -ne 0 ]; then
            echo "olddefconfig failed (exit $RC_CFG)" >> "$LOG"
            tail -20 "$LOG"
            exit 1
          fi

          make -j"$(nproc)" O=out ARCH=arm64 Image.gz >> "$LOG" 2>&1
          RC=$?
          echo "exit=$RC" >> "$LOG"
          tail -60 "$LOG"

          # A green tick is not a kernel. The step above ran under `set +e` so the
          # log survives a failure, and the previous run reported success with no
          # Image.gz and no artifact at all -- 90 seconds for a whole kernel.
          # Success is now defined as the file existing.
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "::error::Image.gz not produced (make exit=$RC) -- see the summary for the first error"
            exit 1
          fi
          ls -l out/arch/arm64/boot/Image.gz

      - name: Show the first real error, since the log link is not readable
        if: always()
        run: |
          set +e
          LOG="$RUNNER_TEMP/build.log"
          echo "## Ringkasan error" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$LOG" ]; then
            echo "tidak ada log build" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE "error:|Error [0-9]|No rule to make target|not found|Unknown" "$LOG"             | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Report what was produced, and what was not tested
        if: always()
        run: |
          set +e
          cd "$RUNNER_TEMP/ufo"
          OUT="$RUNNER_TEMP/summary.md"
          echo "## UFO-0.1 build" > "$OUT"
          echo >> "$OUT"
          echo "Tree: Kinesis kinesis-v29 (4.14.344) + 8 patch Synthetica + KSU-Next + SuSFS 2.3.0 + NoMount" >> "$OUT"
          echo >> "$OUT"
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            ls -l out/arch/arm64/boot/Image.gz >> "$OUT"
            python3 build-kit/ci/ufo01/show_version.py out/arch/arm64/boot/Image.gz >> "$OUT" 2>&1
          else
            echo "**Image.gz tidak dihasilkan.** Build gagal sebelum kompilasi selesai." >> "$OUT"
          fi
          echo >> "$OUT"
          echo "Belum diuji: boot, deep sleep, drain, thermal. Itu butuh perangkat." >> "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the build log, since the log endpoints are not readable here
        if: always()
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/.ufo-evidence"
          {
            echo "### UFO-0.1 build"
            echo
            echo "commit: $GITHUB_SHA"
            echo
            echo "#### error pertama"
            echo '```'
            grep -nE "error:|Error [0-9]|No rule to make target|not found|fatal:" "$RUNNER_TEMP/build.log" 2>/dev/null | head -15
            echo '```'
            echo
            echo "#### ekor log (60 baris)"
            echo '```'
            tail -60 "$RUNNER_TEMP/build.log" 2>/dev/null
            echo '```'
            echo
            echo "#### audit"
            echo '```'
            tail -5 "$RUNNER_TEMP/audit.txt" 2>/dev/null
            echo '```'
          } > "$GITHUB_WORKSPACE/.ufo-evidence/BUILD-LOG.md"
          cp "$RUNNER_TEMP/build.log" "$GITHUB_WORKSPACE/.ufo-evidence/build-full.log" 2>/dev/null
          git config user.name "ufo-bot"
          git config user.email "ufo@localhost"
          git checkout -q -B ufo-evidence
          git add -f .ufo-evidence
          git commit -q -m "ufo-01: build log"
          git push -q --force origin ufo-evidence

      - name: Keep the image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufo-01-image
          path: |
            ${{ runner.temp }}/ufo/out/arch/arm64/boot/Image.gz
            ${{ runner.temp }}/ufo/out/arch/arm64/boot/dts/qcom/*.dtb
          if-no-files-found: warn
          retention-days: 14
