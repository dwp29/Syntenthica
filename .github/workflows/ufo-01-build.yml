name: "UFO-0.1 — Kinesis 4.14.344 + seluruh fitur Synthetica 3.2"

# The tree work was done by hand first, then pinned here so it can be replayed:
# Kinesis 4.14.344, the eight Synthetica patches, KernelSU-Next legacy-susfs-v2,
# SuSFS v2.3.0 and NoMount v2.0.0. Everything in build-kit/ci/ufo01/ was produced
# by that session and audited with AUDIT PASSED before this workflow existed.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/96cbd65a-syntenthica
      - arena/96cbd65a-synthentica
    paths:
      - '.github/workflows/ufo-01-build.yml'
      - 'build-kit/ci/ufo01/**'

permissions:
  contents: write   # the build log is only readable on an evidence branch

concurrency:
  group: ufo-01-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain the 3.2 builds used
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 lld-18 llvm-18 libclang-18-dev gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi bc flex bison libssl-dev libelf-dev \
            device-tree-compiler cpio lz4 xz-utils python3 patch openssl zip \
            rsync git curl binutils kmod
          # Debian ships these versioned. The 4.14 Makefile invokes bare `ld.lld`
          # and `aarch64-linux-gnu-*`, so unversioned names must exist on PATH.
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100 || true
          for t in clang clang++ llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if ! command -v "$t" >/dev/null 2>&1; then
              sudo update-alternatives --install "/usr/bin/$t" "$t" "/usr/bin/$t-18" 100 || true
            fi
          done
          ld.lld --version | head -1
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

      - name: Lay the root/stealth stack onto a pristine Kinesis tree
        run: |
          set -euo pipefail
          git clone -q --depth 1 -b kinesis-v29 \
            https://github.com/clarencelol/kernel_xiaomi_sm6250 "$RUNNER_TEMP/ufo"
          cd "$RUNNER_TEMP/ufo"
          K="$GITHUB_WORKSPACE/build-kit/ci/ufo01"

          cp -a "$K/KernelSU-Next" .
          cp -a "$K/nomount" fs/nomount
          cp    "$K/susfs.c" fs/
          cp    "$K/susfs.h" "$K/susfs_def.h" include/linux/
          cp -a "$K/root-integration" tools/

          # Kinesis ships plain KernelSU at drivers/staging/kernelsu and wires it to
          # CONFIG_KSU in drivers/staging/{Kconfig,Makefile}. With KernelSU-Next also
          # present, both compile and the linker stops on 20 duplicate symbols
          # (ksu_type, is_manager_apk, track_throne...). This build wants
          # KernelSU-Next + SuSFS, so the stock one is unhooked from the build.
          # It is left on disk: deleting vendored source is not this workflow's job.
          sed -i 's|^obj-$(CONFIG_KSU)[[:space:]]*+= kernelsu/kernel/|#&   # disabled: KernelSU-Next is used instead|' drivers/staging/Makefile
          sed -i 's|^source "drivers/staging/kernelsu/kernel/Kconfig"|#&   # disabled: KernelSU-Next is used instead|' drivers/staging/Kconfig
          if grep -qE '^obj-\$\(CONFIG_KSU\).*kernelsu' drivers/staging/Makefile; then
            echo "-- stock KernelSU is still wired in drivers/staging/Makefile"
            exit 1
          fi
          echo "-- stock KernelSU unhooked; KernelSU-Next supplies CONFIG_KSU"

          # The audit reads drivers/kernelsu, so the link has to exist before it runs.
          # It is rebuilt after mrproper in the build step; only its presence for the
          # audit matters here.
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu

          git apply "$K/01-synthetica32-and-susfs-tracking.patch"
          cp "$K/miatoll_defconfig" arch/arm64/configs/vendor/xiaomi/

      - name: Audit — must print AUDIT PASSED or the build is pointless
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ufo"
          bash tools/root-integration/audit_hooks.sh . | tee "$RUNNER_TEMP/audit.txt"
          # Match the closing line only. The script prints "AUDIT PASSED" from an inner
          # verifier even when the outer audit fails, and grepping for the bare string
          # read that as success -- which is how a run that failed the audit still
          # reached the build step.
          grep -q "^AUDIT PASSED (0 errors" "$RUNNER_TEMP/audit.txt"

      - name: Build
        run: |
          # Failures have to be self-reporting: the job log endpoint returns 404 for
          # this repo, and the summary step is the only channel that survives.
          set +e
          cd "$RUNNER_TEMP/ufo"
          LOG="$RUNNER_TEMP/build.log"
          : > "$LOG"

          # The defconfig lives at configs/vendor/xiaomi/, and whether a nested
          # `make vendor/xiaomi/miatoll_defconfig` target exists depends on how this
          # Makefile hands goals to scripts/kconfig. Copying the file and running
          # olddefconfig works regardless of that, so the build does not hinge on a
          # detail that differs between 4.14 trees.
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          # With O=out the config belongs in out/. A .config in the source tree makes
          # prepare3 declare the tree unclean (see Makefile prepare3) and abort -- which
          # is what killed every run up to this one.
          cp arch/arm64/configs/vendor/xiaomi/miatoll_defconfig out/.config

          export ARCH=arm64
          # clang, chosen the way the 3.2 recipe did: CC/LD named explicitly. LLVM=1
          # together with CROSS_COMPILE makes the 4.14 Makefile prefer
          # aarch64-linux-gnu-gcc in places and clang in others.
          # This Makefile writes `CC = $(CROSS_COMPILE)gcc` with a plain `=`, which
          # overrides an exported CC. Environment variables therefore never reach the
          # compiler: clang arrived as aarch64-linux-gnu-gcc, then as plain gcc, and
          # both rejected the clang flags. Command-line assignments win over `=`, so
          # the tools go on the make line below.
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          # Two facts have to be satisfied at once, and each fix alone breaks the other:
          #   * CROSS_COMPILE must be non-empty, or the Makefile never adds --target
          #     and clang compiles for the host ("register 'sp' unsuitable for global
          #     register variables on this target").
          #   * CROSS_COMPILE must not reach CC, or `CC = $(CROSS_COMPILE)gcc` turns
          #     clang into aarch64-linux-gnu-gcc.
          # Make-line assignments are seen by the --target logic (it reads the
          # variable) but CC is overridden on the same line, so both hold.
          MAKEARGS="CC=clang CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld AR=llvm-ar"
          MAKEARGS="$MAKEARGS NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump"
          MAKEARGS="$MAKEARGS STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "-- compiler: $(command -v clang) $(clang --version | head -1)" >> "$LOG"
          export KBUILD_BUILD_USER=ufo KBUILD_BUILD_HOST=synthetica

          # mrproper refuses on a tree that already holds generated files, and its
          # failure was swallowed: prepare3 then died, KernelSU-Next built against an
          # empty config, and the real error ("No hooks were defined") was three
          # layers from the cause. Clean first, check the exit code.
          #
          # The drivers/kernelsu link is created HERE, once, after the clean. Making
          # it in the copy step and again after mrproper is what produced the last
          # failure: mrproper walks drivers/ including the link, and a link that a
          # previous cp had turned into a directory survives `rm -f`.
          if [ -e drivers/kernelsu ] || [ -L drivers/kernelsu ]; then
            rm -rf drivers/kernelsu
          fi
          make ARCH=arm64 mrproper >> "$LOG" 2>&1
          RC_CLEAN=$?
          if [ "$RC_CLEAN" -ne 0 ]; then
            echo "mrproper failed (exit $RC_CLEAN)" >> "$LOG"
            tail -20 "$LOG"
            exit 1
          fi
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "drivers/kernelsu/Kconfig does not resolve after linking" >> "$LOG"
            ls -la drivers/ | grep -i kernelsu >> "$LOG"
            tail -5 "$LOG"
            exit 1
          fi
          # out/ may not exist yet; cp into a missing directory fails and leaves no
          # .config, after which olddefconfig starts from nothing and asks about
          # every NEW symbol until it aborts.
          mkdir -p out
          # Kinesis needs three repairs before it links; each is named in an actual
          # build log. The script verifies its own work and exits non-zero if any
          # repair did not land.
          bash "$GITHUB_WORKSPACE/build-kit/ci/ufo01/fixups/apply-tree-fixups.sh" . \
            >> "$LOG" 2>&1
          RC_FIX=$?
          if [ "$RC_FIX" -ne 0 ]; then
            echo "tree fixups failed (exit $RC_FIX)" >> "$LOG"
            tail -10 "$LOG"
            exit 1
          fi

          cp arch/arm64/configs/vendor/xiaomi/miatoll_defconfig out/.config
          if [ ! -f out/.config ]; then
            echo "out/.config was not created" >> "$LOG"
            exit 1
          fi
          echo "-- config in use (KSU/LRU/UCLAMP rows):" >> "$LOG"
          grep -cE "^CONFIG_" out/.config >> "$LOG"
          grep -E "API_MASK|CPU_MASK|CONFIG_KSU=|CONFIG_LRU_GEN=" out/.config >> "$LOG"

          make O=out ARCH=arm64 $MAKEARGS olddefconfig >> "$LOG" 2>&1
          RC_CFG=$?
          if [ "$RC_CFG" -ne 0 ]; then
            echo "olddefconfig failed (exit $RC_CFG)" >> "$LOG"
            tail -20 "$LOG"
            exit 1
          fi

          make -j"$(nproc)" O=out ARCH=arm64 $MAKEARGS Image.gz >> "$LOG" 2>&1
          RC=$?
          echo "exit=$RC" >> "$LOG"
          tail -60 "$LOG"

          # A green tick is not a kernel. The step above ran under `set +e` so the
          # log survives a failure, and the previous run reported success with no
          # Image.gz and no artifact at all -- 90 seconds for a whole kernel.
          # Success is now defined as the file existing.
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "::error::Image.gz not produced (make exit=$RC) -- see the summary for the first error"
            exit 1
          fi
          ls -l out/arch/arm64/boot/Image.gz

      - name: Show the first real error, since the log link is not readable
        if: always()
        run: |
          set +e
          LOG="$RUNNER_TEMP/build.log"
          echo "## Ringkasan error" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$LOG" ]; then
            echo "tidak ada log build" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE "error:|Error [0-9]|No rule to make target|not found|Unknown" "$LOG"             | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble the flashable zip
        if: success()
        run: |
          # No `set -e`: a silent abort here produced a failed step with no message,
          # and the publish step that follows can only report what it is told.
          set -uo pipefail
          trap 'rc=$?; echo "::error::assemble failed at line $LINENO (status $rc)"; \
                echo "assemble failed at line $LINENO (status $rc)" \
                  >> "$GITHUB_WORKSPACE/.ufo-evidence/assemble.txt" 2>/dev/null' ERR
          mkdir -p "$GITHUB_WORKSPACE/.ufo-evidence"
          : > "$GITHUB_WORKSPACE/.ufo-evidence/assemble.txt"
          IMG="$RUNNER_TEMP/ufo/out/arch/arm64/boot/Image.gz"
          K="$GITHUB_WORKSPACE/build-kit/ci/ufo01"

          # The AnyKernel3 skeleton is Roll 3.3's own: the same ak3-core.sh, busybox,
          # magiskboot, magiskpolicy, update-binary and updater-script that package
          # shipped. Only Image.gz, anykernel.sh and the DTB differ -- and the DTB is
          # removed, because UFO-0.1 keeps the ROM's DTB rather than replacing it.
          rm -rf "$RUNNER_TEMP/zip"
          mkdir -p "$RUNNER_TEMP/zip"
          cp -a "$K/anykernel/skeleton/." "$RUNNER_TEMP/zip/"
          cp "$IMG" "$RUNNER_TEMP/zip/Image.gz"
          cp "$K/anykernel/anykernel.sh" "$RUNNER_TEMP/zip/anykernel.sh"
          cp "$K/anykernel/README-PAKET.txt" "$RUNNER_TEMP/zip/README-PAKET.txt"
          echo "image bytes: $(stat -c%s "$IMG" 2>/dev/null)"
          echo "files in package: $(find "$RUNNER_TEMP/zip" -type f | wc -l)"

          # Nothing may be silently absent from a flashable package.
          for f in anykernel.sh Image.gz tools/ak3-core.sh tools/magiskboot \
                   META-INF/com/google/android/update-binary; do
            if [ ! -f "$RUNNER_TEMP/zip/$f" ]; then
              echo "::error::missing from package: $f"
              exit 1
            fi
          done
          if [ -f "$RUNNER_TEMP/zip/dtb" ]; then
            echo "::error::a dtb slipped into the package; UFO-0.1 must not replace it"
            exit 1
          fi

          cd "$RUNNER_TEMP/zip"
          zip -q -r "$RUNNER_TEMP/UFO-0.1-miatoll-4.14.344.zip" .
          ls -l "$RUNNER_TEMP/UFO-0.1-miatoll-4.14.344.zip"
          sha256sum "$RUNNER_TEMP/UFO-0.1-miatoll-4.14.344.zip"
          {
            echo
            echo "#### zip siap flash"
            echo '```'
            sha256sum "$RUNNER_TEMP/UFO-0.1-miatoll-4.14.344.zip"
            python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(len(z.namelist()), 'berkas'); [print(' ', n) for n in z.namelist() if n.endswith(('anykernel.sh','Image.gz'))]" "$RUNNER_TEMP/UFO-0.1-miatoll-4.14.344.zip"
            echo '```'
            echo "Belum di-flash siapa pun."
          } > "$GITHUB_WORKSPACE/.ufo-evidence/zip.txt"

      - name: Report what was produced, and what was not tested
        if: always()
        run: |
          set +e
          cd "$RUNNER_TEMP/ufo"
          OUT="$RUNNER_TEMP/summary.md"
          echo "## UFO-0.1 build" > "$OUT"
          echo >> "$OUT"
          echo "Tree: Kinesis kinesis-v29 (4.14.344) + 8 patch Synthetica + KSU-Next + SuSFS 2.3.0 + NoMount" >> "$OUT"
          echo >> "$OUT"
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            ls -l out/arch/arm64/boot/Image.gz >> "$OUT"
            python3 "$GITHUB_WORKSPACE/build-kit/ci/ufo01/show_version.py" out/arch/arm64/boot/Image.gz >> "$OUT" 2>&1
          else
            echo "**Image.gz tidak dihasilkan.** Build gagal sebelum kompilasi selesai." >> "$OUT"
          fi
          echo >> "$OUT"
          echo "Belum diuji: boot, deep sleep, drain, thermal. Itu butuh perangkat." >> "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the build log, since the log endpoints are not readable here
        if: always()
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/.ufo-evidence"
          {
            echo "### UFO-0.1 build"
            echo
            echo "commit: $GITHUB_SHA"
            echo
            echo "#### error pertama"
            echo '```'
            grep -nE "error:|Error [0-9]|No rule to make target|not found|fatal:" "$RUNNER_TEMP/build.log" 2>/dev/null | head -15
            echo '```'
            echo
            echo "#### ekor log (60 baris)"
            echo '```'
            tail -60 "$RUNNER_TEMP/build.log" 2>/dev/null
            echo '```'
            echo
            echo "#### audit"
            echo '```'
            tail -5 "$RUNNER_TEMP/audit.txt" 2>/dev/null
            echo '```'
          } > "$GITHUB_WORKSPACE/.ufo-evidence/BUILD-LOG.md"
          # The artifact cannot be downloaded from outside the runner, so the proof
          # that matters travels in the evidence branch: size, hash and the version
          # string baked into the image itself.
          IMG="$RUNNER_TEMP/ufo/out/arch/arm64/boot/Image.gz"
          {
            echo
            echo "#### hasil"
            if [ -f "$IMG" ]; then
              echo '```'
              ls -l "$IMG"
              sha256sum "$IMG"
              python3 "$GITHUB_WORKSPACE/build-kit/ci/ufo01/show_version.py" "$IMG" 2>&1
              python3 "$GITHUB_WORKSPACE/build-kit/ci/ufo01/verify_image.py" "$IMG" 2>&1 || echo "VERIFIKASI GAGAL"
              echo '```'
            else
              echo "Image.gz tidak ada."
            fi
          } >> "$GITHUB_WORKSPACE/.ufo-evidence/BUILD-LOG.md"
          cp "$RUNNER_TEMP/build.log" "$GITHUB_WORKSPACE/.ufo-evidence/build-full.log" 2>/dev/null
          {
            echo
            echo "#### zip siap flash"
            echo '```'
            cat "$GITHUB_WORKSPACE/.ufo-evidence/zip.txt" 2>/dev/null || echo "(tidak ada)"
            echo
            echo "catatan perakitan:"
            cat "$GITHUB_WORKSPACE/.ufo-evidence/assemble.txt" 2>/dev/null || echo "(tidak ada)"
            echo '```'
          } >> "$GITHUB_WORKSPACE/.ufo-evidence/BUILD-LOG.md"
          git config user.name "ufo-bot"
          git config user.email "ufo@localhost"
          git checkout -q -B ufo-evidence
          git add -f .ufo-evidence
          git commit -q -m "ufo-01: build log"
          git push -q --force origin ufo-evidence

      - name: Fail if a requested feature is not actually in the image
        if: always()
        run: |
          set +e
          IMG="$RUNNER_TEMP/ufo/out/arch/arm64/boot/Image.gz"
          if [ ! -f "$IMG" ]; then exit 0; fi   # the build step already failed
          python3 "$GITHUB_WORKSPACE/build-kit/ci/ufo01/verify_image.py" "$IMG"
          # MGLRU, UCLAMP, WALT, KernelSU, SuSFS, NoMount. A green build with a
          # silently missing feature is the thing worth failing on.

      - name: Publish the flashable zip on its own branch
        if: success()
        run: |
          # The artifact download is blocked from outside the runner, and a zip the
          # owner cannot obtain is not a deliverable. A branch can carry it.
          set +e
          cd "$GITHUB_WORKSPACE"
          Z="$RUNNER_TEMP/UFO-0.1-miatoll-4.14.344.zip"
          if [ ! -f "$Z" ]; then echo "zip missing"; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/.ufo-release"
          cp "$Z" "$GITHUB_WORKSPACE/.ufo-release/"
          sha256sum "$Z" > "$GITHUB_WORKSPACE/.ufo-release/UFO-0.1-miatoll-4.14.344.sha256"
          git config user.name "ufo-bot"
          git config user.email "ufo@localhost"
          git checkout -q -B ufo-release
          git add -f .ufo-release
          git commit -q -m "ufo-0.1: flashable zip (image sha $GITHUB_SHA)"
          git push -q --force origin ufo-release
          echo "pushed to branch ufo-release"

      - name: Keep the image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufo-01-image
          path: |
            ${{ runner.temp }}/ufo/out/arch/arm64/boot/Image.gz
            ${{ runner.temp }}/UFO-0.1-miatoll-4.14.344.zip
          if-no-files-found: warn
          retention-days: 14
