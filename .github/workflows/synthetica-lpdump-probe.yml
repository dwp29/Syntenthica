name: Synthetica logical partition independent controls
on:
  push:
    branches: [arena/96cbd65a-syntenthica]
    paths: [.github/workflows/synthetica-lpdump-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  controls:
    if: github.ref == 'refs/heads/arena/96cbd65a-syntenthica'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install host filesystem reader
        run: python -m pip install --disable-pip-version-check --require-hashes -r synthetica-project/requirements-boot-audit.txt
      - name: Run LP and filesystem synthetic controls
        run: |
          python -m unittest discover -s tests -p 'test_expand_product_lp.py' -v
          python -m unittest discover -s tests -p 'test_feature_ext4.py' -v
      - name: Download pinned public AOSP host tools
        id: fetch
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 900 --max-filesize 734003200 \
            'https://ci.android.com/builds/submitted/16644040/aosp_cf_x86_64_only_phone-userdebug/latest/raw/otatools.zip' \
            -o "$RUNNER_TEMP/otatools.zip"
          echo 'bc85557aa0c59a7d0b48b8175250948d67b2d0f293bd74eb8d5753ba4ad7781f  '"$RUNNER_TEMP/otatools.zip" | sha256sum -c -
      - name: Cross-check resized synthetic metadata with AOSP lpdump
        id: probe
        run: |
          mkdir "$RUNNER_TEMP/lpdump-probe"
          python -u synthetica-project/probe_lpdump_tool.py --archive "$RUNNER_TEMP/otatools.zip" \
            --work "$RUNNER_TEMP/lpdump-probe" --report "$RUNNER_TEMP/lpdump-result.json"
      - name: Record independent control result
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python - <<'PY2'
          import json, os, subprocess
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'])/'lpdump-result.json'
          result = json.loads(path.read_text()) if path.exists() else {'status': 'PREPARATION_FAILED_HOLD'}
          ok = os.environ['PROBE_OUTCOME'] == 'success' and result.get('status') == 'SYNTHETIC_CONTROLS_PASSED'
          payload = {'name': 'Synthetica independent liblp controls', 'head_sha': os.environ['GITHUB_SHA'],
                     'status': 'completed', 'conclusion': 'success' if ok else 'neutral',
                     'output': {'title': 'AOSP lpdump synthetic control; no device test', 'summary': json.dumps(result)}}
          subprocess.run(['gh','api','--method','POST','repos/dwp29/Syntenthica/check-runs','--input','-'],
                         input=json.dumps(payload).encode(), stdout=subprocess.DEVNULL, check=True)
          PY2
